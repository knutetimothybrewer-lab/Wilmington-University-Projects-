<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 3: Designing Lessons with AI That Work for Every Learner</title>
<link rel="icon" href="data:,">
<style>
/* ===== Colors: edit here. Light is the default. Dark is an optional toggle. ===== */
:root{
  --bg:#fbf8f3; --surface:#ffffff; --surface2:#f3efe7; --text:#1d2733; --muted:#475260; --line:#cfc7b8;
  --primary:#1f5f7a; --on-primary:#ffffff; --primary-ink:#1f5f7a; --primary-soft:#e2eff4;
  --accent:#9c4511; --on-accent:#ffffff; --accent-soft:#fdeadb;
  --good:#17623a; --good-soft:#e2f4e8; --err:#a31d1d; --err-soft:#fbe5e5; --chk:#744400; --chk-soft:#fff1cf;
  --focus:#0b57d0; --shadow:0 2px 10px rgba(30,40,50,.10);
}
html[data-theme="dark"]{
  --bg:#101921; --surface:#1a2631; --surface2:#223140; --text:#eaf0f5; --muted:#b9c6d2; --line:#3b4d5e;
  --primary:#7cc4de; --on-primary:#0b1a22; --primary-ink:#8fd0e8; --primary-soft:#1d3947;
  --accent:#f0a06a; --on-accent:#1f1006; --accent-soft:#3a2514;
  --good:#8fe0ae; --good-soft:#173a29; --err:#ffa3a3; --err-soft:#411f1f; --chk:#ffd780; --chk-soft:#3b2f10;
  --focus:#9bbcff; --shadow:0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;overflow-x:hidden}
h1,h2,h3,p{margin:0}
p+p{margin-top:.6rem}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-80px;background:var(--primary);color:var(--on-primary);padding:.7rem 1rem;border-radius:8px;z-index:50;font-weight:700}
.skip:focus{top:8px}
svg.i{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}

/* header */
.top{max-width:60rem;margin:0 auto;padding:.7rem 16px .3rem}
.brandrow{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .8rem;justify-content:space-between}
.brand{font-size:.9rem;font-weight:700;color:var(--primary-ink);letter-spacing:.01em}
.ctrls{display:flex;flex-wrap:wrap;gap:.4rem}
button,.btn,a.btn{font:inherit;min-height:44px;min-width:44px;cursor:pointer}
.tool{background:var(--surface);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:.25rem .7rem;font-size:.85rem;font-weight:600;display:inline-flex;align-items:center;gap:.4rem;justify-content:center}
.tool[aria-pressed="true"],.tool[aria-expanded="true"]{background:var(--primary-soft);border-color:var(--primary-ink)}
.tool:disabled{opacity:.55;cursor:not-allowed}
#menu{max-width:60rem;margin:.4rem auto 0;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:.6rem;box-shadow:var(--shadow)}
#menu[hidden]{display:none}
#menu ol{list-style:none;margin:0;padding:0;display:grid;gap:.3rem}
#menu button{width:100%;text-align:left;background:transparent;border:2px solid transparent;border-radius:12px;padding:.4rem .7rem;color:var(--text);display:flex;justify-content:space-between;gap:.6rem;align-items:center;font-size:.9rem}
#menu button:hover{background:var(--surface2)}
#menu button[aria-current="step"]{border-color:var(--primary-ink);background:var(--primary-soft);font-weight:700}
.mins{white-space:nowrap;color:var(--muted);font-size:.85rem}
.menu-total{font-size:.85rem;color:var(--muted);padding:.4rem .7rem 0}

/* main */
main{max-width:60rem;margin:0 auto;padding:.6rem 16px 7rem}
.screen{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:1.2rem 1.1rem 1.4rem;box-shadow:var(--shadow);position:relative}
@media(min-width:700px){.screen{padding:1.8rem 2rem 2rem}}
.screen.enter{animation:inR .38s ease-out both}
.screen.enter.back{animation-name:inL}
@keyframes inR{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
.kicker{display:flex;flex-wrap:wrap;gap:.4rem .7rem;align-items:center;font-size:.85rem;color:var(--muted);font-weight:600;margin-bottom:.5rem}
.about{background:var(--surface2);border-radius:999px;padding:.1rem .7rem}
.screen h2{font-size:1.65rem;line-height:1.2;color:var(--primary-ink);margin-bottom:.8rem;outline:none}
.screen h3{font-size:1.15rem;margin:1.1rem 0 .4rem}
.lead{font-size:1.1rem}
.learn,.remember{border-radius:14px;padding:.7rem .95rem;margin:0 0 1rem;display:flex;gap:.6rem;align-items:flex-start}
.learn{background:var(--primary-soft);border:2px solid var(--primary-ink)}
.remember{background:var(--accent-soft);border:2px solid var(--accent);margin:1.4rem 0 0}
.learn b,.remember b{white-space:nowrap}
.stack>*+*{margin-top:1rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.grid2{display:grid;gap:1rem}.grid3{display:grid;gap:1rem}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.big-quote{font-size:1.5rem;line-height:1.35;font-weight:700}

/* components */
.badge{display:inline-flex;align-items:center;gap:.35rem;background:var(--accent-soft);color:var(--text);border:1.5px dashed var(--accent);border-radius:999px;font-size:.8rem;font-weight:700;padding:.05rem .6rem;white-space:nowrap}
.plain{background:var(--primary-soft);border-left:6px solid var(--primary-ink);border-radius:12px;padding:.6rem .95rem;font-size:.95rem}
.plain-h{font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:.78rem;color:var(--primary-ink);margin-bottom:.2rem}
.plain p+p{margin-top:.35rem}
.chat{border:2px solid var(--line);border-radius:18px;background:var(--surface2);overflow:hidden}
.chat-head{display:flex;gap:.5rem;align-items:center;padding:.4rem .9rem;font-size:.82rem;font-weight:700;color:var(--muted);border-bottom:2px solid var(--line)}
.chat-body{padding:.8rem .95rem}
.chat-body .bubble{background:var(--surface);border:2px solid var(--line);border-radius:4px 16px 16px 16px;padding:.7rem .9rem;min-height:3rem}
.doc{margin:0;background:var(--surface);border:2px solid var(--line);border-top:8px solid var(--primary-ink);border-radius:8px;box-shadow:var(--shadow)}
.doc figcaption{display:flex;gap:.5rem;align-items:center;padding:.4rem .9rem;font-weight:800;font-size:.85rem;color:var(--primary-ink);border-bottom:1px solid var(--line)}
.doc-body{padding:.7rem .95rem}
.verdict{border-radius:12px;padding:.6rem .9rem;border:2px solid;animation:pop .35s ease-out both}
.verdict p+p{margin-top:.3rem}
.v-h{display:flex;gap:.45rem;align-items:center;font-weight:800}
.v-good{background:var(--good-soft);border-color:var(--good);color:var(--text)}.v-good .v-h{color:var(--good)}
.v-err{background:var(--err-soft);border-color:var(--err);color:var(--text)}.v-err .v-h{color:var(--err)}
.v-chk{background:var(--chk-soft);border-color:var(--chk);color:var(--text)}.v-chk .v-h{color:var(--chk)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.slot:empty{display:none}
.slot{margin-top:.6rem}
.btn{background:var(--primary);color:var(--on-primary);border:2px solid var(--primary);border-radius:999px;padding:.4rem 1.3rem;font-weight:700;display:inline-flex;align-items:center;gap:.5rem;justify-content:center}
.btn.alt{background:transparent;color:var(--primary-ink);border-color:var(--primary-ink)}
.btn.warm{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.nudge{animation:nudge 1.8s ease-in-out 3}
@keyframes nudge{0%,100%{transform:none}30%{transform:translateY(-4px) scale(1.05)}60%{transform:none}}
.prompt{background:var(--surface2);border:2px dashed var(--primary-ink);border-radius:12px;padding:.7rem .9rem;font-family:ui-monospace,Consolas,Menlo,monospace;font-size:.88rem;overflow-wrap:anywhere;white-space:pre-wrap}
.copyrow{display:grid;gap:.5rem}

/* typed text & sweeps */
.line{position:relative;isolation:isolate;border-radius:10px;padding:.35rem .6rem;display:block;width:100%;text-align:left;background:transparent;border:2px solid transparent;color:var(--text);font:inherit;overflow-wrap:anywhere}
button.line{border-color:var(--line);background:var(--surface);min-height:48px}
.line::before{content:"";position:absolute;inset:0;border-radius:8px;transform:scaleX(0);transform-origin:left;z-index:-1;transition:transform .7s ease-out;background:var(--sweep,transparent)}
.line.sw::before{transform:scaleX(1)}
.sw-good{--sweep:var(--good-soft);border-color:var(--good)!important}
.sw-err{--sweep:var(--err-soft);border-color:var(--err)!important}
.sw-chk{--sweep:var(--chk-soft);border-color:var(--chk)!important}
.lines{list-style:none;margin:0;padding:0;display:grid;gap:.7rem}
.lines>li.in{animation:pop .4s ease-out both}
.tag{display:inline-flex;gap:.3rem;align-items:center;font-size:.8rem;font-weight:800;border-radius:999px;padding:0 .55rem;border:1.5px solid currentColor}
.tag-good{color:var(--good)}.tag-chk{color:var(--chk)}.tag-err{color:var(--err)}.tag-plain{color:var(--primary-ink)}

/* choices & chips */
.choices{display:flex;flex-wrap:wrap;gap:.5rem}
.choice{background:var(--surface);color:var(--text);border:2px solid var(--primary-ink);border-radius:12px;padding:.35rem .9rem;font-weight:700;font-size:.9rem}
.choice:hover:not(:disabled){background:var(--primary-soft)}
.choice[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.choice:disabled:not([aria-pressed="true"]){opacity:.5;cursor:default}
.sortlist{list-style:none;margin:0;padding:0;display:grid;gap:.9rem}
.sortcard{border:2px solid var(--line);border-radius:14px;padding:.8rem .95rem;background:var(--surface)}
.sortcard>p{margin-bottom:.5rem}
.counter{display:inline-flex;gap:.5rem;align-items:center;background:var(--surface2);border-radius:999px;padding:.15rem .9rem;font-weight:700;font-size:.9rem}
.note{font-size:.9rem;color:var(--muted);font-style:italic}

/* toggle */
.seg{display:inline-flex;border:2px solid var(--primary-ink);border-radius:999px;overflow:hidden}
.seg button{background:var(--surface);color:var(--text);border:0;padding:.3rem 1.1rem;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.pane.enter{animation:inR .35s ease-out both}

/* flip */
.flip{display:grid;perspective:1000px}
.flip .inner{display:grid;transition:transform .6s;transform-style:preserve-3d}
.flip .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--primary-ink);border-radius:18px;padding:1rem;background:var(--surface);display:flex;flex-direction:column;gap:.7rem;justify-content:space-between}
.flip .front{background:var(--primary-soft)}
.flip .back{transform:rotateY(180deg)}
.flip.flipped .inner{transform:rotateY(180deg)}
.flip h3{margin:0;font-size:1.3rem;color:var(--primary-ink)}
.flip .why{font-weight:800;font-size:1.6rem;color:var(--accent)}
.flip .face[inert]{pointer-events:none}

/* learner scene */
.learner{border:2px solid var(--line);border-radius:16px;padding:.9rem;background:var(--surface);animation:pop .45s ease-out both}
.scene{position:relative;height:56px;margin:.7rem 0;border-bottom:4px solid var(--line)}
.dot{position:absolute;left:0;bottom:0;width:40px;height:40px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:800;transform:translateX(var(--x,0px));transition:transform .9s ease-in-out}
.wall{position:absolute;left:62%;bottom:0;width:16px;height:52px;background:var(--err);border-radius:4px;transition:transform .7s,opacity .7s}
.wall.hit{animation:shake .5s 2}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.opened .wall{transform:translateY(-70px);opacity:0}
.flagp{position:absolute;right:4px;bottom:0;font-size:1.5rem;line-height:1}
.optlist{margin:.4rem 0 0;padding-left:1.2rem}

/* slides */
.slidebox{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.slide{aspect-ratio:16/9;min-height:11rem;background:linear-gradient(135deg,#1f5f7a,#2f86a6);color:#fff;padding:1rem 1.2rem;display:flex;flex-direction:column;justify-content:center;gap:.4rem}
.slide .sn{font-size:.8rem;opacity:.95;font-weight:700}
.slide h3{margin:0;font-size:1.5rem;color:#fff}
.slide ul{margin:.2rem 0 0;padding-left:1.1rem;font-size:.95rem}
.slidebar{display:flex;justify-content:space-between;align-items:center;padding:.4rem .6rem;gap:.5rem;flex-wrap:wrap}
.cmpcard{background:var(--surface);color:var(--text);border:2px solid var(--line);border-radius:14px;padding:.8rem 1rem;font-weight:700;text-align:left;font-size:1rem}
.cmpcard:hover{border-color:var(--primary-ink)}

/* steps / path */
.path{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.node{background:var(--primary-soft);border:2px solid var(--primary-ink);border-radius:14px;padding:.5rem .8rem;font-weight:700;opacity:0;transform:translateY(12px);transition:opacity .5s,transform .5s;display:flex;gap:.45rem;align-items:center}
.arrow{opacity:0;transition:opacity .5s;color:var(--primary-ink);font-weight:800}
.show{opacity:1!important;transform:none!important}
.steps3{display:grid;gap:.8rem}
@media(min-width:700px){.steps3{grid-template-columns:repeat(3,1fr)}}
.stepc{border:2px solid var(--line);border-radius:14px;padding:.8rem;opacity:.45;transform:scale(.97);transition:opacity .5s,transform .5s,border-color .5s}
.stepc.show{border-color:var(--primary-ink);background:var(--primary-soft)}
.stepc h3{margin:0 0 .3rem;display:flex;gap:.5rem;align-items:center}
.num{display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--primary);color:var(--on-primary);font-weight:800;font-size:.95rem}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
.checklist li{display:flex;gap:.7rem;align-items:flex-start;opacity:0;transform:translateX(-16px);animation:inItem .5s ease-out forwards;animation-delay:var(--d,0s)}
.checklist .ck{flex:none;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--good);color:var(--bg);display:grid;place-items:center;transform:scale(0);animation:ckpop .4s ease-out forwards;animation-delay:calc(var(--d,0s) + .35s)}
html[data-theme="dark"] .checklist .ck{color:#0b1a12}
.checklist .ck svg{width:1.1rem;height:1.1rem}
@keyframes inItem{to{opacity:1;transform:none}}
@keyframes ckpop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.tick{background:var(--surface);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:.4rem .8rem;width:100%;text-align:left;display:flex;gap:.7rem;align-items:center;font-size:1rem}
.tick .box{flex:none;width:1.7rem;height:1.7rem;border:2px solid var(--primary-ink);border-radius:6px;display:grid;place-items:center;color:var(--on-primary)}
.tick[aria-pressed="true"] .box{background:var(--primary)}
.tick .box svg{transform:scale(0);transition:transform .25s}
.tick[aria-pressed="true"] .box svg{transform:scale(1)}
.words5{display:grid;gap:.5rem;margin:0;padding:0;list-style:none}
.words5 li{font-size:1.5rem;font-weight:800;color:var(--primary-ink);opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s}
.words5 li.show{opacity:1;transform:none}
.words5 li.last{color:var(--accent)}
.bigwords span{display:inline-block;opacity:0;transform:translateY(12px);animation:inItem .5s ease-out forwards;animation-delay:var(--d,0s);margin-right:.3em}

/* idea & week */
.ideas{list-style:none;margin:0;padding:0;display:grid;gap:.7rem;counter-reset:id}
.ideas li{display:flex;gap:.8rem;align-items:center;background:var(--primary-soft);border-radius:14px;padding:.7rem .9rem;font-weight:600;opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s}
.ideas li.show{opacity:1;transform:none}
.weeklist{list-style:none;margin:0;padding:0;display:grid;gap:.8rem}
.weeklist li{border:2px solid var(--line);border-radius:14px;padding:.6rem .9rem}
.weeklist li.here{border-color:var(--accent);background:var(--accent-soft)}
.wbar{height:12px;border-radius:6px;background:var(--surface2);margin-top:.4rem;overflow:hidden}
.wbar i{display:block;height:100%;width:100%;background:var(--primary);border-radius:6px;transform-origin:left;transform:scaleX(0);transition:transform .9s ease-out}
.weeklist li.here .wbar i{background:var(--accent)}
.bar{height:16px;border-radius:8px;background:var(--surface2);overflow:hidden;border:1.5px solid var(--line)}
.bar i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);transition:transform 1s ease-out;background:var(--primary)}
.cmp{list-style:none;margin:0;padding:0;display:grid;gap:.8rem}
.cmp li{background:var(--surface2);border-radius:12px;padding:.8rem .9rem}
.qbox{border:0;margin:0;padding:0}
.qbox legend{font-weight:800;font-size:1.15rem;margin-bottom:.7rem;padding:0}
.opt{display:flex;gap:.7rem;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:.6rem .8rem;margin-bottom:.55rem;min-height:48px;cursor:pointer;background:var(--surface)}
.opt input{width:1.4rem;height:1.4rem;margin-top:.15rem;flex:none;accent-color:var(--primary)}
.opt:has(input:checked){border-color:var(--primary-ink);background:var(--primary-soft)}
.opt.best{border-color:var(--good);background:var(--good-soft)}
.opt.mine{border-color:var(--chk);background:var(--chk-soft)}

/* footer */
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.progress{height:8px;background:var(--surface2)}
.progress i{display:block;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0);transition:transform .5s ease-out;width:100%}
.footrow{max-width:60rem;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.4rem 16px}
.foot .btn{padding:.4rem .9rem;white-space:nowrap}
.where{font-size:.85rem;font-weight:700;text-align:center;color:var(--muted)}
#cel{position:fixed;left:50%;top:5.5rem;transform:translateX(-50%);z-index:40;pointer-events:none;width:min(92vw,26rem);text-align:center}
#cel .msg{background:var(--accent);color:var(--on-accent);font-weight:800;border-radius:999px;padding:.5rem 1.2rem;animation:pop .4s ease-out both}
#cel .p{position:absolute;left:50%;top:1rem;width:10px;height:10px;border-radius:3px;background:var(--c);animation:burst 1.2s ease-out forwards}
@keyframes burst{from{opacity:1;transform:translate(0,0) rotate(0)}to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
.cursor::after{content:"";display:inline-block;width:2px;height:1em;background:var(--muted);margin-left:2px;vertical-align:-.12em}

/* reduced motion: everything becomes instant */
html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
html.rm .checklist li,html.rm .bigwords span{opacity:1;transform:none}
html.rm .checklist .ck{transform:none}
html.rm .node,html.rm .arrow,html.rm .words5 li,html.rm .ideas li{opacity:1;transform:none}
html.rm .stepc{opacity:1;transform:none}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the lesson</a>
<header class="top">
  <div class="brandrow">
    <h1 class="brand">AI Literacy for Educators &middot; Week 3 microlecture</h1>
    <div class="ctrls" role="group" aria-label="Page controls">
      <button class="tool" id="bMenu" type="button" aria-expanded="false" aria-controls="menu">Sections</button>
      <button class="tool" id="bSmall" type="button" aria-label="Smaller text">A&minus;</button>
      <button class="tool" id="bBig" type="button" aria-label="Bigger text">A+</button>
      <button class="tool" id="bRM" type="button" aria-pressed="false">Reduce motion</button>
      <button class="tool" id="bTheme" type="button" aria-pressed="false">Dark theme</button>
      <button class="tool" id="bReset" type="button">Start over</button>
    </div>
  </div>
  <nav id="menu" aria-label="Lecture sections" hidden></nav>
</header>
<main id="main" tabindex="-1"></main>
<div id="cel" aria-hidden="true"></div>
<div class="sr" id="live" role="status" aria-live="polite" aria-atomic="true"></div>
<footer class="foot">
  <div class="progress" role="progressbar" aria-label="Lecture progress" id="pbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="pfill"></i></div>
  <div class="footrow">
    <button class="btn alt" id="bBack" type="button">&larr; Back</button>
    <div class="where" id="where"></div>
    <button class="btn" id="bNext" type="button">Next &rarr;</button>
  </div>
</footer>

<script>
"use strict";
/* =====================================================================
   HOW TO EDIT THE WORDS
   Everything teachers read is in the data objects in this first block:
     COURSE      page title bits and storage key
     SECTIONS    the 9 sections: title, minutes, "What you will learn", "Remember"

const SIZES = [18, 20, 22, 24];
function load() {
  try { const j = JSON.parse(localStorage.getItem(COURSE.storageKey) || "null"); if (j) { Object.assign(S, j); } else S.rm = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches); }
  catch (e) { S.rm = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches); }
  if (!(S.i >= 0 && S.i < SCREENS.length)) S.i = 0;
  if (!(S.size >= 0 && S.size < SIZES.length)) S.size = 0;
  if (typeof S.done !== "object" || !S.done) S.done = {};
}
function save() { try { localStorage.setItem(COURSE.storageKey, JSON.stringify({ i: S.i, size: S.size, rm: S.rm, theme: S.theme, done: S.done })); } catch (e) { /* storage blocked: page still works */ } }
function applyPrefs() {
  root.style.fontSize = SIZES[S.size] + "px";
  root.classList.toggle("rm", S.rm); root.setAttribute("data-theme", S.theme);
  $("#bRM").setAttribute("aria-pressed", String(S.rm)); $("#bTheme").setAttribute("aria-pressed", String(S.theme === "dark"));
  $("#bSmall").disabled = S.size === 0; $("#bBig").disabled = S.size === SIZES.length - 1;
}
let dir = 1, firstPaint = true;
function render() {
  TOK++; timers.forEach(clearTimeout); timers = [];
  const sc = SCREENS[S.i], sec = SECTIONS[sc.sec];
  const first = SCREENS.findIndex(x => x.sec === sc.sec) === S.i;
  const last = SCREENS.map(x => x.sec).lastIndexOf(sc.sec) === S.i;
  const box = h("section", { class: "screen enter" + (dir < 0 ? " back" : ""), "aria-labelledby": "ttl" });
  if (RM()) box.classList.remove("enter");
  box.append(h("div", { class: "kicker" }, h("span", {}, "Section " + sec.id + ": " + sec.short), h("span", { class: "about" }, "About " + sec.mins + (sec.mins === 1 ? " minute" : " minutes"))),
    h("h2", { id: "ttl", tabindex: "-1" }, sc.title));
  if (first) box.append(h("p", { class: "learn" }, icon("star"), h("span", {}, h("b", {}, "What you will learn: "), sec.learn)));
  const content = h("div", {}); box.append(content);
  sc.render(content);
  if (last) box.append(h("p", { class: "remember" }, icon("check"), h("span", {}, h("b", {}, "Remember: "), sec.remember)));
  main.replaceChildren(box);
  if (!firstPaint) { $("#ttl").focus({ preventScroll: true }); window.scrollTo(0, 0); }
  firstPaint = false;
  document.title = sc.title + " · Week 3 · AI Literacy for Educators";
  const total = SCREENS.length, pct = Math.round((S.i + 1) / total * 100);
  $("#pfill").style.transform = "scaleX(" + (S.i + 1) / total + ")"; $("#pbar").setAttribute("aria-valuenow", String(pct));
  $("#where").textContent = "Screen " + (S.i + 1) + " of " + total;
  $("#bBack").disabled = S.i === 0; $("#bNext").hidden = S.i === total - 1;
  $("#bNext").classList.remove("nudge");
  later(() => $("#bNext").classList.add("nudge"), 9000);
  buildMenu(); save();
}
function goto(i, d) { if (i < 0 || i >= SCREENS.length) return; dir = d || (i >= S.i ? 1 : -1); S.i = i; closeMenu(); render(); }
function next() {
  const sc = SCREENS[S.i], nx = SCREENS[S.i + 1];
  if (nx && nx.sec !== sc.sec) { S.done[sc.sec] = true; celebrate("Section " + sc.sec + " finished. Nice work."); }
  goto(S.i + 1, 1);
}
function back() { goto(S.i - 1, -1); }
function startOver() {
  if (!confirm("Start over? This clears your place and your text settings on this page.")) return;
  S.i = 0; S.done = {}; S.size = 0; quizReset(); dir = 1; applyPrefs(); closeMenu(); render(); announce("Starting over from the welcome screen.");
}
function celebrate(msg) {
  const el = $("#cel"); el.replaceChildren(); announce(msg);
  const m = h("div", { class: "msg" }, msg); el.append(m);
  if (!RM()) {
    const cols = ["#b4531a", "#1f5f7a", "#17623a", "#d99a2b", "#7a5fb0"];
    for (let i = 0; i < 18; i++) { const a = Math.PI * (0.1 + 0.8 * i / 17); const p = h("span", { class: "p", style: "--c:" + cols[i % 5] + ";--dx:" + Math.round(Math.cos(a + Math.PI) * 120 + (i % 2 ? 30 : -30)) + "px;--dy:" + Math.round(80 + (i % 4) * 25) + "px;--r:" + (i * 47) + "deg" }); el.append(p); }
  }
  setTimeout(() => el.replaceChildren(), RM() ? 2500 : 2600);
}
function buildMenu() {
  const m = $("#menu"); const cur = SCREENS[S.i].sec;
  m.replaceChildren(h("ol", {}, SECTIONS.map(sec => {
    const b = h("button", { type: "button" }, h("span", {}, sec.id + ". " + sec.short + (S.done[sec.id] ? " ✓ Done" : "")), h("span", { class: "mins" }, "about " + sec.mins + " min"));
    if (sec.id === cur) b.setAttribute("aria-current", "step");
    b.addEventListener("click", () => goto(firstOf(sec.id)));
    return h("li", {}, b);
  })), h("p", { class: "menu-total" }, "Total: about " + SECTIONS.reduce((a, s) => a + s.mins, 0) + " minutes."));
}
function closeMenu() { $("#menu").hidden = true; $("#bMenu").setAttribute("aria-expanded", "false"); }

$("#bMenu").addEventListener("click", () => { const m = $("#menu"); const open = m.hidden; m.hidden = !open; $("#bMenu").setAttribute("aria-expanded", String(open)); if (open) { const c = $("[aria-current]", m); if (c) c.focus(); } });
$("#bSmall").addEventListener("click", () => { S.size = Math.max(0, S.size - 1); applyPrefs(); save(); announce("Text size " + SIZES[S.size] + " pixels."); });
$("#bBig").addEventListener("click", () => { S.size = Math.min(SIZES.length - 1, S.size + 1); applyPrefs(); save(); announce("Text size " + SIZES[S.size] + " pixels."); });
$("#bRM").addEventListener("click", () => { S.rm = !S.rm; applyPrefs(); save(); announce("Reduce motion is " + (S.rm ? "on." : "off.")); });
$("#bTheme").addEventListener("click", () => { S.theme = S.theme === "dark" ? "light" : "dark"; applyPrefs(); save(); announce(S.theme === "dark" ? "Dark theme on." : "Light theme on."); });
$("#bReset").addEventListener("click", startOver);
$("#bNext").addEventListener("click", next); $("#bBack").addEventListener("click", back);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#menu").hidden) { closeMenu(); $("#bMenu").focus(); return; }
  if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  const t = e.target; if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
  if (e.key === "ArrowRight") { if (S.i < SCREENS.length - 1) next(); } else if (e.key === "ArrowLeft") back();
});
document.addEventListener("click", e => { const m = $("#menu"); if (!m.hidden && !m.contains(e.target) && e.target !== $("#bMenu")) closeMenu(); });

load(); applyPrefs(); render();
</script>
</body>
</html>
