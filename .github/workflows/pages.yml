name: Publish ai-guide to GitHub Pages

# Publishes ONLY the ai-guide presentation. Nothing else in this repository is deployed.
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
# The deck is then served at https://<owner>.github.io/<repo>/

on:
  push:
    branches: [main]
    paths:
      - 'ai-guide/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage only the presentation
        run: |
          mkdir _site
          cp ai-guide/index.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true   # turns Pages on (Source: GitHub Actions) if it is not already; needs repo admin rights

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
