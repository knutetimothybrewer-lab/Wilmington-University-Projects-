<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  AI Literacy for Educators · Week 5 Micro-Lecture
  "Building Assessments You Can Trust" (house-building metaphor)

  ONE FILE, NO INTERNET NEEDED. Open it in any modern browser.

  PRESENTER KEYS
    Right arrow / Space / PageDown ... next screen
    Left arrow / PageUp .............. previous screen
    Home / End ........................ first / last screen
    N ................................. presenter notes on/off
    F ................................. full screen on/off (Esc also exits)
  The construction tracker at the top jumps to any stage.
  "Quick path" (top right) skips optional screens (about 10 minutes instead of 20-25).
  "Calm motion" turns animation off (it is also turned off automatically
  when the computer asks for reduced motion).

  HOW TO EDIT TEXT
    Every word on every screen lives in the CONTENT object at the top of the
    first script block below. Edit text there; you do not need to touch the logic.
    Glossary words use the pattern {{key}} or {{key|words shown}}.
-->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 5: Building Assessments You Can Trust</title>
<meta name="description" content="Week 5 micro-lecture for AI Literacy for Educators: why AI should not be the final grader, why AI detectors are unreliable, redesigning assessment, accessible assessment, and student-facing AI tools with teacher oversight.">
<style>
/* =====================================================================
   1. DESIGN TOKENS (colors, type). Construction palette.
   ===================================================================== */
:root{
  --orange:#E8590C;      /* safety orange (decoration) */
  --orange-d:#B23F06;    /* safety orange, dark enough for white text (AA) */
  --yellow:#FFC20E;      /* hard-hat yellow */
  --yellow-l:#FFF5D1;
  --blue:#0B4F8A;        /* blueprint blue */
  --blue-d:#073764;
  --blue-l:#E7F0FA;
  --concrete:#5B6472;    /* concrete gray (AA on white) */
  --concrete-l:#E4E7EB;
  --concrete-xl:#F3F4F6;
  --white:#FFFFFF;
  --paper:#FBFBF8;
  --ink:#1B2430;
  --ink2:#414C5C;
  --green:#13703A; --green-l:#DDF5E4;
  --red:#B01818;   --red-l:#FDE3E3;
  --amber-l:#FFF0DC;
  --radius:16px;
  --font: ui-rounded,"SF Pro Rounded","Segoe UI Rounded","Arial Rounded MT Bold","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --spring:cubic-bezier(.2,1.4,.4,1);
}
*{box-sizing:border-box}
html{font-size:clamp(16px, .5vw + 11px, 22px)}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);line-height:1.45;
  display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{line-height:1.15;margin:0 0 .5em}
p{margin:0 0 .8em}
ul,ol{margin:.2em 0 .8em;padding-left:1.3em}
li{margin:.25em 0}
a{color:var(--blue)}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus{outline:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 7px var(--yellow);border-radius:8px}
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none;box-shadow:none}
.skip{position:absolute;left:8px;top:-60px;background:var(--yellow);color:var(--ink);padding:.5em 1em;border-radius:8px;z-index:200;font-weight:700}
.skip:focus{top:8px}

/* =====================================================================
   2. TOP BAR + CONSTRUCTION TRACKER
   ===================================================================== */
.topbar{background:var(--blue);color:#fff;
  background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);
  background-size:22px 22px;display:flex;align-items:center;gap:.8rem;padding:.45rem .9rem;flex-wrap:wrap;
  border-bottom:6px solid var(--yellow);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:.55rem;min-width:0}
.brand svg{flex:none}
.brand b{display:block;font-size:.95rem;letter-spacing:.02em}
.brand span{display:block;font-size:.72rem;opacity:.9}
.tracker{flex:1;display:flex;justify-content:center;min-width:0}
.tracker ol{list-style:none;margin:0;padding:0;display:flex;gap:.3rem;align-items:center;flex-wrap:wrap;justify-content:center}
.tracker li{margin:0;display:flex;align-items:center}
.tracker li+li::before{content:"";width:1.1rem;height:4px;background:rgba(255,255,255,.35);border-radius:2px;margin-right:.3rem}
.tracker li.done+li::before,.tracker li.done::before{background:var(--yellow)}
.trk{display:flex;align-items:center;gap:.4rem;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.08);
  color:#fff;border-radius:999px;padding:.22rem .7rem .22rem .25rem;font-weight:700;font-size:.8rem;min-height:40px;transition:background .2s,transform .2s}
.trk:hover{background:rgba(255,255,255,.2)}
.trk .n{width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--blue);font-size:.8rem}
.trk[aria-current="step"]{background:var(--yellow);color:var(--ink);border-color:var(--yellow);transform:translateY(-1px)}
.trk[aria-current="step"] .n{background:var(--ink);color:var(--yellow)}
.trk.done .n{background:var(--green);color:#fff}
.controls{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.tog{display:flex;align-items:center;gap:.4rem;border:2px solid rgba(255,255,255,.6);border-radius:999px;background:transparent;color:#fff;
  padding:.25rem .7rem;font-size:.78rem;font-weight:700;min-height:40px}
.tog[aria-pressed="true"]{background:#fff;color:var(--blue)}
.tog .dot{width:.8rem;height:.8rem;border-radius:50%;border:2px solid currentColor}
.tog[aria-pressed="true"] .dot{background:var(--green);border-color:var(--green)}

/* =====================================================================
   3. MAIN LAYOUT: construction site panel + slide panel
   ===================================================================== */
.layout{display:grid;grid-template-columns:minmax(240px,25%) 1fr;min-height:0}
.site{background:#9FD0F5;border-right:5px solid var(--yellow);display:flex;flex-direction:column;min-height:0;position:relative}
.site svg#siteSvg{width:100%;flex:1;min-height:0;display:block}
.site-log{margin:0;padding:.55rem .9rem .7rem;background:#fff;border-top:3px dashed var(--concrete-l);font-size:.86rem;color:var(--ink2);min-height:3.4em}
.site-log b{color:var(--blue)}
.site-hide{position:absolute;top:.4rem;right:.4rem;background:rgba(255,255,255,.9);border:2px solid var(--blue);color:var(--blue);border-radius:999px;font-size:.7rem;font-weight:700;padding:.15rem .6rem;display:none}
.slide{overflow:auto;scrollbar-gutter:stable;min-height:0;position:relative;scroll-behavior:smooth}
.slide-inner{max-width:1100px;margin:0 auto;padding:1.2rem 2.2rem 1.4rem}
.slide-inner.enter-next{animation:inNext .45s ease both}
.slide-inner.enter-prev{animation:inPrev .45s ease both}
@keyframes inNext{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.kind{display:inline-flex;align-items:center;gap:.4rem;font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  padding:.25rem .7rem;border-radius:999px;background:var(--blue-l);color:var(--blue);margin-bottom:.6rem}
.kind.k-concept{background:var(--blue-l);color:var(--blue)}
.kind.k-metaphor{background:var(--yellow-l);color:#6B4A00}
.kind.k-interactive{background:#FFE6D6;color:var(--orange-d)}
.kind.k-examples{background:var(--concrete-xl);color:var(--concrete)}
.kind.k-monday{background:var(--green-l);color:var(--green)}
.kind .opt{background:#fff;border-radius:999px;padding:0 .45rem;color:var(--ink2);letter-spacing:0;text-transform:none;font-weight:700}
.slide h2{font-size:2rem;color:var(--blue-d)}
.slide h3{font-size:1.25rem;color:var(--blue-d)}
.lead{font-size:1.18rem;color:var(--ink)}
.muted{color:var(--ink2)}
.small{font-size:.85rem}

/* =====================================================================
   4. FOOTER NAV
   ===================================================================== */
.navbar{background:#2B323C;color:#fff;display:flex;align-items:center;gap:1rem;padding:.5rem 1rem;position:relative;z-index:5}
.navbar::before{content:"";position:absolute;left:0;right:0;top:-8px;height:8px;
  background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,#1B2430 14px 28px)}
.navbtn{background:var(--yellow);color:var(--ink);border:0;border-radius:999px;font-weight:800;padding:.5rem 1.2rem;min-height:46px;min-width:7.5rem;font-size:1rem}
.navbtn:disabled{opacity:.4;cursor:not-allowed}
.navbtn.prev{background:#fff}
.navmid{flex:1;min-width:0;text-align:center}
.navmid .count{font-size:.85rem;opacity:.95}
.bar{height:10px;background:#47505C;border-radius:999px;overflow:hidden;margin-top:.3rem}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--orange));transition:width .4s}
.navhint{font-size:.72rem;opacity:.8}
.navhint kbd{background:#47505C;border-radius:4px;padding:0 .3em;font-family:inherit}

/* =====================================================================
   5. NOTES DRAWER + GLOSSARY TOOLTIP
   ===================================================================== */
.notes{position:fixed;left:0;right:0;bottom:70px;max-height:38vh;overflow:auto;background:var(--yellow-l);border-top:5px solid var(--yellow);
  box-shadow:0 -6px 18px rgba(0,0,0,.2);padding:.8rem 1.4rem 1rem;z-index:20;font-size:1rem}
.notes h2{font-size:1rem;margin:0 0 .3rem;color:#6B4A00;text-transform:uppercase;letter-spacing:.06em}
.notes .close{float:right;border:2px solid #6B4A00;background:#fff;border-radius:999px;font-weight:700;padding:.1rem .7rem}
.term{border:0;background:none;padding:0;color:var(--blue);font-weight:700;text-decoration:underline dotted 2px;text-underline-offset:3px;cursor:help}
.term:hover{background:var(--blue-l);border-radius:4px}
#tip{position:fixed;z-index:100;max-width:330px;background:var(--ink);color:#fff;padding:.6rem .8rem;border-radius:12px;font-size:.88rem;
  box-shadow:0 8px 24px rgba(0,0,0,.3);pointer-events:none}
#tip b{color:var(--yellow)}

/* =====================================================================
   6. GENERIC PIECES: cards, buttons, stamps, labels
   ===================================================================== */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.card{background:#fff;border:2px solid var(--concrete-l);border-radius:var(--radius);padding:1rem 1.2rem;box-shadow:0 3px 0 rgba(27,36,48,.06)}
.card h3{margin-bottom:.35em}
.card.blue{border-color:#B8D1EA;background:var(--blue-l)}
.card.yellow{border-color:#F3D77A;background:var(--yellow-l)}
.card.green{border-color:#A8DDB8;background:var(--green-l)}
.card.red{border-color:#F2B2B2;background:var(--red-l)}
.btn{display:inline-flex;align-items:center;gap:.4rem;background:var(--orange-d);color:#fff;border:2px solid var(--orange-d);border-radius:999px;
  padding:.45rem 1rem;font-weight:800;min-height:44px;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px);background:#9A3604}
.btn:active{transform:translateY(1px)}
.btn.blue{background:var(--blue);border-color:var(--blue)} .btn.blue:hover{background:var(--blue-d)}
.btn.ghost{background:#fff;color:var(--blue);border-color:var(--blue)} .btn.ghost:hover{background:var(--blue-l)}
.btn.green{background:var(--green);border-color:var(--green)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.btnrow{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0}
.stamp{display:inline-block;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border:4px solid currentColor;border-radius:8px;
  padding:.15em .55em;transform:rotate(-7deg);font-size:1.05rem;background:rgba(255,255,255,.9);line-height:1.2}
.stamp.approved{color:var(--green)} .stamp.failed{color:var(--red)} .stamp.review{color:var(--orange-d)}
.stamp.pop{animation:stampIn .5s var(--spring) both}
@keyframes stampIn{0%{opacity:0;transform:scale(2.6) rotate(-7deg)}100%{opacity:1;transform:scale(1) rotate(-7deg)}}
.sim{display:inline-flex;align-items:center;gap:.3em;font-size:.72rem;font-weight:700;color:var(--ink2);background:var(--concrete-xl);border:1px dashed #9AA3AF;
  border-radius:999px;padding:.08em .6em;vertical-align:middle}
.sim::before{content:"";width:.55em;height:.55em;border-radius:50%;background:var(--orange)}
.pill{display:inline-block;border-radius:999px;padding:.08em .6em;font-size:.8rem;font-weight:800}
.pill.red{background:var(--red-l);color:var(--red)} .pill.green{background:var(--green-l);color:var(--green)} .pill.amber{background:var(--amber-l);color:var(--orange-d)}
.callout{border-left:8px solid var(--yellow);background:var(--yellow-l);border-radius:0 12px 12px 0;padding:.7rem 1rem;margin:.8rem 0}
.callout.blue{border-color:var(--blue);background:var(--blue-l)}
.callout.green{border-color:var(--green);background:var(--green-l)}
.callout.red{border-color:var(--red);background:var(--red-l)}
.big-idea{font-size:1.5rem;font-weight:800;color:var(--blue-d);text-align:center;padding:.8rem;border:4px dashed var(--yellow);border-radius:18px;background:#fff;margin:.8rem 0}
.copybox{background:#fff;border:2px solid var(--concrete-l);border-radius:12px;padding:.8rem 1rem;white-space:pre-wrap;font-size:.92rem;max-height:34vh;overflow:auto}
.cite{font-size:.84rem;color:var(--ink2)}
.cite a{color:var(--blue)}
details.more{margin:.5rem 0}
details.more summary{cursor:pointer;font-weight:800;color:var(--blue)}

/* "What to do Monday" clipboard */
.monday{background:#fff;border:3px solid var(--green);border-radius:18px;overflow:hidden;box-shadow:0 6px 0 rgba(19,112,58,.15)}
.monday header{background:var(--green);color:#fff;padding:.6rem 1.1rem;display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.1rem}
.monday .mbody{padding:.9rem 1.2rem}
.monday ol{counter-reset:m;list-style:none;padding:0}
.monday ol li{counter-increment:m;display:grid;grid-template-columns:2.2rem 1fr;gap:.6rem;align-items:start;margin:.55rem 0}
.monday ol li::before{content:counter(m);width:2rem;height:2rem;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-weight:900}
.monday .check{display:block;padding-left:2rem;text-indent:-2rem}
.monday .check input{vertical-align:-.2rem;margin:0 .6rem 0 0}
.monday input[type=checkbox]{width:1.3rem;height:1.3rem;accent-color:var(--green)}

/* Widget frame (every interactive gets one, with a Reset button) */
.widget{border:3px solid var(--blue);border-radius:18px;background:#fff;margin:1rem 0;overflow:hidden;position:relative}
.widget-bar{display:flex;align-items:center;gap:.6rem;background:var(--blue);color:#fff;padding:.45rem .6rem .45rem 1rem;flex-wrap:wrap}
.widget-bar .try{flex:1;font-weight:700;font-size:.92rem;min-width:12rem}
.widget-bar .try b{color:var(--yellow);margin-right:.3rem}
.reset{background:#fff;color:var(--blue);border:0;border-radius:999px;font-weight:800;padding:.3rem .8rem;min-height:38px;font-size:.82rem}
.widget-body{padding:1rem}
.scene{width:min(100%, calc(var(--scene-h,44vh) * var(--ar,2)));height:auto;aspect-ratio:var(--ar,2);display:block;margin-inline:auto;border-radius:12px;background:linear-gradient(#D7ECFB,#F2F8FE)}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem;align-items:start}
.cols2>.choice-q,.cols2>.chk{margin:0}
.cols3 .predict-sent{font-size:1.15rem}
.cols3 .prob{grid-template-columns:minmax(0,7rem) 1fr 2.6rem;font-size:.9rem}

/* =====================================================================
   7. INTERACTIVE-SPECIFIC STYLES
   ===================================================================== */
/* Title */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:1.4rem;align-items:center}
.hero h1{font-size:2.6rem;color:var(--blue-d);margin-bottom:.3em}
.hero .eyebrow{font-weight:900;color:var(--orange-d);letter-spacing:.08em;text-transform:uppercase;font-size:.9rem}
.keys{display:grid;grid-template-columns:auto 1fr;gap:.3rem .7rem;font-size:.9rem;align-items:center}
kbd{background:#fff;border:2px solid var(--concrete-l);border-bottom-width:4px;border-radius:6px;padding:.05em .45em;font-family:inherit;font-weight:800;font-size:.85em}

/* Role map */
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
.role{border:3px solid var(--concrete-l);border-radius:16px;background:#fff;padding:.7rem;text-align:left;display:flex;flex-direction:column;gap:.3rem;min-height:8.5rem;transition:transform .2s,border-color .2s}
.role:hover{transform:translateY(-3px);border-color:var(--yellow)}
.role .ico{width:56px;height:56px}
.role .thing{font-weight:900;font-size:1.05rem;color:var(--blue-d)}
.role .means{font-size:.92rem;color:var(--ink2)}
.role .means.hidden{color:transparent;background:repeating-linear-gradient(-45deg,var(--concrete-xl) 0 8px,#fff 8px 16px);border-radius:8px;user-select:none}
.role[aria-expanded="true"]{border-color:var(--green)}
.role[aria-expanded="true"] .means{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Predict-the-next-word */
.predict-sent{font-size:1.4rem;font-weight:800;margin:.3rem 0 .6rem}
.predict-sent .blank{display:inline-block;min-width:5.5em;border-bottom:4px solid var(--orange);text-align:center;color:var(--orange-d)}
.probs{display:grid;gap:.35rem}
.prob{display:grid;grid-template-columns:8.5rem 1fr 3.2rem;gap:.5rem;align-items:center;font-weight:700}
.prob .track{height:1.3rem;background:var(--concrete-xl);border-radius:999px;overflow:hidden}
.prob .fill{height:100%;width:0;background:var(--blue-m,#2F74C0);border-radius:999px;transition:width .8s ease}
.prob.win .fill{background:var(--orange)}
.prob.win{color:var(--orange-d)}

/* Defect finder */
.defects{display:grid;grid-template-columns:1.25fr 1fr;gap:1rem;align-items:start}
.hot{cursor:pointer}
.hot .ring{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.18);opacity:.75}}
.hot:focus-visible{outline:none}
.hot:focus-visible .ring{stroke:var(--ink);stroke-width:5}
.hot.found .ring{animation:none;fill:var(--green)}
.defect-reveal{opacity:0;transition:opacity .5s}
.found-any .defect-reveal.show{opacity:1}
.dpanel{min-height:16rem}
.dpanel h3{display:flex;align-items:center;gap:.5rem}
.found-count{font-weight:800;color:var(--green)}
.runs{display:flex;flex-wrap:wrap;gap:.35rem;margin:.4rem 0}
.runs span{background:var(--blue-l);color:var(--blue-d);border-radius:8px;padding:.15rem .55rem;font-weight:900;animation:fadeUp .35s ease both}

/* Compare AI vs teacher */
.tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.7rem}
.tab{border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:999px;padding:.3rem .9rem;font-weight:800;min-height:42px}
.tab[aria-selected="true"]{background:var(--blue);color:#fff}
.student{background:#FFFEF5;border:2px solid #EADFAE;border-radius:12px;padding:.8rem 1rem;font-family:"Comic Sans MS","Chalkboard SE","Segoe Print",var(--font);font-size:1rem}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:.8rem}
.vs .card{position:relative}
.score{font-size:2rem;font-weight:900;color:var(--blue-d)}
.teacher-hidden{display:grid;place-items:center;min-height:9rem;text-align:center}
.stamp-slot{position:absolute;right:.8rem;top:.6rem}

/* Sorter */
.sorter .tray{display:flex;flex-wrap:wrap;gap:.5rem;min-height:3rem;padding:.6rem;border:3px dashed var(--concrete-l);border-radius:14px;background:var(--concrete-xl)}
.sort-card{background:#fff;border:2px solid var(--blue);color:var(--ink);border-radius:12px;padding:.4rem .75rem;font-size:.95rem;font-weight:700;text-align:left;
  box-shadow:0 3px 0 rgba(11,79,138,.25);touch-action:none;user-select:none;max-width:22rem;min-height:44px;transition:transform .15s}
.sort-card:hover{transform:translateY(-2px)}
.sort-card[aria-pressed="true"]{background:var(--yellow);border-color:var(--ink);transform:translateY(-3px) rotate(-1deg)}
.sort-card.placed{cursor:default;transform:none;box-shadow:none;width:100%;max-width:none}
.sort-card.ok{border-color:var(--green);background:var(--green-l)}
.sort-card.no{border-color:var(--orange-d);background:var(--amber-l)}
.sort-card .fb[hidden]{display:none}
.sort-card.placed{cursor:pointer}
.sort-card .fb{display:block;font-weight:500;font-size:.85rem;margin-top:.25rem;color:var(--ink2)}
.bins{display:grid;grid-template-columns:repeat(var(--cols,2),1fr);gap:.8rem;margin-top:.8rem}
.bin{border:3px solid var(--concrete-l);border-radius:16px;padding:.6rem;background:#fff;min-height:9rem;transition:background .2s,border-color .2s}
.bin.over{background:var(--yellow-l);border-color:var(--yellow)}
.bin-btn{width:100%;border:0;border-radius:10px;padding:.5rem;font-weight:900;color:#fff;background:var(--blue);min-height:44px;font-size:1rem}
.bin.b-ai .bin-btn{background:var(--blue)} .bin.b-human .bin-btn{background:var(--orange-d)}
.bin.b-red{border-color:#F2B2B2} .bin.b-red .bin-btn{background:var(--red)}
.bin.b-yellow{border-color:#F3D77A} .bin.b-yellow .bin-btn{background:#8A6400}
.bin.b-green{border-color:#A8DDB8} .bin.b-green .bin-btn{background:var(--green)}
.bin ul{list-style:none;padding:0;margin:.5rem 0 0;display:grid;gap:.4rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr))}
.bin li{margin:0}
.ghost-card{position:fixed;pointer-events:none;z-index:150;opacity:.92;transform:rotate(-3deg);box-shadow:0 12px 24px rgba(0,0,0,.25)}
.sorter-status{font-weight:800;margin:.6rem 0 0;color:var(--blue-d)}

/* Smoke alarm / detector */
.gauge-wrap{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.gauge{width:220px;height:auto;flex:none}
.needle{transition:transform 1.4s cubic-bezier(.3,1.5,.5,1);transform-origin:110px 110px}
.sample{font-size:1.08rem;background:#fff;border:2px solid var(--concrete-l);border-radius:12px;padding:.8rem 1rem;margin:.5rem 0}
.sample-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.4rem}
.verdict{font-weight:800;padding:.6rem .8rem;border-radius:12px;margin-top:.6rem}
.verdict.bad{background:var(--red-l);color:#7A1010}
.verdict.good{background:var(--green-l);color:#0B4A26}
.dots{display:flex;gap:.3rem}
.dots i{width:.9rem;height:.9rem;border-radius:50%;background:var(--concrete-l);display:block}
.dots i.cur{background:var(--yellow);outline:2px solid var(--ink)}
.dots i.r{background:var(--green)} .dots i.w{background:var(--red)}
.alarm-light{animation:blink .5s steps(2) infinite}
.beep-txt{animation:beep .5s ease-in-out infinite alternate}
@keyframes blink{50%{opacity:.15}}
@keyframes beep{from{transform:scale(.9)}to{transform:scale(1.1)}}
.smoke{animation:smoke 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes smoke{0%{opacity:0;transform:translateY(0) scale(.6)}30%{opacity:.8}100%{opacity:0;transform:translateY(-60px) scale(1.6)}}
.flame{animation:flicker .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}
@keyframes flicker{from{transform:scaleY(.9) skewX(-3deg)}to{transform:scaleY(1.12) skewX(3deg)}}

/* Threshold */
.slider-row{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center;margin:.4rem 0 .8rem;font-weight:800}
input[type=range]{width:100%;height:2.2rem;accent-color:var(--orange-d)}
.crowd{width:min(100%,64vh);margin-inline:auto;display:grid;grid-template-columns:repeat(12,1fr);gap:.2rem;background:linear-gradient(#EAF4FD,#F8FBFF);border-radius:12px;padding:.5rem}
.person{position:relative;text-align:center}
.person svg{width:100%;height:auto;display:block}
.person .tag{position:absolute;left:50%;top:-2px;transform:translateX(-50%);font-size:.56rem;font-weight:900;padding:0 .25em;border-radius:4px;white-space:nowrap}
.person.flag-honest .tag{background:var(--red);color:#fff}
.person.flag-cheat .tag{background:var(--green);color:#fff}
.person.miss-cheat .tag{background:var(--concrete);color:#fff}
.person.miss-cheat svg{animation:sneak 2.2s ease-in-out infinite}
.person.flag-honest svg{animation:shake .5s ease-in-out 2}
@keyframes sneak{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
@keyframes shake{0%,100%{transform:none}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.tally{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:.8rem}
.tally .card{text-align:center}
.tally .num{font-size:2.2rem;font-weight:900}

/* Fool the detector */
.fool-text{font-size:1.08rem;background:#fff;border:2px solid var(--concrete-l);border-radius:12px;padding:.8rem 1rem;min-height:7rem}
.fool-text mark{background:#FFE08A;border-radius:4px;padding:0 .12em;animation:markIn .8s ease both}
@keyframes markIn{from{background:var(--orange);color:#fff}to{background:#FFE08A}}

/* Makeover workshop */
.pick{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.8rem}

#mk .scene{--scene-h:26vh}
#mk .mk-grid{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:.8rem}

.mk-ba{display:grid;grid-template-columns:1fr;gap:.6rem;margin-top:.6rem;align-items:start}
.mk-ba .card,.mk-before{padding:.5rem .9rem}
.mk-before{margin-top:.5rem}
.mk-before h4{margin:0}
.mk-before p{margin:0}
.mk-ba h4{margin:0 0 .2rem}
.mk-ba p{margin:0}
#mkAfter ul{margin:.1rem 0 0;padding-left:1.1rem;font-size:.88rem;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:1.4rem}
#mkAfter li{margin:.1rem 0}
.mk-rubric{margin-top:.6rem;padding:.5rem .9rem}
@media (max-width:900px){.mk-strats,.mk-ba,#mkAfter ul{grid-template-columns:1fr}}
@media (max-height:800px) and (min-width:1001px){ #mk .scene{--scene-h:21vh} .mk-strats .strat>span>span{display:none} .mk-strats .strat{align-items:center} .mk-rubric table.rubric{font-size:.82rem} .mk-rubric table.rubric th,.mk-rubric table.rubric td{padding:.15rem .35rem} #mkAfter ul{font-size:.86rem} #mk .flagbar{padding:.3rem .7rem;margin:.4rem 0} }
.strat{display:grid;grid-template-columns:auto 1fr;gap:.5rem;align-items:start;border:2px solid var(--concrete-l);border-radius:12px;padding:.45rem .6rem;margin:.35rem 0;background:#fff;cursor:pointer}
.strat input{width:1.3rem;height:1.3rem;margin-top:.15rem;accent-color:var(--green)}
.strat:has(input:checked){border-color:var(--green);background:var(--green-l)}
.strat b{display:block}
.strat span{font-size:.88rem;color:var(--ink2)}
.flagbar{display:flex;align-items:center;gap:.6rem;padding:.5rem .8rem;border-radius:12px;font-weight:900;margin:.6rem 0;transition:background .4s}
.flagbar.red{background:var(--red-l);color:#7A1010}
.flagbar.green{background:var(--green-l);color:#0B4A26}
.meter{height:14px;border-radius:999px;background:var(--concrete-xl);overflow:hidden;border:2px solid var(--concrete-l)}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--yellow),#3DBB6A);transition:width .6s}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:.6rem}
.ba h4{margin:0 0 .3rem}
.ba ul{font-size:.9rem}
table.rubric{border-collapse:collapse;width:100%;font-size:.86rem;margin-top:.4rem}
table.rubric th,table.rubric td{border:1px solid var(--concrete-l);padding:.3rem .4rem;text-align:left;vertical-align:top}
table.rubric th{background:var(--blue-l)}
.stopped .arm{animation-play-state:paused!important}
.stop-sign{transition:opacity .4s,transform .5s var(--spring);transform-box:fill-box;transform-origin:center bottom}
.going .stop-sign{opacity:0;transform:scale(0)}
.board-fall{transition:transform .9s cubic-bezier(.5,0,.8,.3),opacity .4s;transform-box:fill-box;transform-origin:center}
.stopped .board-fall{transform:translate(30px,110px) rotate(70deg)}

/* UDL */
.switch{display:flex;align-items:center;gap:.6rem;border:2px solid var(--concrete-l);border-radius:12px;padding:.45rem .7rem;margin:.3rem 0;background:#fff;cursor:pointer;width:100%;text-align:left}
.switch .sw{width:2.6rem;height:1.5rem;border-radius:999px;background:#9AA3AF;position:relative;flex:none;transition:background .2s}
.switch .sw::after{content:"";position:absolute;top:.15rem;left:.15rem;width:1.2rem;height:1.2rem;border-radius:50%;background:#fff;transition:left .2s}
.switch[aria-checked="true"]{border-color:var(--green);background:var(--green-l)}
.switch[aria-checked="true"] .sw{background:var(--green)}
.switch[aria-checked="true"] .sw::after{left:1.25rem}

.entrance{transition:opacity .5s,transform .6s var(--spring);transform-box:fill-box;transform-origin:center bottom}

.fbk{margin-top:.5rem;padding:.5rem .7rem;border-radius:10px;font-weight:600}

/* Tutor + dashboard */
.split{display:grid;grid-template-columns:1fr 1fr;gap:1rem}

.phone .ph-top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:.85rem;padding:.2rem .3rem .5rem;border-bottom:2px solid var(--concrete-l)}
.chat{flex:1;display:flex;flex-direction:column;gap:.45rem;padding:.6rem .2rem;overflow:auto;max-height:min(26rem,26vh)}
.msg{max-width:88%;padding:.5rem .75rem;border-radius:16px;font-size:.92rem;animation:fadeUp .35s ease both}
.msg.student{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:#fff;border:2px solid var(--concrete-l);border-bottom-left-radius:4px}
.msg.system{align-self:center;background:var(--yellow-l);color:#6B4A00;font-weight:800;font-size:.8rem;border-radius:999px}
.msg.bad{border-color:var(--red);background:var(--red-l)}
.typing{align-self:flex-start;font-size:.8rem;color:var(--ink2)}
.dash{border:3px solid var(--blue);border-radius:16px;background:#fff;overflow:hidden}
.dash .d-top{background:var(--blue);color:#fff;font-weight:800;padding:.4rem .8rem;display:flex;justify-content:space-between;align-items:center}
.dash .d-body{padding:.7rem .8rem}
.flag{border-radius:10px;padding:.45rem .65rem;font-weight:800;margin:.3rem 0;display:flex;gap:.4rem;align-items:flex-start}
.flag.info{background:var(--blue-l);color:var(--blue-d)}
.flag.warn{background:var(--amber-l);color:#6B2E00}
.flag.urgent{background:var(--red);color:#fff;animation:blink 1s steps(2) 3}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin:.4rem 0}
.stats div{background:var(--concrete-xl);border-radius:10px;padding:.35rem;text-align:center;font-size:.84rem}
.stats b{display:block;font-size:1.2rem;color:var(--blue-d)}
.transcript{font-size:.86rem;max-height:min(7rem,14vh);overflow:auto;background:var(--concrete-xl);border-radius:10px;padding:.4rem .6rem;margin:.4rem 0}
.transcript p{margin:.15rem 0}
.outcome{margin-top:.5rem;padding:.6rem .8rem;border-radius:12px;background:var(--blue-l);font-size:.92rem;animation:fadeUp .35s ease both}
.outcome.best{background:var(--green-l)}

/* Checklist */
.chk{display:grid;grid-template-columns:auto 1fr;gap:.6rem;align-items:start;border:2px solid var(--concrete-l);border-radius:12px;padding:.5rem .7rem;margin:.35rem 0;background:#fff}
.chk:has(input:checked){border-color:var(--green);background:var(--green-l)}
.chk input{width:1.4rem;height:1.4rem;accent-color:var(--green);margin-top:.15rem}
.chk small{display:block;color:var(--ink2)}

/* Recap rooms */
.room-hot{cursor:pointer}
.room-hot rect.rm{transition:fill .3s}
.room-hot:hover rect.rm,.room-hot:focus-visible rect.rm{fill:#FFF3B0}
.room-hot:focus-visible{outline:none}
.room-hot:focus-visible rect.rm{stroke:var(--ink);stroke-width:5}
.room-hot.seen rect.rm{fill:#FFE27A}
.glow{animation:glow 2.4s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.55}to{opacity:1}}

/* Plan builder */
.form-grid{display:grid;grid-template-columns:1fr;gap:.6rem}
.field label,.field legend{display:block;font-weight:800;margin-bottom:.25rem}
.field select,.field input[type=text]{width:100%;border:2px solid var(--concrete);border-radius:10px;padding:.45rem .6rem;min-height:44px;background:#fff}
fieldset{border:2px solid var(--concrete-l);border-radius:12px;padding:.5rem .8rem;margin:0}
.radio{display:flex;gap:.4rem;align-items:center;margin:.2rem 0}
.radio input{width:1.2rem;height:1.2rem;accent-color:var(--orange-d)}
.plan-out{background:var(--blue-l);border:2px solid #B8D1EA;border-radius:14px;padding:.8rem 1rem;white-space:pre-wrap;font-size:.92rem;margin-top:.8rem}

/* Quiz */
.q{font-size:1.15rem;font-weight:800;margin:.3rem 0 .6rem}
.opts{display:grid;gap:.45rem}
.opt-btn{text-align:left;border:2px solid var(--blue);background:#fff;border-radius:12px;padding:.6rem .9rem;font-weight:700;min-height:48px}
.opt-btn:hover:not(:disabled){background:var(--blue-l)}
.opt-btn.right{border-color:var(--green);background:var(--green-l)}
.opt-btn.wrong{border-color:var(--red);background:var(--red-l)}
.opt-btn:disabled{cursor:default}
.qprog{display:flex;gap:.3rem;margin-bottom:.6rem}

/* Sources */
.sources{font-size:.86rem}
.sources li{margin:0 0 .5rem;break-inside:avoid}
.sources .claim{display:block;font-size:.85rem;color:var(--ink2)}


/* Tighter layout used only when a screen would otherwise not fit (added by fitSlide) */
.compact h2{font-size:1.5rem;margin-bottom:.25em}
.compact .lead{font-size:1rem}
.compact p{margin-bottom:.45em}
.compact .kind{margin-bottom:.3rem}
.compact .widget{margin:.45rem 0}
.compact .widget-bar{padding:.2rem .5rem .2rem .8rem}
.compact .widget-body{padding:.55rem .7rem}
.compact .card{padding:.5rem .75rem}
.compact .callout{padding:.4rem .8rem;margin:.45rem 0}
.compact .grid2,.compact .grid3,.compact .cols2,.compact .cols3{gap:.5rem}
.compact .scene{--scene-h:30vh}
.compact .big-idea{font-size:1.2rem;padding:.4rem;margin:.45rem 0}
.compact .btn{min-height:38px;padding:.3rem .8rem}
.compact .switch{padding:.3rem .55rem;margin:.2rem 0}
.compact .chk,.compact .strat{padding:.35rem .55rem}
.compact ul{margin-bottom:.4em}
.compact li{margin:.12em 0}
.cols-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));gap:.6rem;align-items:start}
.cols-auto>.choice-q{margin:0}
.udl-grid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:1rem;align-items:start}
.mk-dense .mk-strats .strat>span>span{display:none}
.mk-dense .mk-strats .strat{align-items:center}
.dash .btn{min-height:36px;padding:.25rem .7rem;font-size:.9rem}
.fbk{padding:.4rem .6rem}
.switch small .caution{color:var(--orange-d)}
.udl-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,11.5rem),1fr));gap:.45rem}
.udl-tools .switch{margin:0;align-items:flex-start}
.mk-note{display:none}
.mk-dense .mk-art,.mk-dense .mk-cap{display:none}
.mk-dense .mk-note{display:block}
.mk-before-inline{display:none;font-size:.9rem;margin:.1rem 0 .3rem!important}
.mk-dense .mk-before-inline{display:block}
.mk-dense .mk-before{display:none}
.mk-rubric summary{cursor:pointer;color:var(--blue-d)}
.mk-rubric[open] summary{margin-bottom:.2rem}
#udlSvg{--scene-h:28vh}
.switch[data-w][aria-checked="true"] small{display:none}
/* =====================================================================
   8. CHARACTER + SITE ANIMATIONS (SVG)
   ===================================================================== */
.arm.hammer{animation:hammer .55s ease-in-out infinite alternate}
.arm.hammer.slow{animation-duration:.8s}
@keyframes hammer{from{transform:rotate(-60deg)}to{transform:rotate(18deg)}}
.arm.inspect{animation:inspect 2.6s ease-in-out infinite}
@keyframes inspect{0%,100%{transform:rotate(0)}50%{transform:rotate(-25deg)}}
.arm.wave{animation:wave .5s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-40deg)}to{transform:rotate(-100deg)}}
.walk{animation:walk 9s ease-in-out infinite alternate}
@keyframes walk{from{transform:translateX(0)}to{transform:translateX(var(--dist,120px))}}
.bob{animation:bob .45s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.rb-light{animation:blink 1s steps(2) infinite}
.rb-eye{animation:eyes 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes eyes{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.cloud{animation:drift 40s linear infinite}
.cloud.c2{animation-duration:55s;animation-delay:-20s}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(700px)}}
.trolley{animation:trolley 7s ease-in-out infinite alternate}
@keyframes trolley{from{transform:translateX(0)}to{transform:translateX(150px)}}
.swing{animation:swing 2.2s ease-in-out infinite alternate;transform-box:view-box}
@keyframes swing{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.part{transition:opacity .7s ease,transform .9s var(--spring);transform-box:fill-box;transform-origin:50% 100%}
.part.off{opacity:0;transform:translateY(-40px) scaleY(.4);pointer-events:none}
.prop{transition:opacity .5s ease}
.prop.off{opacity:0}
.win-glass{transition:fill 1s}
.lit .win-glass{fill:#FFD54A}
.lit .lamp{fill:#FFE27A}
.bubble-g{animation:bubbleIn .6s var(--spring) both;transform-box:fill-box;transform-origin:center bottom}
@keyframes bubbleIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.sun{animation:sun 6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes sun{from{transform:scale(1)}to{transform:scale(1.08)}}
.star{animation:twinkle 1.2s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.2}to{opacity:1}}
.scan{animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(26px)}}
.xray-wall{transition:opacity .8s}
.xray .xray-wall{opacity:.18}
.hidden-flaw{opacity:0;transition:opacity .8s .3s}
.xray .hidden-flaw{opacity:1}
.walk-in{transition:transform 2.4s ease-in-out}
.paused *{animation-play-state:paused!important}

.scene-wrap{position:relative}
.stamp-row{min-height:3.2rem;text-align:center;margin-top:.6rem}
.stamp-row .stamp{font-size:1.4rem}
.idle .stop-sign{opacity:0;transform:scale(0)}
.walk-in .arm{transition:none}

/* =====================================================================
   9. REDUCED MOTION: html.calm is set automatically from the OS setting
      (prefers-reduced-motion) or by the "Calm motion" button.
      Every element's resting state is its final state, so nothing is lost.
   ===================================================================== */
html.calm *,html.calm *::before,html.calm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion: reduce){
  html:not(.motion-ok) *,html:not(.motion-ok) *::before,html:not(.motion-ok) *::after{animation:none!important;transition:none!important}
}

@media (max-width:1560px){ .tracker{order:3;flex-basis:100%} .brand{flex:1} .topbar{row-gap:.3rem} }

}
/* =====================================================================
   10. RESPONSIVE (tablet and smaller)
   ===================================================================== */
@media (max-width:1000px){
  .layout{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .site{border-right:0;border-bottom:5px solid var(--yellow);flex-direction:row;height:190px}

  .hero h1{font-size:2rem}
  .navhint{display:none}
  .trk .lbl{display:none}

  .navbtn{min-width:5.5rem;padding:.5rem .8rem}
}
@media (max-width:600px){
  .site{height:150px}
  .site svg#siteSvg{max-width:60%}
  .brand b{font-size:.8rem}
}
