<script>
/* =====================================================================
   CONTENT: every word in the lesson lives here. Edit freely.
   - Glossary words: {{key}} shows the glossary word; {{key|other words}} shows other words.
   - A screen with  optional: true  is skipped when "Quick path" is on.
   - <div data-widget="..."> marks where an interactive appears; its data is in CONTENT.data.
   - kind is one of: concept, metaphor, interactive, examples, monday.
   ===================================================================== */
const CONTENT = {

  /* ---------- Glossary: one plain sentence each ---------- */
  glossary: {
    ai: ["AI (artificial intelligence)", "Computer software that finds patterns in huge amounts of examples and uses them to produce text, images, or predictions."],
    llm: ["Large language model", "The kind of AI behind chatbots like ChatGPT: it has read a huge amount of text and predicts which words are likely to come next."],
    chatbot: ["Chatbot", "A program you type (or talk) to, and it types back in a conversation."],
    hallucination: ["Hallucination", "When AI states something false, made-up, or wrong in a confident, believable way."],
    training: ["Training data", "The huge pile of example text the AI learned its patterns from."],
    prompt: ["Prompt", "The request or question you type into an AI tool."],
    detector: ["AI detector", "A tool that guesses whether writing came from AI. It gives a score, not proof."],
    predictable: ["Predictability (perplexity)", "How easy it is for a computer to guess the next word. Researchers call low surprise 'low perplexity.'"],
    falsepos: ["False positive", "A wrong alarm: the tool says 'AI!' about writing a person actually wrote."],
    falseneg: ["False negative", "A miss: the tool says 'human' about writing that AI actually produced."],
    threshold: ["Threshold", "The cut-off score where a tool switches from 'fine' to 'flagged.'"],
    paraphrase: ["Paraphrase", "Saying the same thing in different words."],
    iep: ["IEP", "Individualized Education Program: a legal plan in U.S. schools that lists a student's services and accommodations."],
    udl: ["UDL (Universal Design for Learning)", "Planning lessons and tests with several ways in and several ways to show learning, from the start, so more students can succeed."],
    metacog: ["Metacognition", "Thinking about your own thinking: noticing how you learned, what worked, and what you'd change."],
    accommodation: ["Accommodation", "A change in HOW a student learns or shows learning (like extra time or read-aloud) that does not change WHAT they must know."],
    guardrails: ["Guardrails", "Rules set on an AI tool that limit what it will do, such as giving hints instead of answers."],
    transcript: ["Transcript", "A saved, readable record of everything said in a chat."],
    dpa: ["Data privacy agreement", "A signed contract between a school or district and a company that spells out how student information is protected."],
    ferpa: ["FERPA", "A U.S. federal law that protects the privacy of student education records."],
    coppa: ["COPPA", "A U.S. federal law that limits how online services collect personal information from children under 13."],
    algorithm: ["Algorithm", "A set of step-by-step rules a computer follows."],
    rubric: ["Rubric", "A scoring guide that describes what each level of quality looks like."],
    formative: ["Low-stakes check", "A quick, small check of understanding that counts little (or nothing) toward the grade, used to guide teaching."],
    studentfacing: ["Student-facing tool", "An AI tool that students use themselves, rather than one only the teacher uses."],
    escalate: ["Escalate", "Hand a situation up to the right person, such as a counselor or administrator, because it needs a human now."]
  },

  /* ---------- The 5 stages (tracker + site log) ---------- */
  stages: [
    { short: "Start",       name: "Welcome to the job site", log: "<b>Empty lot.</b> The blueprint is on the ground. Every good house starts with a plan: the learning goal." },
    { short: "Foundation",  name: "Stage 1 · The Foundation Check", log: "<b>Foundation poured.</b> The robot inspector says PASS. The human inspector wants to look behind the walls." },
    { short: "Smoke alarm", name: "Stage 2 · The Faulty Smoke Alarm", log: "<b>Frame going up.</b> Someone installed a smoke alarm that beeps at toast. Hmm." },
    { short: "Crew",        name: "Stage 3 · Crew Reassignment", log: "<b>Walls going up.</b> The inspector halted one station: a machine could do it with no skill. The crew is reassigned." },
    { short: "Inspector",   name: "Stage 4 · The Inspector and the Informant", log: "<b>Roof and windows on.</b> The AI helper radios reports. The human inspector reads every one and makes the call." },
    { short: "Move-in",     name: "Stage 5 · Final Walkthrough", log: "<b>Move-in day!</b> Lights on. The house is a trustworthy picture of what the student actually learned." }
  ],

  /* ---------- Screens, in order ---------- */
  slides: [

  /* ================= START ================= */
  { id:"title", stage:0, kind:"concept", title:"",
    notes:"Welcome everyone. This week is about assessment: grading, AI detectors, redesigning assignments, and student-facing AI tools. We will use one picture the whole time: building a house. Point out the house on the left; it will grow as we go. Let them know they can jump to any stage with the tracker at the top. About 20-25 minutes; Quick path is about 10.",
    html:`<div class="hero">
      <div>
        <p class="eyebrow">AI Literacy for Educators · Week 5</p>
        <h1>Building Assessments You Can Trust</h1>
        <p class="lead">An assessment is like a house: it should give a family (and you) a solid, honest picture of what a student really learned. This week we'll build one together, with {{ai|AI}} as a helpful but limited assistant, and <b>you</b> as the licensed inspector.</p>
        <div class="btnrow"><button class="btn" data-go="next">Start the tour &rarr;</button><button class="btn ghost" data-action="quick">Short on time? Turn on Quick path</button></div>
      </div>
      <div class="card yellow">
        <h3>How to move around</h3>
        <div class="keys">
          <span><kbd>&rarr;</kbd> <kbd>Space</kbd></span><span>Next screen</span>
          <span><kbd>&larr;</kbd></span><span>Previous screen</span>
          <span><kbd>N</kbd></span><span>Presenter notes</span>
          <span>Tracker</span><span>Jump to any stage (top of screen)</span>
          <span>Underlined words</span><span>Tap or hover for a plain-English meaning, like {{llm}}</span>
          <span>&#8634; Reset</span><span>Every activity can be reset and replayed</span>
        </div>
        <p class="small muted" style="margin-top:.6rem">About 20 to 25 minutes. <b>Quick path</b> skips optional screens (about 10 minutes).</p>
      </div>
    </div>` },

  { id:"map", stage:0, kind:"metaphor", title:"Meet the job site",
    notes:"Introduce the metaphor map. Ask participants to guess what each item stands for before clicking. The key ones: AI is a fast but literal helper; the teacher is the licensed inspector; the detector is a faulty smoke alarm.",
    html:`<p class="lead">Everything in this lesson maps to one picture. Tap each card to see what it stands for in your classroom.</p>
      <div data-widget="roles" data-try="Guess first, then tap each card to reveal its meaning."></div>` },

  /* ================= STAGE 1 ================= */
  { id:"s1-concept", stage:1, kind:"concept", title:"How AI actually works (in one minute)",
    notes:"Key message: AI is super-powered autocomplete. It predicts likely words; it does not know facts the way people do, and it does not know your students. That is why it can sound confident and still be wrong. Do the 'predict the next word' demo; the second sentence shows a confident wrong guess.",
    html:`<p class="lead">A {{chatbot|chatbot}} like ChatGPT is a <b>very powerful autocomplete</b>. It learned from enormous amounts of text (its {{training|training data}}) and it predicts which word is most likely to come next. That's it. It does not look things up in its head like a person, and it has never met your students.</p>
      <div data-widget="predict" data-try="Click &lsquo;Let the AI guess&rsquo; for each sentence. Watch which word wins."></div>
      <div class="callout"><b>Why this matters for grading:</b> "Likely-sounding" is not the same as "true" or "fair." AI can sound sure of itself and still be wrong. When that happens, it's called a {{hallucination|hallucination}}.</div>` },

  { id:"s1-scene", stage:1, kind:"metaphor", title:"The robot inspector says PASS",
    notes:"Run the three steps. The robot only checks what it can see from the outside: neat, tidy, house-shaped. The human inspector looks behind the walls. This is the heart of Stage 1: AI can check the surface; the teacher sees what's behind it.",
    html:`<p class="lead">Our robot inspector is fast and never gets tired. It walks through, checks that everything <i>looks</i> like a house, and stamps it. But what is behind the walls?</p>
      <div data-widget="inspect" data-try="Press the three buttons in order."></div>` },

  { id:"s1-defects", stage:1, kind:"interactive", title:"What the AI inspector missed",
    notes:"Let the group call out which room to open. Each hidden defect is a real way AI grading fails. Spend time on the 'Re-run the grader' button in the bedroom: same essay, different scores. Ask: would you accept this from a human colleague?",
    html:`<p class="lead">Six problems are hiding in this house. Each one is a real way AI grading goes wrong. Find all six.</p>
      <div data-widget="defects" data-try="Click (or Tab + Enter) each pulsing question mark to look behind the wall."></div>` },

  { id:"s1-compare", stage:1, kind:"interactive", title:"AI's score vs. what the teacher knows",
    notes:"Four short student samples in different subjects. For each, read the student work aloud, then the AI score, then ask participants what they notice BEFORE revealing what the teacher knows. The pattern: AI judges the surface; the teacher knows the goal, the student, and the context.",
    html:`<p class="lead">Four student responses. The AI's score looks official. Then tap <b>"What the teacher knows"</b>.</p>
      <div data-widget="compare" data-try="Pick a subject tab, read the work, decide what you think, then reveal."></div>` },

  { id:"s1-examples", stage:1, kind:"examples", title:"Where AI grading shows up in real life", optional:true,
    notes:"Optional screen. Name the places teachers meet AI grading: auto-feedback in learning platforms, essay-scoring add-ons, and colleagues pasting student work into chatbots. Mention the U.S. Department of Education's 2023 recommendation to keep 'humans in the loop.'",
    html:`<div class="grid3">
        <div class="card"><h3>Built-in "AI feedback"</h3><p>Many learning platforms and writing tools now offer a button that drafts feedback or a suggested score.</p></div>
        <div class="card"><h3>Essay-scoring add-ons</h3><p>Some products promise to grade a stack of essays in minutes using your {{rubric|rubric}}.</p></div>
        <div class="card"><h3>Copy-and-paste grading</h3><p>A tired teacher pastes student work into a chatbot and asks, "What grade would you give this?"</p></div>
      </div>
      <div class="callout blue"><b>The national guidance agrees:</b> the U.S. Department of Education's 2023 report on AI in teaching and learning recommends keeping <b>"humans in the loop"</b> and explicitly rejects the idea of AI replacing teachers. <span class="cite">(U.S. Dept. of Education, Office of Educational Technology, 2023)</span></div>
      <div class="callout red"><b>Privacy check:</b> pasting student work, names, or personal stories into a free chatbot may share student information with a company your school has no agreement with. Use only tools your school or district has approved (look for a signed {{dpa|data privacy agreement}}). In the U.S., laws like {{ferpa}} and {{coppa}} apply.</div>` },

  { id:"s1-sorter", stage:1, kind:"interactive", title:"AI drafts, teacher decides",
    notes:"Introduce the rule: AI drafts, teacher decides. Then sort the 8 cards together. Good uses: drafting comment banks, checking rubric alignment, summarizing patterns. The line: final grades and judgments about a student.",
    html:`<div class="big-idea">AI drafts. Teacher decides.</div>
      <p>AI can save you real time on the <i>busywork around</i> grading. It should not cross the line into <b>deciding</b> a student's grade or judging a student.</p>
      <div data-widget="sorter1" data-try="Drag each card into a bin (or tap a card, then tap a bin)."></div>` },

  { id:"s1-monday", stage:1, kind:"monday", title:"What to do Monday: Stage 1",
    notes:"Read through the three actions. Encourage people to pick ONE. Checkboxes are just for them; nothing is saved.",
    html:`<div class="monday"><header>&#128203; What to do Monday</header><div class="mbody"><ol>
      <li><label class="check"><input type="checkbox">Ask an approved AI tool to draft a <b>comment bank</b> for one rubric. Edit it in your own voice.</label></li>
      <li><label class="check"><input type="checkbox">Never paste student names or personal stories into an unapproved tool.</label></li>
      <li><label class="check"><input type="checkbox">Keep the <b>final grade</b> yours. If AI suggests a score, treat it like a student teacher's suggestion: maybe helpful, never final.</label></li>
      </ol></div></div>` },

  /* ================= STAGE 2 ================= */
  { id:"s2-concept", stage:2, kind:"concept", title:"How AI detectors work (and why they fail)",
    notes:"Detectors do not find proof. They measure how predictable the writing is. Predictable writing gets flagged as AI. But plenty of humans write predictably: students learning English, students taught a formula, famous texts. Click the two sentences to see predictability coloring.",
    html:`<p class="lead">An {{detector|AI detector}} does not find fingerprints, receipts, or proof. It reads the writing and asks one question: <b>"How easy was each word to guess?"</b></p>
      <div class="grid2">
        <div class="card green"><h3>Very predictable writing</h3><p>The tool thinks: "A computer would write this." <b>Score goes UP.</b></p></div>
        <div class="card blue"><h3>Surprising writing</h3><p>The tool thinks: "A person wrote this." <b>Score goes DOWN.</b></p></div>
      </div>
      <div data-widget="predictability" data-try="Click each sentence to see how a detector &lsquo;sees&rsquo; it."></div>
      <div class="callout"><b>The problem:</b> lots of real people write predictably: students learning English, students taught a strict formula, and famous documents the AI has read thousands of times. And AI writing can be made "surprising" with a few edits. Researchers call this measure {{predictable|perplexity}}.</div>` },

  { id:"s2-scene", stage:2, kind:"metaphor", title:"The smoke alarm that beeps at toast",
    notes:"Run both buttons. The alarm goes off for toast (a false alarm) and stays silent for the fire inside the wall (a miss). Ask: if your alarm did this, would you evacuate the building every time it beeped? Would you trust it when it was quiet?",
    html:`<p class="lead">Imagine a smoke alarm that screams when you make toast, and stays quiet when there's a real fire inside the wall. That's an AI detector.</p>
      <div data-widget="alarm" data-try="Try both buttons. Watch what the alarm does."></div>
      <div class="grid2">
        <div class="card red"><h3>Beeps at toast = a {{falsepos|false positive}}</h3><p>An honest student gets flagged as a cheater.</p></div>
        <div class="card"><h3>Silent in a fire = a {{falseneg|false negative}}</h3><p>Writing that really came from AI slips by with a low score.</p></div>
      </div>` },

  { id:"s2-beep", stage:2, kind:"interactive", title:"Beep or no beep?",
    notes:"Six short samples. For each, have the room vote: human or AI? Then run the simulated detector. The detector is wrong in BOTH directions here, which mirrors what research has found. The samples and scores are illustrative, written for this lesson, except the Constitution excerpt, which has been widely reported as flagged.",
    html:`<p class="lead">Read each sample. Decide: human or AI? Then watch the detector's score. <span class="sim">Simulated example for teaching</span></p>
      <div data-widget="beep" data-try="Make your guess first, then see how the detector did."></div>` },

  { id:"s2-threshold", stage:2, kind:"interactive", title:"The sensitivity dial",
    notes:"Move the dial slowly from left to right. At low sensitivity, misuse walks right by. At high sensitivity, honest students get flagged. There is no setting that gets both to zero. Point out who sits at the high end of the honest scores: English learners and students who were taught a formula.",
    html:`<p class="lead">Every detector has a {{threshold|threshold}}: a score above which it "beeps." Can we just set it perfectly? Try.</p>
      <div data-widget="threshold" data-try="Drag the dial. Watch who gets wrongly flagged and who walks by."></div>` },

  { id:"s2-fool", stage:2, kind:"interactive", title:"Fool the detector in one step", optional:true,
    notes:"Optional. Click the steps in order. The writing is still AI-written the whole time; only the number changes. This is why a detector score cannot be treated as evidence. Research by Sadasivan and colleagues (2023) and Liang and colleagues (2023) showed that rewording drops detection sharply.",
    html:`<p class="lead">If a score can be changed this easily, it can't be evidence. <span class="sim">Simulated example for teaching</span></p>
      <div data-widget="fool" data-try="Click the edits in order. Watch the score."></div>` },

  { id:"s2-evidence", stage:2, kind:"examples", title:"What the research and the real world say",
    notes:"These are the verified, cited facts. Spend a moment on the Stanford study: over half of essays by non-native English writers were flagged as AI on average. And OpenAI, the company behind ChatGPT, shut down its own detector for low accuracy.",
    html:`<div class="grid2">
        <div class="card"><h3>&#127891; Bias against English learners</h3><p>Stanford researchers tested 7 popular detectors on essays written by non-native English speakers (TOEFL essays). On average, the detectors wrongly labeled <b>61%</b> of them as AI-written, and <b>97.8%</b> were flagged by at least one detector. Essays by U.S. 8th graders were judged far more accurately.</p><p class="cite">Liang, Yuksekgonul, Mao, Wu &amp; Zou (2023), <i>Patterns</i></p></div>
        <div class="card"><h3>&#128683; The ChatGPT maker gave up on its own detector</h3><p>OpenAI released an AI text classifier in January 2023 and shut it down on July 20, 2023, citing its <b>low rate of accuracy</b>. It correctly caught only 26% of AI text and wrongly flagged human writing 9% of the time.</p><p class="cite">OpenAI (2023)</p></div>
        <div class="card"><h3>&#128220; The U.S. Constitution "written by AI"</h3><p>In 2023 detectors were widely reported to label the U.S. Constitution, and parts of the Declaration of Independence, as AI-written. The likely reason: these texts appear so often in AI training data that they look "predictable."</p><p class="cite">Ars Technica (Edwards, 2023)</p></div>
        <div class="card"><h3>&#9888;&#65039; Even the vendors warn you</h3><p>Turnitin's own guidance says its AI writing score may misidentify writing and <b>should not be used as the sole basis</b> for action against a student; human judgment and your school's policies are required.</p><p class="cite">Turnitin guidance, as restated by universities (e.g., Idaho State Univ., USC)</p></div>
        <div class="card"><h3>&#127979; Universities turned detectors off</h3><p>Vanderbilt University disabled Turnitin's AI detector in August 2023. It noted that even a 1% false-positive rate could mean about <b>750</b> of its 75,000 yearly papers wrongly flagged. Northwestern also turned it off.</p><p class="cite">Vanderbilt University (2023); Business Insider (2023)</p></div>
        <div class="card"><h3>&#128260; Simple rewording beats detectors</h3><p>Researchers showed that running AI text through a {{paraphrase|paraphrasing}} tool sharply cut detection rates, while the text stayed readable.</p><p class="cite">Sadasivan et al. (2023)</p></div>
      </div>
      <p class="small muted">Full citations are on the Sources screen at the end.</p>` },

  { id:"s2-instead", stage:2, kind:"interactive", title:"What to do instead of accusing",
    notes:"Walk through the script. The goal is a curious, non-accusatory conversation about process. Emphasize equity: a false accusation hits English learners, neurodivergent students, and students taught formulas the hardest, and it damages trust. Follow your school's academic integrity policy.",
    html:`<div class="grid2">
        <div>
          <h3>If something seems off, talk about the process</h3>
          <p>A conversation is better evidence than any score. Ask the student to walk you through how they made the work. People who did the thinking can usually explain it.</p>
          <div data-widget="script" data-try="Copy this script and keep it by your desk."></div>
        </div>
        <div>
          <div class="card red"><h3>Equity risks of false accusations</h3><ul>
            <li><b>English learners</b> are flagged far more often (Liang et al., 2023).</li>
            <li><b>Students taught a formula</b> (like a strict 5-paragraph template) write predictably by design.</li>
            <li><b>Neurodivergent students</b> may write in repetitive or highly structured ways.</li>
            <li>Students with fewer family resources may be <b>less able to push back</b> on an unfair accusation.</li>
            <li>One false accusation can <b>break trust</b> with a student for the rest of the year.</li></ul></div>
          <div class="callout green"><b>Do:</b> look at drafts and version history, compare with work done in class, and follow your school's integrity policy.<br><b>Don't:</b> open with "Did you cheat?" or treat a detector score as proof.</div>
        </div>
      </div>` },

  { id:"s2-monday", stage:2, kind:"monday", title:"What to do Monday: Stage 2",
    notes:"Three actions. The most important: never use a detector score as the only evidence.",
    html:`<div class="monday"><header>&#128203; What to do Monday</header><div class="mbody"><ol>
      <li><label class="check"><input type="checkbox">Never use a detector score as the <b>only</b> evidence. At most, it's a reason to look more closely.</label></li>
      <li><label class="check"><input type="checkbox">Collect process evidence on big assignments: drafts, notes, or version history.</label></li>
      <li><label class="check"><input type="checkbox">Print the conversation script. Start with curiosity, not accusation.</label></li>
      </ol></div></div>` },

  /* ================= STAGE 3 ================= */
  { id:"s3-concept", stage:3, kind:"concept", title:"If a machine can do it alone, it's measuring the machine",
    notes:"The core test: could an AI complete this task, start to finish, with the student understanding nothing? If yes, the assignment measures the AI, not the student. The fix is not banning AI; it's moving the evidence to where student thinking shows.",
    html:`<p class="lead">Here's the one question to ask about any assignment:</p>
      <div class="big-idea">"Could AI do this whole task while the student understands nothing?"</div>
      <div class="grid3">
        <div class="card"><h3>1. Name the skill</h3><p>What is the one thing this assignment is really checking? (Arguing with evidence? Reading a graph?)</p></div>
        <div class="card"><h3>2. Run the test</h3><p>If AI could produce the finished product alone, the product can't prove the skill.</p></div>
        <div class="card"><h3>3. Move the evidence</h3><p>Shift some points to things AI can't fake: process, live explaining, personal or local details, reflection.</p></div>
      </div>
      <p class="callout green">This is not about catching students. It's about making sure the grade means what you want it to mean.</p>` },

  { id:"s3-scene", stage:3, kind:"metaphor", title:"Stop work! Reassign the crew", optional:true,
    notes:"Optional scene. The robot can finish Station A by itself, so the inspector halts work. The crew is moved to stations where their own skill shows. Then the work resumes.",
    html:`<p class="lead">At Station A, a machine can finish the job without the worker learning anything. The inspector halts work, the board falls, and the crew is reassigned.</p>
      <div data-widget="crew" data-try="Press &lsquo;Inspect&rsquo;, then &lsquo;Reassign the crew&rsquo;."></div>` },

  { id:"s3-makeover", stage:3, kind:"interactive", title:"Assessment Makeover Workshop",
    notes:"Pick an assignment participants actually give. Watch the red flag. Then check strategies; at two or more the task turns green and the crew resumes. Read the before/after card and the mini rubric aloud. Invite participants to share which strategy they'd actually try.",
    html:`<p class="lead">Pick an assignment. Then choose redesign strategies and watch the crew get back to work.</p>
      <div data-widget="makeover" data-try="Pick an assignment, then check 2 or more strategies."></div>` },

  { id:"s3-traffic", stage:3, kind:"interactive", title:"The Traffic Light AI-Use Policy",
    notes:"Drag assignments into Red (no AI), Yellow (AI allowed with disclosure), or Green (AI encouraged). There's no single right answer; the suggestions show common reasoning. Emphasize clarity and consistency: label every assignment, and teach students what honest AI use looks like.",
    html:`<p class="lead">Students can't follow rules they can't see. Label every assignment with a color, the same way every time.</p>
      <div class="grid3" style="margin-bottom:.6rem">
        <div class="card red"><b>&#128308; RED: No AI.</b> This shows what you can do on your own.</div>
        <div class="card yellow"><b>&#128993; YELLOW: AI with disclosure.</b> Allowed for listed steps; fill out the AI-use log.</div>
        <div class="card green"><b>&#128994; GREEN: AI encouraged.</b> Explore, practice, get feedback. Still say how you used it.</div>
      </div>
      <div data-widget="traffic" data-try="Drag each assignment to a light. Then compare with common choices."></div>` },

  { id:"s3-policy", stage:3, kind:"interactive", title:"Copy-ready: syllabus statement + AI-use log",
    notes:"Two copy-ready texts. Encourage teachers to adapt the language to their grade level. For young students, the log can be three questions read aloud.",
    html:`<div class="grid2">
        <div><h3>Sample syllabus statement</h3><div data-widget="syllabus" data-try="Copy it, then edit it to fit your class."></div></div>
        <div><h3>Student AI-use disclosure log</h3><div data-widget="disclosure" data-try="Copy and attach to Yellow assignments."></div></div>
      </div>
      <p class="callout">Teach integrity, don't just police it: model your own AI use out loud ("I asked AI for three example sentences, and I rejected two because...").</p>` },

  { id:"s3-udl", stage:3, kind:"interactive", title:"Ramps, wide doors, and many entrances",
    notes:"UDL in plain words: build the ramp from the start instead of adding it later for one person. Toggle the ways to show learning; each opens an entrance on the house. Then look at AI-supported accessibility tools with the caution: vet for privacy, and make sure the tool supports the thinking rather than replacing it.",
    html:`<p class="lead">A well-designed house has ramps, wide doorways, and more than one entrance, built in from the start. {{udl}} does the same for learning: several ways to engage, to take in information, and to <b>show what you know</b>.</p>
      <div data-widget="udl" data-try="Turn on ways to show learning and support tools. Watch new entrances open."></div>` },

  { id:"s3-skill", stage:3, kind:"interactive", title:"Support, or shortcut? Ask: what skill am I measuring?", optional:true,
    notes:"Optional. The same tool can be an accommodation in one assignment and a shortcut in another. The deciding question is always: what skill am I actually measuring? If the tool removes a barrier that is NOT the skill, it's support. If it does the skill for the student, it replaces it.",
    html:`<p class="lead">The same AI tool can be a ramp or a shortcut. The difference depends on one question: <b>"What is the skill I'm actually measuring?"</b></p>
      <div data-widget="skill" data-try="For each case, decide: does the tool support or replace the skill?"></div>` },

  { id:"s3-examples", stage:3, kind:"examples", title:"What this looks like in real classrooms", optional:true,
    notes:"Optional. These are composite examples based on common practice, not specific real people. Ask participants for their own examples.",
    html:`<p class="muted small">Composite examples based on common classroom practice.</p>
      <div class="grid3">
        <div class="card"><h3>4th grade reading</h3><p>Take-home book reports became 2-minute <b>"book talks"</b> recorded on a class tablet, plus one question from the teacher.</p></div>
        <div class="card"><h3>College chemistry</h3><p>Lab reports now include the <b>hand-written lab notebook page</b> from class and a 5-minute "explain your graph" chat during office hours.</p></div>
        <div class="card"><h3>8th grade ELA</h3><p>Essays are written in a shared document with <b>version history on</b>. Points go to the outline, a draft, and revision notes.</p></div>
        <div class="card"><h3>High school math</h3><p>Fewer homework problems; more <b>mini-whiteboard checks</b> where students show their steps in the room.</p></div>
        <div class="card"><h3>Middle school health</h3><p>Reflections are built on a private <b>one-week habit log</b>, so the writing is about the student's own real data.</p></div>
        <div class="card"><h3>College history</h3><p>Students get an <b>AI-written paragraph with planted errors</b> and must find, fix, and cite the corrections.</p></div>
      </div>` },

  { id:"s3-monday", stage:3, kind:"monday", title:"What to do Monday: Stage 3",
    notes:"Three actions. Small changes count: one checkpoint, one explain-back, one label.",
    html:`<div class="monday"><header>&#128203; What to do Monday</header><div class="mbody"><ol>
      <li><label class="check"><input type="checkbox">Pick <b>one</b> assignment and run the test: could AI do it alone?</label></li>
      <li><label class="check"><input type="checkbox">Add one strategy: a draft checkpoint, a 2-minute explain-back, or a reflection question.</label></li>
      <li><label class="check"><input type="checkbox">Put a Red / Yellow / Green label on your next assignment, and say why.</label></li>
      </ol></div></div>` },

  /* ================= STAGE 4 ================= */
  { id:"s4-concept", stage:4, kind:"concept", title:"Student-facing AI tools, with you in charge",
    notes:"Define student-facing: students use it themselves, like an AI tutor or writing coach. Teacher-facing tools only you use. Teacher oversight means you choose, you set the rules, you can see what happened, and you make the final call.",
    html:`<div class="grid2">
        <div class="card blue"><h3>Teacher-facing tool</h3><p>Only <b>you</b> use it: drafting a lesson plan, a quiz, or comments.</p></div>
        <div class="card yellow"><h3>{{studentfacing}}</h3><p><b>Students</b> use it themselves: an AI tutor, a writing coach, a reading helper, a {{chatbot|chatbot}}.</p></div>
      </div>
      <h3 style="margin-top:1rem">What "teacher oversight" looks like</h3>
      <div class="grid3">
        <div class="card"><b>You choose</b> the tool, after checking privacy and age rules.</div>
        <div class="card"><b>You set the rules</b> ({{guardrails|guardrails}}), such as "give hints, not answers."</div>
        <div class="card"><b>You can see</b> what was said ({{transcript|transcripts}}) and get alerts.</div>
        <div class="card"><b>You step in</b> when the tool is wrong or a student needs a person.</div>
        <div class="card"><b>You decide</b> anything that counts: grades, integrity, wellbeing.</div>
        <div class="card"><b>You tell families</b> what the tool is and offer an alternative.</div>
      </div>` },

  { id:"s4-scene", stage:4, kind:"metaphor", title:"The informant radios the inspector", optional:true,
    notes:"Optional scene. The AI informant reports from the job site. The inspector reads each report and decides: approve, fix, or go in person. Together they build better than either alone.",
    html:`<p class="lead">The AI helper is the <b>informant</b>: it works on the site and radios reports. You are the <b>inspector</b>: you read the reports, set the building code, and have the final say.</p>
      <div data-widget="radio" data-try="Press &lsquo;Next report&rsquo; three times and watch the inspector decide."></div>` },

  { id:"s4-sim", stage:4, kind:"interactive", title:"Simulation: AI tutor + teacher dashboard",
    notes:"Three scenarios. Play the chat on the left, then use the dashboard on the right. In scenario 1, try turning the 'hints only' guardrail off to see why it matters. In scenario 2 (wellbeing), the only acceptable outcome is that a person acts today, following the school's protocol. In scenario 3, the tutor corrects gently and the dashboard shows a class-wide misconception.",
    html:`<p class="lead">Left: a student chatting with an AI tutor. Right: what you see. <span class="sim">Simulated example for teaching (scripted, no real AI)</span></p>
      <div data-widget="tutor" data-try="Choose a scenario, press &lsquo;Play next message&rsquo;, then choose an action on the dashboard."></div>` },

  { id:"s4-checklist", stage:4, kind:"interactive", title:"Your oversight inspection checklist",
    notes:"Check off each item for a tool you use or are considering. When all seven are checked, the tool passes inspection. Open 'why it matters' for any item that sparks questions.",
    html:`<p class="lead">Before students use any AI tool, it should pass this inspection.</p>
      <div data-widget="checklist" data-try="Think of a tool you use. Check each item it meets."></div>` },

  { id:"s4-examples", stage:4, kind:"examples", title:"Real tools: categories and examples",
    notes:"Tool names are examples, not endorsements. Features described come from each company's help pages and can change; always check current documentation and your district's approved list.",
    html:`<div class="grid2">
        <div class="card"><h3>Common kinds of student-facing AI</h3><ul>
          <li><b>AI tutors</b> that coach through problems</li>
          <li><b>Writing coaches</b> that give feedback on drafts</li>
          <li><b>Reading and language helpers</b> (read-aloud, translation, leveled text)</li>
          <li><b>Teacher platforms with "student mode,"</b> where you set up a chatbot for your class</li></ul></div>
        <div class="card blue"><h3>Two well-known examples</h3>
          <p><b>Khanmigo</b> (Khan Academy): teachers can view students' chat history, and the help center says teachers are emailed when a student's conversation is flagged by moderation.</p>
          <p><b>MagicSchool</b> student tools: teachers choose which tools students can use and can monitor activity; flagged chats send the teacher a dashboard notification.</p>
          <p class="cite">Examples only, not endorsements. Based on each company's help center (checked November 2026). Features change; verify before use.</p></div>
      </div>` },

  { id:"s4-flags", stage:4, kind:"interactive", title:"Green flags and red flags",
    notes:"Sort the statements together. Ask participants which red flag they have actually run into with a tool at their school.",
    html:`<p class="lead">When you look at any AI tool for students, some features are green flags and some are red flags. Sort them.</p>
      <div data-widget="flags" data-try="Sort each statement: green flag or red flag?"></div>` },

  { id:"s4-monday", stage:4, kind:"monday", title:"What to do Monday: Stage 4",
    notes:"Three actions. The key one: know where the transcripts and alerts go before students ever log in.",
    html:`<div class="monday"><header>&#128203; What to do Monday</header><div class="mbody"><ol>
      <li><label class="check"><input type="checkbox">Check your school or district's list of approved AI tools before using one with students.</label></li>
      <li><label class="check"><input type="checkbox">Find out <b>where transcripts and alerts go</b>, and who responds to a wellbeing alert.</label></li>
      <li><label class="check"><input type="checkbox">Send families a short note: what the tool is, what it's for, and how to opt out.</label></li>
      </ol></div></div>` },

  /* ================= STAGE 5 ================= */
  { id:"s5-rooms", stage:5, kind:"metaphor", title:"Move-in day: the final walkthrough",
    notes:"The house is finished and the lights are on. Click each room for the one-sentence recap of each stage. Ask: which room do you need to work on first?",
    html:`<p class="lead">The house is done. Walk through each room for a one-sentence recap.</p>
      <div data-widget="rooms" data-try="Click each lit room."></div>` },

  { id:"s5-plan", stage:5, kind:"interactive", title:"Build your own plan",
    notes:"Give participants three minutes to build a plan for one real assignment, then copy it into the discussion board or their own notes.",
    html:`<p class="lead">Choose one assignment you really give. Get a short action plan you can copy.</p>
      <div data-widget="plan" data-try="Fill in the choices. The plan updates as you go."></div>` },

  { id:"s5-quiz", stage:5, kind:"interactive", title:"Confidence check (just for you)",
    notes:"Five low-stakes questions, one per big idea. Nothing is saved or graded. Replay as often as you like.",
    html:`<p class="lead">Five quick questions. Nothing is saved or graded.</p>
      <div data-widget="quiz" data-try="Pick an answer to see instant feedback."></div>` },

  { id:"s5-discuss", stage:5, kind:"examples", title:"For the discussion board",
    notes:"Assign one or more of these for the course discussion board. Encourage specific classroom examples.",
    html:`<p class="lead">Choose one question and respond on the course discussion board. Reply to at least one colleague.</p>
      <ol class="card" style="padding-left:2.2rem;font-size:1.08rem">
        <li><b>The inspector's call.</b> Think of one grading task where AI could save you time. Where exactly would you draw the line between "AI drafts" and "teacher decides," and why?</li>
        <li><b>The smoke alarm.</b> A colleague says, "The detector said 90% AI, so I gave a zero." Using what you learned, how would you respond kindly and convincingly?</li>
        <li><b>Makeover.</b> Share the before-and-after of one assignment you plan to redesign. Which strategy did you choose, what skill does it measure, and what Traffic Light color will you give it?</li>
      </ol>
      <div data-widget="discussCopy" data-try="Copy all three questions."></div>` },

  { id:"s5-sources", stage:5, kind:"examples", title:"Sources (1 of 2): AI detectors",
    notes:"Every external claim in the lesson is listed on these two screens. This first page covers the Stage 2 research on AI detectors.",
    html:`<p>Every outside fact in this lesson, with its source. Claims that could not be verified were left out.</p>
      <div data-widget="sources" data-from="0" data-to="7"></div>` },

  { id:"s5-sources-2", stage:5, kind:"examples", title:"Sources (2 of 2): guidance and tools",
    notes:"Samples, scores, chats, and classroom stories marked 'simulated' or 'composite' were written for teaching and are not real data.",
    html:`<div data-widget="sources" data-from="7" data-to="12"></div>
      <div class="callout"><b>About the simulations:</b> student work samples, detector scores, grader scores, tutor chats, dashboards, and classroom vignettes in this lesson were written for teaching. They are illustrative, not real student data or real tool output. The one exception is the U.S. Constitution excerpt, which is real and was widely reported as flagged by detectors in 2023.</div>
      <div class="big-idea">&#127968; Thanks for building with us. See you in Week 6!</div>` }
  ],

/* Glossary markup {{key}} or {{key|shown words}} -> tooltip button */
function gl(s){
  return String(s).replace(/\{\{(\w+)(?:\|([^}]+))?\}\}/g, (m,k,txt) => {
    const g = CONTENT.glossary[k]; if(!g) return txt || k;
    return '<button type="button" class="term" data-term="'+k+'">'+(txt || g[0])+'</button>';
  });
}

/* Clipboard with fallback for locked-down school computers */
function copyText(text, btn){
  const done = ok => { if(!btn) return; const o = btn.dataset.label || btn.textContent; btn.dataset.label = o;
    btn.textContent = ok ? 'Copied! ✓' : 'Select the text and press Ctrl+C'; setTimeout(()=>{ btn.textContent = o; }, 2200); };
  const fallback = () => { try{ const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); done(ok); }catch(e){ done(false); } };
  try{ if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(()=>done(true), fallback); } else fallback(); }
  catch(e){ fallback(); }
}

function fitSite(){
  const svg=$('#siteSvg'); if(!svg) return; let H=390;
  if(matchMedia('(min-width:1001px)').matches && !$('#site').classList.contains('collapsed')){ const r=svg.getBoundingClientRect(); if(r.width>0 && r.height>0) H=Math.max(390, Math.min(1100, 600*r.height/r.width)); }
  svg.setAttribute('viewBox','0 '+Math.round(430-H)+' 600 '+Math.round(H));
}
window.addEventListener('resize', fitSite);
function setSite(stage){
  const svg = $('#siteSvg');
  if(!svg.dataset.built){ svg.insertAdjacentHTML('beforeend', siteSVG()); svg.dataset.built='1'; }
  $$('[data-min]', svg).forEach(el => { const on = stage >= +el.dataset.min && stage <= +el.dataset.max; el.classList.toggle('off', !on); if(el.classList.contains('prop')) el.style.display = on ? '' : 'none'; });
  svg.classList.toggle('lit', stage === 5);
  $('#siteDesc').textContent = SITE_DESC[stage];
  $('#siteLog').innerHTML = CONTENT.stages[stage].log;
  fitSite();
}

function makeCtx(){ const t=[]; const c={ later(fn,ms){ const id=setTimeout(fn, isCalm()? Math.min(ms,120) : ms); t.push(id); return id; }, clear(){ t.forEach(clearTimeout); t.length=0; } }; liveCtx.push(c); return c; }
function mountWidgets(rootEl){
  $$('[data-widget]', rootEl).forEach(el => {
    const name = el.dataset.widget, fn = W[name]; if(!fn) return;
    el.classList.add('widget');
    const tr = el.dataset.try;
    el.innerHTML = '<div class="widget-bar"><span class="try">'+(tr?'<b>Try it:</b>'+tr:'')+'</span>'+
      (NO_RESET[name]?'':'<button type="button" class="reset" aria-label="Reset this scene">&#8634; Reset this scene</button>')+'</div><div class="widget-body"></div>';
    if(!tr && NO_RESET[name]) $('.widget-bar', el).remove();
    const body = $('.widget-body', el); let ctx = null;
    const run = () => { if(ctx) ctx.clear(); ctx = makeCtx(); body.innerHTML=''; fn(body, ctx); };
    const rb = $('.reset', el); if(rb) rb.addEventListener('click', () => { run(); const f = body.querySelector('button:not([disabled]),input,select,[tabindex="0"]'); if(f) f.focus(); });
    run();
  });
  $$('svg.scene', rootEl).forEach(s=>{ const v=s.viewBox&&s.viewBox.baseVal; if(v&&v.height) s.style.setProperty('--ar', v.width/v.height); });
}
function copyWidget(text){ return function(body){ body.innerHTML = '<div class="copybox" tabindex="0" aria-label="Text to copy">'+esc(text)+'</div><div class="btnrow"><button type="button" class="btn">&#128203; Copy to clipboard</button></div>'; $('.btn',body).onclick = e => copyText(text, e.currentTarget); }; }

/* ---------- Gauge (detector dial) ---------- */
function gaugeSVG(id){
  const P = p => { const t=Math.PI*(1-p/100); return [(110+90*Math.cos(t)).toFixed(1),(110-90*Math.sin(t)).toFixed(1)]; };
  const arc = (a,b,c) => { const s=P(a), e=P(b); return '<path d="M'+s[0]+' '+s[1]+' A90 90 0 0 1 '+e[0]+' '+e[1]+'" stroke="'+c+'" stroke-width="18" fill="none"/>'; };
  return '<svg class="gauge" viewBox="0 0 220 150" role="img" aria-label="Detector dial"><title>Detector dial</title>'+arc(0,40,'#3DBB6A')+arc(40,70,'#FFC20E')+arc(70,100,'#E53935')+
    '<text x="20" y="128" font-size="11" font-weight="700" fill="#414C5C" font-family="Arial,sans-serif">Human</text><text x="200" y="128" font-size="11" font-weight="700" fill="#414C5C" text-anchor="end" font-family="Arial,sans-serif">AI</text>'+
    '<g class="needle" id="'+id+'" style="transform:rotate(-90deg)"><line x1="110" y1="110" x2="110" y2="34" stroke="#1B2430" stroke-width="5" stroke-linecap="round"/></g><circle cx="110" cy="110" r="9" fill="#1B2430"/>'+
    '<text id="'+id+'-t" x="110" y="144" font-size="20" font-weight="900" text-anchor="middle" fill="#1B2430" font-family="Arial,sans-serif">--</text></svg>';
}
function setGauge(body, id, score, ctx){
  const n = $('#'+id, body), t = $('#'+id+'-t', body);
  n.style.transform = 'rotate('+(-90+score*1.8)+'deg)';
  if(isCalm()){ t.textContent = score+'%'; return; }
  let v=0; const step=()=>{ v=Math.min(score, v+Math.max(1,Math.round(score/25))); t.textContent=v+'%'; if(v<score) ctx.later(step, 40); }; step();
}

/* ---------- Stage 1: AI score vs teacher knowledge ---------- */
W.compare = function(body){
  body.innerHTML = '<div class="tabs" role="tablist" aria-label="Student responses">'+D.compare.map((c,i)=>'<button type="button" class="tab" role="tab" id="ctab'+i+'" aria-selected="'+(i?'false':'true')+'" aria-controls="cpanel" data-i="'+i+'">'+c.tab+'</button>').join('')+'</div><div id="cpanel" role="tabpanel"></div><p class="sorter-status" id="cstat" aria-live="polite"></p>';
  const seen=new Set();
  function show(i){
    const c=D.compare[i];
    $$('.tab',body).forEach(t=>t.setAttribute('aria-selected', +t.dataset.i===i ? 'true':'false'));
    $('#cpanel',body).setAttribute('aria-labelledby','ctab'+i);
    $('#cpanel',body).innerHTML = '<p class="muted small" style="margin:0">'+c.label+'</p><p><b>Prompt:</b> '+esc(c.prompt)+'</p><div class="student" aria-label="Student response">'+esc(c.student)+'</div>'+
      '<div class="vs"><div class="card blue"><span class="stamp-slot"></span><h3>&#129302; AI grader</h3><span class="sim">Simulated example for teaching</span><div class="score">'+c.aiScore+'</div><p>“'+esc(c.aiComment)+'”</p></div>'+
      '<div class="card yellow" id="tk"><div class="teacher-hidden"><div><h3>&#128119; What the teacher knows</h3><p class="small">What do <i>you</i> notice first? Then reveal.</p><button type="button" class="btn">Reveal what the teacher knows</button></div></div></div></div>';
    $('#tk .btn',body).onclick=()=>{ seen.add(i); $('#tk',body).innerHTML='<h3>&#128119; What the teacher knows</h3><p>'+c.teacher+'</p>';
      const label = {review:'Needs human review',failed:'Failed: AI missed it',approved:'Approved'}[c.stamp];
      $('.stamp-slot',body).innerHTML='<span class="stamp '+c.stamp+' pop">'+label+'</span>';
      $('#cstat',body).textContent = seen.size===D.compare.length ? 'All four checked. In every case, the AI judged the surface; the teacher judged the learning.' : seen.size+' of '+D.compare.length+' revealed. Try another tab.';
      $('#tk h3',body).setAttribute('tabindex','-1'); $('#tk h3',body).focus(); };
  }
  $$('.tab',body).forEach(t=>{ t.onclick=()=>show(+t.dataset.i); t.addEventListener('keydown',e=>{ const n=D.compare.length; let k=+t.dataset.i; if(e.key==='ArrowRight'){k=(k+1)%n;} else if(e.key==='ArrowLeft'){k=(k+n-1)%n;} else return; e.preventDefault(); e.stopPropagation(); show(k); $('#ctab'+k,body).focus(); }); });
  show(0);
};

    '<rect y="322" width="640" height="78" fill="#5C4A36"/><polygon points="80,116 320,26 560,116" fill="#8B3A2B"/><rect x="96" y="112" width="448" height="212" fill="#F5EFE3"/>'+
    R.map((r,i)=>{ const b=box[i]; return '<g class="room-hot" role="button" tabindex="0" data-i="'+i+'" aria-label="'+r.name+' room: Stage '+r.stage+' recap"><rect class="rm" x="'+b[0]+'" y="'+b[1]+'" width="'+b[2]+'" height="'+b[3]+'" rx="6" fill="#FFF7CC" stroke="#E0A800" stroke-width="3"/>'+
      '<text x="'+(b[0]+b[2]/2)+'" y="'+(b[1]+b[3]/2-2)+'" font-size="17" font-weight="900" text-anchor="middle" fill="#073764">'+r.name+'</text><text x="'+(b[0]+b[2]/2)+'" y="'+(b[1]+b[3]/2+18)+'" font-size="12" font-weight="700" text-anchor="middle" fill="#414C5C">Stage '+r.stage+'</text></g>'; }).join('')+
    '</svg>'+
    '<div class="card dpanel" id="rmPanel" aria-live="polite"><h3>&#128273; Welcome home</h3><p>Every room holds one big idea. Click a room to walk through it.</p></div></div><p class="found-count" id="rmCount" aria-live="polite">Rooms visited: 0 of '+R.length+'</p>';
  const seen=new Set();
  function open(i){ const r=R[i]; seen.add(i); $('.room-hot[data-i="'+i+'"]',body).classList.add('seen');
    $('#rmPanel',body).innerHTML='<p class="muted small" style="margin:0">Stage '+r.stage+'</p><h3>'+r.name+'</h3><p class="lead">'+esc(r.line)+'</p>';
    $('#rmCount',body).innerHTML='Rooms visited: '+seen.size+' of '+R.length+(seen.size===R.length?' &nbsp;<span class="stamp approved pop">Move-in ready</span>':''); }
  $$('.room-hot',body).forEach(g=>{ g.addEventListener('click',()=>open(+g.dataset.i)); g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(+g.dataset.i);} }); });
};

/* ---------- Stage 5: build your own plan ---------- */
W.plan = function(body){
  const P=D.plan;
  body.innerHTML='<div class="grid2"><div class="form-grid"><div class="field"><label for="plType">Type of assignment</label><select id="plType">'+P.types.map(t=>'<option value="'+t.id+'">'+t.name+'</option>').join('')+'</select></div>'+
    '<div class="field"><label for="plName">Its name (optional)</label><input type="text" id="plName" placeholder="e.g., Unit 3 persuasive essay"></div>'+
    '<fieldset class="field"><legend>AI-use level</legend>'+['red','yellow','green'].map(l=>'<label class="radio"><input type="radio" name="plLevel" value="'+l+'"> '+({red:'RED: No AI',yellow:'YELLOW: AI allowed with disclosure',green:'GREEN: AI encouraged'})[l]+'</label>').join('')+'</fieldset>'+
    '<fieldset class="field"><legend>Add strategies (optional)</legend><div class="cols2" style="gap:0 .8rem">'+D.strategies.map(s=>'<label class="radio"><input type="checkbox" name="plStrat" value="'+s.id+'"> '+s.name+'</label>').join('')+'</div></fieldset></div>'+
    '<div><div class="plan-out" id="plOut" aria-live="polite" tabindex="0" aria-label="Your action plan" style="margin-top:0"></div><div class="btnrow"><button type="button" class="btn" id="plCopy">&#128203; Copy to clipboard</button></div></div></div>';
  let touchedLevel=false;
  function build(){ const t=P.types.find(x=>x.id===$('#plType',body).value); const name=$('#plName',body).value.trim();
    if(!touchedLevel) $$('input[name=plLevel]',body).forEach(r=>r.checked = r.value===t.level);
    const lvl=($('input[name=plLevel]:checked',body)||{}).value||t.level; const strats=$$('input[name=plStrat]:checked',body).map(x=>D.strategies.find(s=>s.id===x.value));
    const lines=['MY ASSIGNMENT ACTION PLAN','Assignment: '+(name||t.name)+(name?' ('+t.name+')':''),'',
      '1. KEEP: '+t.keep[0].toUpperCase()+t.keep.slice(1)+'.',
      '2. CHANGE: '+t.change[0].toUpperCase()+t.change.slice(1)+'.'+(strats.length?'\n   Also add: '+strats.map(s=>s.name+' ('+s.plain[0].toLowerCase()+s.plain.slice(1).replace(/\.$/,'')+')').join('; ')+'.':''),
      '3. AI-USE LEVEL: '+P.levels[lvl]+' I will label it on the assignment and explain why.',
      '4. OVERSIGHT: '+t.oversight+' A detector score will never be my only evidence. If AI drafts any feedback, I review it first, and I make the final grade.',
      '5. FIRST STEP: Tell students the plan, share the syllabus statement'+(lvl==='yellow'?', and hand out the AI-use log.':'.')];
    $('#plOut',body).textContent=lines.join('\n'); }
  $('#plType',body).onchange=()=>{ touchedLevel=false; build(); };
  $('#plName',body).oninput=build;
  $$('input[name=plLevel]',body).forEach(r=>r.onchange=()=>{ touchedLevel=true; build(); });
  $$('input[name=plStrat]',body).forEach(r=>r.onchange=build);
  $('#plCopy',body).onclick=e=>copyText($('#plOut',body).textContent, e.currentTarget);
  build();
};

/* ---------- Stage 5: confidence check ---------- */
W.quiz = function(body){
  let i=0, score=0; const Q=D.quiz;
  function show(){
    if(i>=Q.length){ body.innerHTML='<div class="card" style="text-align:center"><h3>You finished!</h3><p class="score">'+score+' of '+Q.length+'</p><p>'+(score===Q.length?'Licensed inspector material. &#127942;':'Review any stage with the tracker at the top, then try again.')+'</p><button type="button" class="btn" id="qAgain">&#8635; Replay</button></div>';
      $('#qAgain',body).onclick=()=>{ i=0; score=0; show(); $('.opt-btn',body).focus(); }; return; }
    const q=Q[i];
    body.innerHTML='<div class="qprog dots" aria-hidden="true">'+Q.map((_,k)=>'<i class="'+(k<i?'r':k===i?'cur':'')+'"></i>').join('')+'</div><p class="small muted" style="margin:0">Question '+(i+1)+' of '+Q.length+' · Stage '+q.stage+'</p><p class="q" id="qq">'+esc(q.q)+'</p>'+
      '<div class="opts" role="group" aria-labelledby="qq">'+q.opts.map((o,k)=>'<button type="button" class="opt-btn" data-k="'+k+'">'+esc(o)+'</button>').join('')+'</div><div id="qfb" aria-live="polite"></div>';
    $$('.opt-btn',body).forEach(b=>b.onclick=()=>{ const k=+b.dataset.k, ok=k===q.a; if(ok) score++;
      $$('.opt-btn',body).forEach(x=>{ x.disabled=true; if(+x.dataset.k===q.a) x.classList.add('right'); });
      if(!ok) b.classList.add('wrong');
      $('#qfb',body).innerHTML='<div class="fbk '+(ok?'ok':'no')+'">'+(ok?'✓ Right. ':'Not quite. ')+esc(q.why)+'</div><div class="btnrow"><button type="button" class="btn" id="qNext">'+(i+1<Q.length?'Next question →':'See my score')+'</button></div>';
      $('#qNext',body).onclick=()=>{ i++; show(); const f=$('.opt-btn',body)||$('#qAgain',body); if(f) f.focus(); }; $('#qNext',body).focus(); });
  }
  show();
};

/* ---------- Sources ---------- */
W.sources = function(body){
  const host=body.closest('[data-widget]'), from=+(host.dataset.from||0), to=+(host.dataset.to||D.sources.length);
  body.innerHTML='<ol class="sources" start="'+(from+1)+'" style="columns:2 22rem;column-gap:1.4rem">'+D.sources.slice(from,to).map(s=>'<li>'+s.cite+' <a href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">'+esc(s.url.replace(/^https?:\/\//,'').replace(/\/$/,'').slice(0,70))+(s.url.length>78?'…':'')+'</a><span class="claim">Supports: '+esc(s.claim)+'</span></li>').join('')+'</ol>';
};

/* =====================================================================
   NAVIGATION, TRACKER, NOTES, KEYBOARD, TOOLTIP
   ===================================================================== */
const KIND = { concept:'Concept', metaphor:'On the job site', interactive:'Try it', examples:'Real world', monday:'What to do Monday' };
const state = { i:0, quick:false, notes:false };
const visible = () => CONTENT.slides.filter(s => !(state.quick && s.optional));
const slideEl = $('#slide'), inner = $('#slideInner');

/* Fit-to-screen: on larger screens, shrink the current screen (CSS zoom) so it
   fits without scrolling. Re-fits on resize, full screen, and when an activity grows.
   It never shrinks body text below MIN_TEXT_PX; if a screen still does not fit,
   it switches to a tighter layout (.compact) at that same smallest size. */
/* MIN_TEXT_PX: body text never shrinks below this many screen pixels (readable on a video call). */
const MIN_TEXT_PX = 14, FIT_FROM_WIDTH = 1000, INNER_MAX = 1100;
const minZoom = () => Math.min(1, MIN_TEXT_PX / (parseFloat(getComputedStyle(document.documentElement).fontSize) || 16));
const canZoom = !!(window.CSS && CSS.supports && CSS.supports('zoom','0.5'));
let fitRaf = 0;
function fitSlide(){
  if(!canZoom) return;
  const set = z => { inner.style.zoom = z===1 ? '' : z; inner.style.maxWidth = z===1 ? '' : (INNER_MAX/z)+'px'; };
  inner.classList.remove('compact'); set(1);
  if(innerWidth < FIT_FROM_WIDTH) return;
  const avail = slideEl.clientHeight, h = () => inner.getBoundingClientRect().height;
  const tryFit = minZ => {
    set(1); if(h() <= avail) return true;
    set(minZ); if(h() > avail) return false;
    let lo = minZ, hi = 1;
    for(let i=0;i<7;i++){ const m=(lo+hi)/2; set(m); if(h() <= avail) lo=m; else hi=m; }
    set(Math.floor(lo*1000)/1000); return true;
  };
  const zMin = minZoom();
  if(tryFit(zMin)) return;
  inner.classList.add('compact');
  tryFit(zMin);
}
const requestFit = () => { cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fitSlide); };
window.addEventListener('resize', requestFit);
/* Re-fit when content grows or shrinks. A loop guard stops back-and-forth re-fitting:
   bursts of changes are bundled into one re-fit, and more than 12 re-fits in one second pause them. */
if(window.ResizeObserver){
  let last=0, burst=[], roTimer=0;
  new ResizeObserver(()=>{
    const hh=Math.round(inner.getBoundingClientRect().height); if(Math.abs(hh-last)<=2) return; last=hh;
    clearTimeout(roTimer);
    roTimer=setTimeout(()=>{ const now=performance.now(); burst=burst.filter(t=>now-t<1000); if(burst.length>=12) return; burst.push(now); requestFit(); }, 120);
  }).observe(inner);
}

function buildTracker(){
  $('#tracker').innerHTML = CONTENT.stages.map((s,k)=>'<li><button type="button" class="trk" data-stage="'+k+'" aria-label="'+esc(s.name)+'"><span class="n" aria-hidden="true">'+(k?k:'⌂')+'</span><span class="lbl">'+s.short+'</span></button></li>').join('');
  $$('#tracker .trk').forEach(b=>b.onclick=()=>{ const st=+b.dataset.stage; const v=visible(); const idx=v.findIndex(s=>s.stage===st); if(idx>=0) go(idx); });
}
function updateTracker(stage){
  $$('#tracker .trk').forEach(b=>{ const k=+b.dataset.stage; b.classList.toggle('done', k<stage); if(k===stage) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current');
    b.parentElement.classList.toggle('done', k<=stage && k>0); });
}
function render(dir){
  const v=visible(); state.i=Math.max(0,Math.min(state.i,v.length-1)); const s=v[state.i];
  liveCtx.forEach(c=>c.clear()); liveCtx=[]; hideTip();
  $$('.ghost-card').forEach(g=>g.remove());
  const label = s.stage ? 'Stage '+s.stage+' · '+KIND[s.kind] : (s.kind==='concept'?'Welcome':KIND[s.kind]);
  inner.className='slide-inner'; void inner.offsetWidth; inner.classList.add(dir==='prev'?'enter-prev':'enter-next');
  inner.innerHTML='<div class="kind k-'+s.kind+'">'+label+(s.optional?' <span class="opt">optional</span>':'')+'</div>'+(s.title?'<h2 id="slideTitle" tabindex="-1">'+gl(s.title)+'</h2>':'')+gl(s.html);
  mountWidgets(inner);
  slideEl.setAttribute('aria-label', (s.title?stripTags(s.title):'Welcome')+' (screen '+(state.i+1)+' of '+v.length+')');
  setSite(s.stage); updateTracker(s.stage);
  const inStage=v.filter(x=>x.stage===s.stage), pos=inStage.indexOf(s)+1;
  $('#count').textContent=(s.stage?'Stage '+s.stage+' · ':'')+'Screen '+pos+' of '+inStage.length+'  ·  '+(state.i+1)+' of '+v.length+' overall'+(state.quick?' (Quick path)':'');
  $('#barFill').style.width=((state.i+1)/v.length*100)+'%';
  $('#prevBtn').disabled = state.i===0; $('#nextBtn').disabled = state.i===v.length-1;
  $('#notesBody').innerHTML='<p><b>'+esc(CONTENT.stages[s.stage].name)+(s.title?' — '+esc(stripTags(s.title)):'')+'</b></p><p>'+esc(s.notes||'')+'</p>';
  slideEl.scrollTop=0;
  fitSlide();
  try{ history.replaceState(null,'','#'+s.id); }catch(e){}
  document.title = (s.title?stripTags(s.title)+' · ':'')+'Week 5: Building Assessments You Can Trust';
}
function go(idx, dir){ const prev=state.i; state.i=idx; const ae=document.activeElement; const wasInSlide = ae && inner.contains(ae); render(dir || (idx<prev?'prev':'next'));
  if(wasInSlide || !ae || ae===document.body){ const h=$('#slideTitle'); (h||slideEl).focus({preventScroll:true}); } }
const next = () => { if(state.i<visible().length-1) go(state.i+1,'next'); };
const prev = () => { if(state.i>0) go(state.i-1,'prev'); };

function setNotes(on){ state.notes=on; $('#notes').hidden=!on; $('#notesBtn').setAttribute('aria-pressed',on); }
function setQuick(on){ const cur=visible()[state.i]; state.quick=on; $('#quickBtn').setAttribute('aria-pressed',on);
  let v=visible(), idx=v.indexOf(cur); if(idx<0){ const all=CONTENT.slides; let k=all.indexOf(cur); while(k<all.length && v.indexOf(all[k])<0) k++; idx = k<all.length ? v.indexOf(all[k]) : v.length-1; }
  state.i=idx; render('next'); }
function setCalm(on){ root.classList.toggle('calm',on); root.classList.toggle('motion-ok',!on); $('#calmBtn').setAttribute('aria-pressed',on); }

/* Tooltip */
const tip=$('#tip'); let tipFor=null;
function showTip(btn){ const g=CONTENT.glossary[btn.dataset.term]; if(!g) return; tip.innerHTML='<b>'+esc(g[0])+'</b><br>'+esc(g[1]); tip.hidden=false;
  const r=btn.getBoundingClientRect(), tw=tip.offsetWidth, th=tip.offsetHeight; let x=Math.min(Math.max(8,r.left+r.width/2-tw/2), innerWidth-tw-8), y=r.bottom+8; if(y+th>innerHeight-8) y=Math.max(8,r.top-th-8);
  tip.style.left=x+'px'; tip.style.top=y+'px'; if(tipFor&&tipFor!==btn) tipFor.removeAttribute('aria-describedby'); btn.setAttribute('aria-describedby','tip'); tipFor=btn; }
function hideTip(){ tip.hidden=true; if(tipFor) tipFor.removeAttribute('aria-describedby'); tipFor=null; }
document.addEventListener('mouseover',e=>{ const t=e.target.closest&&e.target.closest('.term'); if(t) showTip(t); });
document.addEventListener('mouseout',e=>{ const t=e.target.closest&&e.target.closest('.term'); if(t && document.activeElement!==t) hideTip(); });
document.addEventListener('focusin',e=>{ const t=e.target.closest&&e.target.closest('.term'); if(t) showTip(t); else if(tipFor) hideTip(); });
document.addEventListener('click',e=>{ const t=e.target.closest('.term'); if(t){ e.preventDefault(); if(tipFor===t && !tip.hidden) hideTip(); else showTip(t); }
  const g=e.target.closest('[data-go="next"]'); if(g) next(); const q=e.target.closest('[data-action="quick"]'); if(q) setQuick(true); });
slideEl.addEventListener('scroll',()=>{ if(tipFor) hideTip(); });

/* Keyboard */
document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey) return;
  const t=e.target, tag=t.tagName;
  if(e.key==='Escape'){ hideTip(); if(state.notes) setNotes(false); return; }
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||t.isContentEditable) return;
  const isBtn = tag==='BUTTON'||tag==='A'||tag==='SUMMARY'||t.getAttribute('role')==='button'||t.getAttribute('role')==='switch';
  if(e.key==='n'||e.key==='N'){ setNotes(!state.notes); e.preventDefault(); return; }
  if((e.key==='f'||e.key==='F') && fsOK){ toggleFS(); e.preventDefault(); return; }
  if(e.key==='ArrowRight'||e.key==='PageDown'){ next(); e.preventDefault(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ prev(); e.preventDefault(); }
  else if(e.key===' ' && !isBtn){ if(e.shiftKey) prev(); else next(); e.preventDefault(); }
  else if(e.key==='Home' && !isBtn){ go(0,'prev'); e.preventDefault(); }
  else if(e.key==='End' && !isBtn){ go(visible().length-1,'next'); e.preventDefault(); }
});

/* Controls */
$('#prevBtn').onclick=prev; $('#nextBtn').onclick=next;
$('#notesBtn').onclick=()=>setNotes(!state.notes); $('#notesClose').onclick=()=>setNotes(false);
$('#quickBtn').onclick=()=>setQuick(!state.quick);
$('#calmBtn').onclick=()=>setCalm(!root.classList.contains('calm'));
$('#siteHide').onclick=e=>{ const s=$('#site'); const c=s.classList.toggle('collapsed'); e.currentTarget.textContent=c?'Show site':'Hide site'; e.currentTarget.setAttribute('aria-expanded',!c); };

/* Full screen */
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
const fsOK = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
function toggleFS(){
  try{
    if(fsEl()){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
    else { const el=document.documentElement; const r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el); if(r && r.catch) r.catch(()=>{}); }
  }catch(e){}
}
function syncFS(){ const on=!!fsEl(); const b=$('#fsBtn'); b.setAttribute('aria-pressed',on); b.lastChild.textContent = on ? 'Exit full screen (F)' : 'Full screen (F)'; }
if(fsOK){ $('#fsBtn').onclick=toggleFS; document.addEventListener('fullscreenchange',syncFS); document.addEventListener('webkitfullscreenchange',syncFS); }
else $('#fsBtn').hidden=true;

/* Start */
const mq=matchMedia('(prefers-reduced-motion: reduce)');
if(mq.matches) setCalm(true);
buildTracker();
let startIdx=0; try{ const h=decodeURIComponent((location.hash||'').slice(1)); const k=visible().findIndex(s=>s.id===h); if(k>=0) startIdx=k; }catch(e){}
state.i=startIdx; render('next');
})();
</script>
