# Copy this file to .github/workflows/leading-ai-pages.yml at repository root.
# It is deliberately inactive until the repository owner chooses this Pages site.
# Deploying this artifact replaces the Pages site; it preserves the welcome page
# at the site root and places the new seminar under /leading-ai-innovation/.
name: Deploy education presentations to Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check instructional content
        working-directory: leading-ai-innovation
        run: npm test
      - name: Build seminar
        working-directory: leading-ai-innovation
        run: npm run build
      - name: Preserve welcome and assemble site
        run: |
          mkdir -p _site/leading-ai-innovation
          cp index.html _site/index.html
          cp -R leading-ai-innovation/dist/. _site/leading-ai-innovation/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
