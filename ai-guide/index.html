<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>How Do Computers Talk? A Basic Guide to AI and Large Language Models</title>
<meta name="description" content="A self-running picture-book presentation that teaches K-12 educators how AI and large language models work, and how to use them well. Single file, works offline.">
<!--
  HOW DO COMPUTERS TALK?  A Basic Guide to AI and Large Language Models
  One self-contained file. No external fonts, scripts, images or network calls. Works offline.
  Timing: edit the DWELL object at the top of the script (seconds per page). See README.md.
-->
<style>
:root{
  --cream:#fbf3dc;--ink:#2a2118;
  --red:#e0342b;--orange:#f28c1c;--yellow:#ffd21f;--green:#3fa535;--blue:#2f8fdc;--purple:#8e4bb5;--brown:#8a5a2b;--pink:#f59ab8;--peach:#f6c9a0;
  --red-l:#f6a9a3;--orange-l:#fbc98a;--yellow-l:#ffe97a;--green-l:#b5e3a0;--blue-l:#a9d8f7;--purple-l:#d9bdf0;
  --k:1;
  --font:"Chalkboard SE","Marker Felt","Comic Sans MS","Comic Neue","Segoe Print","Bradley Hand",cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#e9d9ae;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
body.nocursor,body.nocursor *{cursor:none!important}
button{font-family:inherit}
#stage{position:absolute;left:50%;top:calc(50% - 22px);width:1920px;height:1080px;margin:-540px 0 0 -960px;background:var(--cream);overflow:hidden;transform-origin:50% 50%}
#deco,#pages,#wipe{position:absolute;inset:0}
#deco{z-index:1;pointer-events:none}
#pages{z-index:5}
.page{position:absolute;inset:0}
.page>*,.phase>*,#p15>*,.jp>*{position:absolute}
.jp{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity calc(.5s*var(--k))}
.jp.on{opacity:1;pointer-events:auto}
.jp .row{cursor:default;height:80px}
.jp .row .fill{width:var(--w)}
.jp:not(.on) .row .fill{width:0}
.jp .row.pick .w{font-weight:700}
.jp .row.pick .fill{border-color:var(--green);border-width:8px}
.tok.dim{opacity:.55}
.btn.on::before{border-color:var(--green);border-width:10px}
#ctx4{margin-top:4px}
#grain{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:.5}
svg text{font-family:var(--font)}

/* ---------- reveal helpers ---------- */
.pop{opacity:0;transform:scale(.65) rotate(-3deg);transform-origin:50% 60%;transition:opacity calc(.35s*var(--k)),transform calc(.55s*var(--k)) cubic-bezier(.3,1.5,.5,1)}
.pop.in{opacity:1;transform:none}
svg .pop{transform-box:fill-box;transform-origin:50% 50%}
.pop:not(.in){pointer-events:none}
.hid{opacity:0}
.hidden{visibility:hidden}

/* ---------- headings, captions ---------- */
.ttl{position:absolute;left:80px;top:56px;font-size:70px;font-weight:700;line-height:1.05;white-space:nowrap;transform-origin:0 50%;z-index:2}
.ttl>span{position:relative;display:inline-block;filter:url(#crayonT);color:var(--c);-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;text-shadow:5px 6px 0 rgba(42,33,24,.28)}
.ttl .ul{position:absolute;left:0;bottom:-14px;width:100%;height:22px;overflow:visible}
.ttl .ul path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset calc(1.1s*var(--k)) ease-out .3s}
.ttl.in .ul path{stroke-dashoffset:0}
.cap{position:absolute;font-size:42px;line-height:1.2}
.big{font-size:62px}

/* ---------- hand-drawn boxes, bubbles, buttons ---------- */
.box{position:absolute;isolation:isolate;padding:20px 28px;font-size:40px;line-height:1.18;--bd:var(--ink)}
.box::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--bg,#fff);border:6px solid var(--bd);border-radius:46px 16px 40px 14px/16px 40px 14px 46px;filter:url(#crayon)}
.bub{text-align:center;font-size:42px;transform-origin:50% 100%}
.bub::after{content:"";position:absolute;width:38px;height:38px;background:var(--bg,#fff);border:6px solid var(--bd);transform:rotate(45deg);z-index:-1;filter:url(#crayon)}
.t-down::after{bottom:-21px;left:var(--tx);border-top:0;border-left:0}
.t-up::after{top:-21px;left:var(--tx);border-bottom:0;border-right:0}
.t-right::after{right:-21px;top:var(--ty);border-bottom:0;border-left:0}
.t-left::after{left:-21px;top:var(--ty);border-top:0;border-right:0}
.thk::before{border-radius:50%/46%}
.thk::after{display:none}
.thk{padding:26px 70px}
.thk .d1,.thk .d2{position:absolute;border-radius:50%;background:var(--bg,#fff);border:5px solid var(--bd)}
.thk .d1{left:var(--tx);bottom:-46px;width:34px;height:34px}
.thk .d2{left:calc(var(--tx) + 36px);bottom:-76px;width:20px;height:20px}
.bash{--bd:#5b2f7a}
.btn{position:absolute;font-size:42px;font-weight:700;color:var(--ink);padding:14px 30px;border:0;background:none;cursor:pointer;isolation:isolate;text-align:center;line-height:1.1}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--bg);border:6px solid var(--ink);border-radius:30px 12px 26px 12px/12px 26px 12px 30px;filter:url(#crayon)}
.btn.big{font-size:62px;padding:18px 30px}
.btn:hover::before{border-color:var(--blue)}
.btn.pop.in:active{transform:scale(.95)}
.chip{position:relative;display:inline-block;isolation:isolate;margin-right:20px;padding:8px 26px;font-size:46px}
.chip::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--bg);border:5px solid var(--ink);border-radius:30px 10px 26px 10px/10px 26px 10px 30px;filter:url(#crayonB)}
.chip small{font-size:30px}
.caret,.blank{display:inline-block;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}

/* ---------- characters ---------- */
.ch{position:absolute}
.ch svg{display:block;width:100%;height:auto;overflow:visible}
.chi{transform-origin:50% 100%}
.flip svg{transform:scaleX(-1)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(8px,-24px) rotate(2deg)}}
.floaty{animation:floaty 3.4s ease-in-out infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(0)}93%,97%{transform:scaleY(1)}}
.lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 4.4s infinite}
@keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(28deg)}}
.wave-on .arm{animation:wave .7s steps(5,end) infinite alternate}
@keyframes segw{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.seg{animation:segw 1.6s steps(3,end) infinite}
.hat{opacity:0;transition:opacity .4s}
.hat-on .hat{opacity:1}

/* ---------- scenery ---------- */
.sun{position:absolute;left:1690px;top:-80px;width:250px;height:250px;animation:sway 6s ease-in-out infinite;transform-origin:50% 20%}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.sun svg{width:100%;height:100%;overflow:visible}
.rays{transform-origin:130px 130px;animation:spin 24s steps(40) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{position:absolute;left:0;animation:drift linear infinite;opacity:.95}
.cloud svg{width:100%;display:block}
@keyframes drift{from{transform:translateX(-500px)}to{transform:translateX(2100px)}}
.spark{position:absolute;width:54px;height:54px;animation:twinkle 1.5s steps(4,end) infinite}
.spark svg{width:100%;height:100%}
@keyframes twinkle{0%{transform:scale(1) rotate(0)}25%{transform:scale(1.25) rotate(14deg)}50%{transform:scale(.8) rotate(-10deg)}75%{transform:scale(1.15) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.grass{position:absolute;left:0;bottom:0;width:1920px;height:70px}

/* ---------- chrome: trail, page number, ghost cursor, wipe ---------- */
#trail{position:absolute;left:370px;bottom:0;width:1180px;height:68px;z-index:30;overflow:visible}
.dot{cursor:pointer}
.dot.cur circle{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.12)}}
#pageno{position:absolute;right:26px;bottom:8px;width:116px;height:100px;z-index:30;display:grid;place-items:center;font-size:54px;font-weight:700}
#pageno svg{position:absolute;inset:0;width:100%;height:100%}
#pageno b{position:relative}
#status{position:absolute;left:30px;bottom:84px;z-index:30;font-size:34px;font-weight:700;background:var(--yellow);border:5px solid var(--ink);padding:2px 20px;border-radius:16px 6px 14px 6px;display:none}
#status.show{display:block}
#ghost{position:absolute;left:0;top:0;width:76px;height:76px;margin:-6px 0 0 -6px;z-index:50;pointer-events:none;opacity:0;transition:transform calc(.7s*var(--k)) cubic-bezier(.4,0,.2,1),opacity .3s}
#ghost.on{opacity:1}
#ghost svg{width:100%;height:100%;overflow:visible}
#ghost.tap svg path{animation:tap .45s}
#ghost .ring{opacity:0;transform-box:fill-box;transform-origin:center}
#ghost.tap .ring{animation:ring .6s}
@keyframes tap{40%{transform:translate(5px,5px) scale(.85)}}
@keyframes ring{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(2.4)}}
#wipe{z-index:60;pointer-events:none;overflow:hidden}
.stripe{position:absolute;left:-60px;width:2040px;height:200px;transform:translateX(-112%) rotate(-1.2deg);filter:url(#crayon)}
#toolbar{position:fixed;left:0;right:0;bottom:0;height:44px;z-index:100;display:flex;gap:8px;justify-content:center;align-items:center;padding:0 12px;background:#fff8e1;border-top:3px solid var(--ink);font-family:var(--font)}
#toolbar button{font-size:16px;font-weight:700;padding:3px 12px;border:3px solid var(--ink);border-radius:12px 6px 10px 6px;background:var(--yellow-l);cursor:pointer;color:var(--ink)}
#toolbar button:hover{background:var(--yellow)}
#spd{align-self:center;font-weight:700;font-size:16px;min-width:3.2em;text-align:center}
body.fs #toolbar{display:none}
body.fs #stage{top:50%}
#toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);z-index:101;font-size:26px;font-weight:700;background:var(--yellow);border:4px solid var(--ink);padding:4px 22px;border-radius:16px 6px 14px 6px;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.show{opacity:1}
#clickhint{position:absolute;right:170px;bottom:86px;z-index:31;display:none;align-items:center;gap:10px;font-size:34px;font-weight:700;background:var(--yellow-l);border:5px solid var(--ink);padding:2px 20px 2px 14px;border-radius:18px 8px 16px 8px;animation:hintbob 1.1s ease-in-out infinite}
#clickhint.show{display:flex}
#clickhint svg{width:34px;height:34px}
@keyframes hintbob{50%{translate:0 -8px}}
body.paused *{animation-play-state:paused!important}
body.calm *,body.calm *::before,body.calm *::after{animation:none!important;transition-duration:.01s!important;transition-delay:0s!important}

/* ---------- page 1 & 17: scribbled titles ---------- */
.p1t{position:absolute;overflow:visible}
.scrib{stroke:var(--ink);stroke-width:10;stroke-linejoin:round;stroke-dasharray:800;stroke-dashoffset:800;fill-opacity:0;paint-order:stroke;transition:stroke-dashoffset calc(2.8s*var(--k)) ease-out calc(var(--d,0s)*var(--k)),fill-opacity calc(1s*var(--k)) ease calc((var(--d,0s) + 2.3s)*var(--k))}
.scrib.in{stroke-dashoffset:0;fill-opacity:1}
.scrawl{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset calc(2s*var(--k)) ease-out calc(4.5s*var(--k))}
.scrawl.in{stroke-dashoffset:0}
.qbox{display:flex;align-items:center;justify-content:center;text-align:center;font-size:62px;line-height:1.15}

/* ---------- page 2 ---------- */
.shape svg{width:100%;height:100%}
.slot{border:6px dashed var(--ink);border-radius:20px;display:grid;place-items:center;font-size:84px;font-weight:700}
#sh5s{position:absolute;inset:-6px}
.venn{position:absolute;overflow:visible}

/* ---------- page 3 ---------- */
#msg3{display:flex;align-items:center;gap:4px}
.card{text-align:center}
.card .w{display:block;font-size:64px}
.card p{font-size:38px;margin-top:8px;line-height:1.15}
.card svg{display:block;margin:6px auto}

/* ---------- page 4 ---------- */
.sign{text-align:center;padding:8px}
.sign small{display:block;font-size:30px}
.sign b{font-size:58px}
.board{padding:28px 36px}
.board h2{font-size:48px;margin-bottom:14px}
#notes{list-style:none}
.note{position:relative;isolation:isolate;margin:12px 0;padding:14px 24px;font-size:38px}
.note::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--bg);border:5px solid var(--ink);border-radius:26px 8px 22px 8px/8px 22px 8px 26px;filter:url(#crayonB)}
#fly{position:absolute;inset:0;pointer-events:none;z-index:4}
.flybook{position:absolute;left:0;top:0;width:90px}

/* ---------- page 5 ---------- */
#tbox{padding:12px 30px}
.tin{width:100%;height:84px;border:0;background:none;font:inherit;font-size:58px;color:var(--ink);outline:none;user-select:text;-webkit-user-select:text}
.tin::placeholder{color:#8a7a62}
.tok{display:inline-block;position:relative;isolation:isolate;margin:10px;padding:6px 22px 4px;font-size:54px;text-align:center;line-height:1.1}
.tok::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--bg);border:5px solid var(--ink);border-radius:20px 8px 18px 8px/8px 18px 8px 20px;filter:url(#crayonB)}
.tok small{display:block;font-size:26px;opacity:.8}
.sp{font-style:normal;opacity:.55;margin-right:4px}
.newtok{animation:tokin .35s}
@keyframes tokin{from{transform:scale(.4) rotate(-6deg);opacity:0}}
.c0{--bg:var(--red-l)}.c1{--bg:var(--orange-l)}.c2{--bg:var(--yellow-l)}.c3{--bg:var(--green-l)}.c4{--bg:var(--blue-l)}.c5{--bg:var(--purple-l)}.c6{--bg:var(--peach)}
.note5{position:absolute;font-size:32px;line-height:1.2;color:#4a3a28}

/* ---------- page 6 ---------- */
.sent{font-size:66px;line-height:1.15}
.blank{width:150px;border-bottom:8px solid var(--ink)}
#bars{position:absolute}
.row{display:grid;grid-template-columns:240px 1fr 110px;gap:14px;align-items:center;width:100%;height:72px;margin-bottom:9px;border:0;background:none;font-size:46px;color:var(--ink);cursor:pointer;text-align:left;padding:0}
.row:hover .w{text-decoration:underline}
.row .bw{display:block;height:54px}
.row .fill{display:block;height:100%;width:0;background:var(--c);border:5px solid var(--ink);border-radius:8px 18px 18px 8px;filter:url(#crayonB);transition:width calc(.8s*var(--k)) ease}
.row .pc{text-align:right}

/* ---------- page 7 ---------- */
.lab7{position:absolute;font-size:56px;font-weight:700;text-align:center}
.slider{-webkit-appearance:none;appearance:none;position:absolute;background:transparent;outline:none;cursor:pointer}
.slider::-webkit-slider-runnable-track{height:36px;background:var(--orange);border:5px solid var(--ink);border-radius:20px 8px 18px 8px}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:64px;height:64px;margin-top:-17px;border-radius:50%;background:var(--red);border:6px solid var(--ink)}
.slider::-moz-range-track{height:26px;background:var(--orange);border:5px solid var(--ink);border-radius:20px 8px 18px 8px}
.slider::-moz-range-thumb{width:52px;height:52px;border-radius:50%;background:var(--red);border:6px solid var(--ink)}
.sticky{padding:22px 28px;font-size:44px;line-height:1.15}
.sticky small{display:block;font-size:30px;font-weight:700;margin-bottom:6px;color:#5a4a36}
.sticky.pop.in{transform:rotate(var(--rot,0deg))}
.bars7{display:flex;gap:26px;align-items:flex-end}
.vb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:100px}
.vb i{display:block;width:80px;height:20px;background:var(--c);border:5px solid var(--ink);border-radius:10px 10px 4px 4px;transition:height calc(.6s*var(--k));filter:url(#crayonB)}
.vb span{font-size:30px;margin-top:6px}

/* ---------- page 8 ---------- */
.pack{position:absolute}
#stack{position:absolute}
.mc{position:absolute;left:0;top:0;width:340px;height:78px;padding:6px 14px;font-size:34px;line-height:1.1;display:flex;align-items:center;border:5px solid var(--ink);border-radius:14px 6px 12px 6px;transition:transform calc(.5s*var(--k)),opacity .3s}
.tips{list-style:none;position:absolute}
.tips li{display:flex;gap:18px;align-items:flex-start;font-size:44px;margin-bottom:26px;line-height:1.15}
.tips i{flex:none;margin-top:2px}

/* ---------- page 9 ---------- */
.box h3{font-size:38px;margin-bottom:8px}
#L9t,#R9t{font-size:48px;line-height:1.2}
#L9,#R9{display:flex;flex-direction:column;justify-content:center}
#dots9{position:absolute;display:flex;gap:14px;justify-content:center}
#dots9 i{width:24px;height:24px;border-radius:50%;border:4px solid var(--ink);background:#fff}
#dots9 i.on{background:var(--orange)}

/* ---------- page 10 ---------- */
.phase{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity calc(.6s*var(--k))}
.phase.in{opacity:1;pointer-events:auto}
.cover{padding:24px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:16px;font-size:44px}
.cover span{font-size:30px}
.cite{font-size:32px;padding:22px 28px;line-height:1.25}
.stamp{position:absolute;font-size:64px;font-weight:700;color:var(--red);border:8px solid var(--red);padding:0 20px;border-radius:14px;filter:url(#crayon);letter-spacing:4px;line-height:1.2;background:rgba(251,243,220,.6)}
.stamp.pop{transform:scale(2.2) rotate(-12deg)}
.stamp.pop.in{transform:rotate(-12deg)}
#stm{display:flex;align-items:center;justify-content:center;text-align:center}
#stmt{display:block;font-size:56px;line-height:1.2}
#stmt .sm{font-size:40px}
.fb{font-size:42px;display:flex;align-items:center}

/* ---------- page 11 ---------- */
.lib11{position:absolute;font-size:48px;font-weight:700}
.lib11 small{font-size:30px;font-weight:400}
#shelves{position:absolute}
.shelf{position:absolute;width:410px;height:255px;border:0;background:none;color:var(--ink);cursor:pointer;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:34px;line-height:1.1}
.shelf::before{content:"";position:absolute;inset:0;z-index:-1;background:#fff;border:7px solid var(--c);border-radius:40px 14px 36px 12px/14px 36px 12px 40px;filter:url(#crayon)}
.shelf.pop.in:not(.on){opacity:.45}
.shelf b{font-size:36px}
.tag{font-style:normal;font-size:26px;font-weight:700;padding:0 12px;border-radius:10px;background:#fff;border:3px solid var(--c)}
.sticky2{position:absolute;font-size:40px;padding:14px 24px;background:var(--yellow-l);border:5px solid var(--ink);border-radius:14px 6px 12px 6px;line-height:1.15}
.sticky2.pop{transform:scale(.7) rotate(-3deg)}
.sticky2.pop.in{transform:rotate(-1deg)}

/* ---------- page 12 ---------- */
.tile{position:absolute;border:0;background:none;color:var(--ink);cursor:pointer;isolation:isolate;text-align:left;padding:12px 26px;display:flex;flex-direction:column;justify-content:center}
.tile::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--bg);border:6px solid var(--ink);border-radius:36px 12px 32px 12px/12px 32px 12px 36px;filter:url(#crayon)}
.tile b{font-size:44px}
.tile small{font-size:30px}
.tile.on::before{border-color:var(--green);border-width:10px}
.tile.on::after{content:"ADDED";position:absolute;right:20px;top:14px;font-size:26px;font-weight:700;color:#1f5e18}
.paper{padding:26px 34px}
.plabel{display:inline-block;font-size:34px;font-weight:700;padding:2px 16px;border:5px solid var(--ink);border-radius:10px;margin-bottom:18px;transform:rotate(-2deg)}
.plabel.w{background:var(--red-l)}.plabel.m{background:var(--yellow-l)}.plabel.s{background:var(--green-l)}
.ptxt{font-size:40px;line-height:1.4}
#weak{color:#6b5a45}
.pl{display:none;background:var(--hl);padding:0 6px;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.pl.on{display:inline;animation:plin .6s}
@keyframes plin{from{opacity:0}}
.res{padding:18px;text-align:center}
#stars{height:76px;display:flex;justify-content:center;gap:6px}
.mini{margin:8px auto;width:380px;height:420px;background:#fff;border:5px solid var(--ink);border-radius:8px;padding:16px;text-align:left;position:relative;font-size:28px}
.mini .gen{font-size:36px;color:#8a7a62}
.mini [data-r]{display:none}
.mini .mt{font-size:36px;font-weight:700;color:#134a75}
.mini .mb{font-size:24px;background:var(--blue-l);padding:2px 8px;margin:4px 0}
.mini .ml i{display:block;height:10px;background:#d9ccb0;margin:12px 0;border-radius:5px}
.mini .mtabs span{display:inline-block;font-size:22px;padding:2px 10px;margin:4px 6px 4px 0;border:3px solid var(--ink);border-radius:8px;background:var(--yellow-l)}
.mini .mq{margin:8px 0 0 28px}
.mini .mq li{height:24px;border-bottom:3px solid #b9aa8a}

<script>
'use strict';
/* =====================================================================
   HOW DO COMPUTERS TALK? A Basic Guide to AI and Large Language Models
   Sections:  1 CONFIG | 2 UTILS | 3 SCHEDULER | 4 CHARACTERS | 5 COMPONENTS
              6 GHOST CURSOR | 7 PAGES (registry) | 8 DECK CONTROLLER
   ===================================================================== */

/* 1 · CONFIG ------------------------------------------------------------
   DWELL = seconds each page stays up on autoplay (before the next page turn).
   These are "virtual" seconds: the [ and ] speed keys scale them. Total ≈ 20 min. */
const DWELL = {
   1: 40,  //  Title
   2: 60,  //  What is AI?
   3: 55,  //  What is an LLM?
   4: 70,  //  Training
   5: 70,  //  Tokens
   6: 80,  //  Next-word prediction
   7: 75,  //  Temperature
   8: 75,  //  Context window
   9: 70,  //  A prompt's journey (end to end)
  10: 65,  //  It does not "know"
  11: 90,  //  Hallucinations
  12: 75,  //  Bias and training data
  13: 90,  //  Prompt recipe
  14: 75,  //  Iterate
  15: 60,  //  Verify
  16: 90,  //  Traffic light
  17: 60,  //  Key takeaways
  18: 45   //  The End
};
const CONFIG = {
  idleWaitMs: 4000,        // wait this long after the last real input before auto-advancing
  toolbarHideMs: 3000,     // toolbar auto-hide
  cursorHideMs: 2500,      // mouse cursor auto-hide
  speeds: [0.5, 0.75, 1, 1.25, 1.5, 2, 3],
  startTimeOffsetMs: 850   // lets the page-wipe finish before a page's timeline starts
};

/* 2 · UTILS ------------------------------------------------------------ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const INK = '#2a2118';
const st = { click: true, cur: -1, speed: 1, paused: false, auto: false, calm: false, lastInput: -1e9, busy: false, pending: null, scale: 1, dragging: false };
const owned = new Set();          // demo keys the audience has taken over
const live = new Set();           // running Web Animations (so we can pause / speed them)
let TL = null;                    // current page's timeline

/* Web-Animations helper: honors speed + calm mode, tracks animations for pause */
function anim(el, kf, opt = {}) {
  if (!el) return null;
  const o = Object.assign({ fill: 'both', easing: 'ease-in-out', duration: 500 }, opt);
  if (st.calm) o.duration = 1;
  const a = el.animate(kf, o);
  a.playbackRate = st.speed;
  live.add(a);
  a.onfinish = a.oncancel = () => live.delete(a);
  return a;
}
/* hop-hop walk: translateX with little bounces */
function walkAnim(el, x0, x1, dur, steps = 12) {
  const kf = [];
  for (let i = 0; i <= steps; i++) {
    const p = i / steps;
    kf.push({ transform: `translate(${x0 + (x1 - x0) * p}px,${i % 2 ? -18 : 0}px)`, opacity: 1, offset: p });
  }
  return anim(el, kf, { duration: dur, easing: 'linear' });
}

/* 3 · SCHEDULER (timeline) ---------------------------------------------
   A Timeline owns one page's script. Time only advances while not paused,
   and is multiplied by the speed setting. Events with a `key` are demo
   steps: they are skipped once the audience takes that widget over.      */
class Timeline {
  constructor(root) { this.root = root; this.time = 0; this.ev = []; this.tw = []; this.gates = []; this._b = null; this.held = false; }
  /* click mode: reveals (t.show / t.walk) are "gates". Reveals within 650ms of each other form one beat.
     The clock stops just before each beat and waits for a click. Titles and scribbled titles are automatic. */
  gate(ms) { if (ms >= 1000) this.gates.push(ms); return this; }
  nextGate() {
    if (!this._b) {
      this._b = [];
      this.gates.slice().sort((a, b) => a - b).forEach(x => { const l = this._b[this._b.length - 1]; if (l && x - l.last <= 650) l.last = x; else this._b.push({ ms: x, last: x, released: false }); });
    }
    return this._b.find(b => !b.released) || null;
  }
  release() {
    const g = this.nextGate(); if (!g) return false;
    g.released = true; this.held = false; if (this.time < g.ms) this.time = g.ms; this.tick(0); return true;
  }
  at(ms, fn, key) {
    let i = this.ev.length;
    while (i > 0 && this.ev[i - 1].ms > ms) i--;
    this.ev.splice(i, 0, { ms, fn, key });
    return this;
  }
  tween(ms, dur, fn, key) { this.tw.push({ ms, dur, fn, key, done: false }); return this; }
  tick(dt) {
    let t = this.time + dt; const g = st.click ? this.nextGate() : null;
    if (g && t >= g.ms) { t = g.ms - 1; this.held = true; } else this.held = false;
    this.time = t;
    while (this.ev.length && this.ev[0].ms <= this.time) {
      const e = this.ev.shift();
      if (e.key && owned.has(e.key)) continue;
      try { e.fn(); } catch (err) { console.error(err); }
    }
    for (const w of this.tw) {
      if (w.done || this.time < w.ms) continue;
      if (w.key && owned.has(w.key)) { w.done = true; continue; }
      const p = clamp((this.time - w.ms) / w.dur, 0, 1);
      try { w.fn(p); } catch (err) { console.error(err); }
      if (p >= 1) w.done = true;
    }
    this.tw = this.tw.filter(w => !w.done);
  }
  els(s) { return typeof s === 'string' ? $$(s, this.root) : (s ? [s] : []); }
  one(s) { return typeof s === 'string' ? $(s, this.root) : s; }
  show(ms, s, key) {
    if (!(typeof s === 'string' && /ttl|scrib|scrawl/.test(s))) this.gate(ms);
    return this.at(ms, () => this.els(s).forEach(e => e.classList.add('in')), key);
  }
  hide(ms, s, key) { return this.at(ms, () => this.els(s).forEach(e => e.classList.remove('in')), key); }
  cls(ms, s, c, on = true, key) { return this.at(ms, () => this.els(s).forEach(e => e.classList.toggle(c, on)), key); }
  anim(ms, s, kf, opt, key) { return this.at(ms, () => this.els(s).forEach(e => anim(e, kf, opt)), key); }
  walk(ms, s, x0, x1, dur) { this.gate(ms); return this.at(ms, () => this.els(s).forEach(e => walkAnim(e, x0, x1, dur))); }
  type(ms, s, text, dur, key) {
    return this.tween(ms, dur, p => { const e = this.one(s); if (e) e.textContent = text.slice(0, Math.round(p * text.length)); }, key);
  }
  /* ghost cursor glides to the target, taps, then really clicks it */
  click(ms, target, key) {
    this.at(ms, () => ghost.move(target), key);
    this.at(ms + 800, () => { ghost.tap(); const e = this.one(target); if (e && e.click) e.click(); }, key);
    return this;
  }
}

/* 4 · CHARACTERS (inline SVG; crayon filter on static art, blink via .lid) */
const lids = (fill, a, b, d = 0.3) =>
  `<rect class="lid" x="${a[0]}" y="${a[1]}" width="${a[2]}" height="${a[2]}" fill="${fill}" style="animation-delay:${d}s"/>` +
  `<rect class="lid" x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[2]}" fill="${fill}" style="animation-delay:${d}s"/>`;

/* split text into word spans so bubbles and captions can pop in word by word */
function wordify(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = []; let j = 0;
  while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => {
    if (!n.nodeValue.trim() || (n.parentNode.classList && n.parentNode.classList.contains('w'))) return;
    const f = document.createDocumentFragment();
    n.nodeValue.split(/(\s+)/).forEach(p => {
      if (!p) return;
      if (/^\s+$/.test(p)) f.appendChild(document.createTextNode(p));
      else { const s = document.createElement('span'); s.className = 'w'; s.style.setProperty('--j', j++); s.textContent = p; f.appendChild(s); }
    });
    n.parentNode.replaceChild(f, n);
  });
}
const setText = (el, html) => { el.innerHTML = html; wordify(el); el.classList.remove('in'); void el.offsetWidth; el.classList.add('in'); };

   A crayon-drawn pointer that "uses" the interactive bits when nobody is touching them. */
const ghost = {
  el: null,
  init() { this.el = $('#ghost'); },
  pos(el) {
    const r = el.getBoundingClientRect(), s = $('#stage').getBoundingClientRect();
    return [(r.left + r.width / 2 - s.left) / st.scale, (r.top + r.height / 2 - s.top) / st.scale];
  },
  move(target, off = [20, 14]) {
    const el = typeof target === 'string' ? $(target, TL.root) : target;
    if (!el || !this.el) return;
    const [x, y] = this.pos(el);
    const g = this.el;
    if (!g.classList.contains('on')) {
      g.style.transition = 'none';
      g.style.transform = `translate(${x + 300}px,${y + 260}px)`;
      void g.offsetWidth; g.style.transition = '';
    }
    g.classList.add('on');
    g.style.transform = `translate(${x + off[0]}px,${y + off[1]}px)`;
  },
  tap() { const g = this.el; g.classList.remove('tap'); void g.offsetWidth; g.classList.add('tap'); },
  hide() { this.el && this.el.classList.remove('on'); }
};

/* ---------- 5 · TOKENS ---------- */
const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h; };
function splitWord(w) {
  const m = w.match(/(ingly|ing|tion|ness|able|ed|ly|er|s)$/i), parts = []; let base = w, tail = '';
  if (m && w.length - m[0].length >= 3) { base = w.slice(0, -m[0].length); tail = m[0]; }
  if (base.length > 6) { const mid = Math.ceil(base.length / 2); parts.push(base.slice(0, mid), base.slice(mid)); } else parts.push(base);
  if (tail) parts.push(tail);
  return parts;
}
function tokenize(s) {
  const out = [], re = /\s*[A-Za-z]+|\s*\d+|\s*[^\sA-Za-z\d]/g; let m;
  while ((m = re.exec(s))) {
    const w = m[0], lead = /^\s/.test(w), core = w.trim();
    if (/^[A-Za-z]+$/.test(core) && core.length > 6) splitWord(core).forEach((p, i) => out.push((i === 0 && lead ? ' ' : '') + p));
    else out.push(w);
  }
  return out;
}

  script(t) {
    const root = t.root; let sel = null, placed = 0, justDragged = false, drag = null;
    const cards = $$('.sc', root), bins = $$('.bin', root), rem = $('#rem15', root);
    const upd = () => { rem.innerHTML = placed >= 8 ? '<b>All sorted!</b> Risk decides the color.' : `Cards left: <b>${8 - placed}</b>`; rem.classList.add('in'); };
    const select = c => { cards.forEach(x => x.classList.remove('sel')); sel = c; if (c) c.classList.add('sel'); };

        if (!drag || drag.c !== c) return;
        const moved = drag.moved; drag = null; st.dragging = false;

          c.classList.remove('drag');
          if (bin) place(c, bin); else { c.style.transform = ''; select(null); }

/* progress trail: wobbly crayon line with one dot per page */
function drawTrail() {
  const gap = 1120 / (N - 1); let d = 'M10 34';
  for (let i = 0; i < N - 1; i++) d += `Q${30 + i * gap + gap / 2} ${i % 2 ? 46 : 20} ${30 + (i + 1) * gap} 34`;
  let dots = '';
  for (let i = 0; i < N; i++) {
    const cur = i === st.cur, vis = i < st.cur;
    dots += `<g class="dot ${cur ? 'cur' : ''}" data-i="${i}" role="button" aria-label="Go to page ${i + 1}"><circle cx="${30 + i * gap}" cy="34" r="${cur ? 19 : 11}" fill="${cur ? '#ffd21f' : vis ? '#b5e3a0' : '#fbf3dc'}" stroke="${cur ? '#e0342b' : INK}" stroke-width="${cur ? 6 : 4}"/></g>`;
  }
  $('#trail').innerHTML = `<g filter="url(#crayon)"><path d="${d}" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round" opacity=".7"/>${dots}</g>`;
}
function buildWipe() {
  $('#wipe').innerHTML = WIPE_COL.map((c, i) => `<div class="stripe" style="top:${i * 160 - 30}px;background:${c}"></div>`).join('');
}
function sweep(dir) {
  const ss = $$('#wipe .stripe');
  const as = ss.map((s, i) => s.animate(dir === 'in' ? [{ transform: 'translateX(-112%) rotate(-1.2deg)' }, { transform: 'translateX(0) rotate(-1.2deg)' }] : [{ transform: 'translateX(0) rotate(-1.2deg)' }, { transform: 'translateX(112%) rotate(-1.2deg)' }],
    { duration: 420 / Math.max(1, st.speed * .6), delay: i * 55 / Math.max(1, st.speed * .6), fill: 'both', easing: 'cubic-bezier(.5,0,.3,1)' }));
  return Promise.all(as.map(a => a.finished.catch(() => 0))).then(() => { if (dir === 'out') as.forEach(a => a.cancel()); });
}

function mount(i, wiped) {
  ghost.hide(); owned.clear();
  live.forEach(a => { try { a.cancel(); } catch (_) { } }); live.clear();
  pagesEl.innerHTML = `<section class="page" id="pg${i + 1}" aria-label="Page ${i + 1}: ${PAGES[i].name}">${PAGES[i].build()}</section>`;
  const root = pagesEl.firstElementChild;
  $$('.bub, .cap.pop', root).forEach(wordify);
  $$('.ttl>span', root).forEach(sp => {
    let i = 0; const tw = document.createTreeWalker(sp, NodeFilter.SHOW_TEXT), ns = [];
    while (tw.nextNode()) ns.push(tw.currentNode);
    ns.forEach(n => { const f = document.createDocumentFragment(); for (const chr of n.nodeValue) { if (chr === ' ') f.appendChild(document.createTextNode(' ')); else { const l = document.createElement('i'); l.className = 'lt'; l.style.setProperty('--i', i++); l.style.fontStyle = 'normal'; l.textContent = chr; f.appendChild(l); } } n.parentNode.replaceChild(f, n); });
  });
  $$('.ttl', root).forEach(h => { const w = h.firstElementChild.offsetWidth; if (w > 1560) h.style.fontSize = (70 * 1560 / w) + 'px'; });
  st.cur = i; TL = new Timeline(root); TL.time = wiped ? -300 : 0;
  try { PAGES[i].script(TL, root); } catch (e) { console.error('Page ' + (i + 1) + ' script failed', e); }
  $('#pageno b').textContent = i + 1;
  drawTrail();
  try { history.replaceState(null, '', '#' + (i + 1)); } catch (_) { }
}
async function transition(i, instant) {
  st.busy = true;
  const wipe = !st.calm && !instant && st.cur >= 0;
  if (wipe) await sweep('in');
  mount(i, wipe);
  if (wipe) await sweep('out');
  st.busy = false;
  if (st.pending != null) { const p = st.pending; st.pending = null; if (p !== st.cur) go(p); }
}
function go(i) {
  i = clamp(i, 0, N - 1);
  if (st.busy) { st.pending = i; return; }
  if (i === st.cur) return;
  transition(i);
}
const restart = () => { if (!st.busy) { st.pending = null; transition(st.cur, true); toast('Page restarted'); } };

/* controls */
function setSpeed(v) {
  st.speed = v; document.documentElement.style.setProperty('--k', String(1 / v));
  live.forEach(a => { a.playbackRate = v; });
  $('#spd').textContent = v + '×'; toast('Speed ' + v + '×');
}
function stepSpeed(d) {
  const L = CONFIG.speeds; let i = L.findIndex(x => x >= st.speed - 1e-6); if (i < 0) i = L.length - 1;
  setSpeed(L[clamp(i + d, 0, L.length - 1)]);
}
function statusUpdate() {
  const s = $('#status');
  s.textContent = st.paused ? 'Paused' : '';
  s.classList.toggle('show', st.paused);
  $('[data-act=pause]').textContent = st.paused ? 'Play' : 'Pause';
  $('[data-act=auto]').textContent = 'Auto: ' + (st.auto ? 'on' : 'off');
  $('[data-act=click]').textContent = 'Click: ' + (st.click ? 'on' : 'off');
}
function setPaused(p) {
  st.paused = p; document.body.classList.toggle('paused', p);
  live.forEach(a => { try { p ? a.pause() : a.play(); } catch (_) { } });
  statusUpdate(); toast(p ? 'Paused' : 'Playing');
}
function setAuto(a) { st.auto = a; if (a) st.click = false; statusUpdate(); toast('Autoplay ' + (a ? 'on' : 'off')); }
function setClick(c) { st.click = c; if (c) st.auto = false; statusUpdate(); toast(c ? 'Click to reveal' : 'Click mode off'); }
/* one click = reveal the next beat; when everything is revealed, go to the next page */
function advance() { if (st.busy) return; if (TL && TL.release()) return; go(st.cur + 1); }
const NOCLICK = 'button,input,textarea,.sc,.bin,.shelf,.row,.tile,.chk,.btn,#L9,#R9,#trail,.dot';
function setCalm(c) { st.calm = c; document.body.classList.toggle('calm', c); $('[data-act=calm]').textContent = 'Calm: ' + (c ? 'on' : 'off'); toast(c ? 'Reduced motion on' : 'Reduced motion off'); }
/* Fullscreen works from a key press or click. Some embedded frames refuse it, so fail with a clear message. */
function fullscreen() {
  const d = document, el = d.documentElement, on = d.fullscreenElement || d.webkitFullscreenElement;
  const blocked = () => toast('Fullscreen is blocked in this view. Open the deck in its own tab.');
  try {
    if (on) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) { blocked(); return; }
    const r = req.call(el); if (r && r.catch) r.catch(blocked);
  } catch (_) { blocked(); }
}
function onFsChange() { document.body.classList.toggle('fs', !!(document.fullscreenElement || document.webkitFullscreenElement)); fit(); }
const ACTS = { prev: () => go(st.cur - 1), next: () => go(st.cur + 1), pause: () => setPaused(!st.paused), auto: () => setAuto(!st.auto), click: () => setClick(!st.click), slower: () => stepSpeed(-1), faster: () => stepSpeed(1), full: fullscreen, restart, calm: () => setCalm(!st.calm) };

/* UI auto-hide: toolbar after 3s, mouse cursor after a short idle */
let uiT, curT;
function activity(e) {
  document.body.classList.remove('nocursor');
  clearTimeout(curT); curT = setTimeout(() => document.body.classList.add('nocursor'), CONFIG.cursorHideMs);
}

function bindInput() {
  addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', onFsChange); document.addEventListener('webkitfullscreenchange', onFsChange);
  addEventListener('pointerdown', () => { try { window.focus(); } catch (_) { } }, true);
  ['pointermove', 'pointerdown', 'keydown'].forEach(ev => addEventListener(ev, activity, { passive: true }));
  // real (trusted) input takes the matching demo over and pauses auto-advance
  const mark = e => {
    if (!e.isTrusted) return;
    st.lastInput = performance.now();
    const d = e.target && e.target.closest && e.target.closest('[data-demo]');
    if (d) { owned.add(d.dataset.demo); ghost.hide(); }
  };
  stage.addEventListener('click', e => { if (!e.isTrusted || !st.click || st.dragging) return; const m = e.target.closest && e.target.closest(NOCLICK); if (m && !m.closest('.pop:not(.in)')) return; advance(); });
  stage.addEventListener('pointerdown', mark, true);
  stage.addEventListener('input', mark, true);
  stage.addEventListener('pointermove', e => { if (e.buttons) mark(e); }, true);
  stage.addEventListener('pointerup', () => { const a = document.activeElement; if (a && a.type === 'range') a.blur(); }, true);
  $('#trail').addEventListener('click', e => { const g = e.target.closest('.dot'); if (g) go(+g.dataset.i); });
  $('#toolbar').addEventListener('click', e => { const b = e.target.closest('button'); if (b && ACTS[b.dataset.act]) { ACTS[b.dataset.act](); b.blur(); } });
  addEventListener('keydown', e => {
    const tg = e.target;
    if (tg && tg.tagName === 'INPUT' && tg.type === 'text') { if (e.key === 'Escape') tg.blur(); st.lastInput = performance.now(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key; let used = true;
    if (k === ' ') ACTS.pause();
    else if (k === 'ArrowRight') { st.click ? advance() : ACTS.next(); }
    else if (k === 'PageDown') ACTS.next();
    else if (k === 'c' || k === 'C') ACTS.click();
    else if (k === 'ArrowLeft' || k === 'PageUp') ACTS.prev();
    else if (k === 'a' || k === 'A') ACTS.auto();
    else if (k === 'f' || k === 'F') ACTS.full();
    else if (k === 'r' || k === 'R') ACTS.restart();
    else if (k === '[') ACTS.slower();
    else if (k === ']') ACTS.faster();
    else if (k === 'm' || k === 'M') ACTS.calm();
    else if (k === 'Home') go(0);
    else if (k === 'End') go(N - 1);
    else if (k >= '1' && k <= '9') go(+k - 1);
    else if (k === '0') go(9);
    else used = false;
    if (used) e.preventDefault();
  });
}

/* main loop: virtual clock for the timeline, then the autoplay check */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(now - lastT, 100); lastT = now;
  if (!st.paused && TL) {
    TL.tick(dt * st.speed);
    const dw = (DWELL[st.cur + 1] || 60) * 1000;
    const hint = $('#clickhint'), has = st.click && !st.busy;
    hint.classList.toggle('show', has);
    if (has) { const tx = TL.nextGate() ? 'Click' : 'Click for next page'; if ($('#clicktxt').textContent !== tx) $('#clicktxt').textContent = tx; }
    if (st.auto && !st.click && !st.busy && !st.dragging && st.cur < N - 1 && TL.time >= dw && now - st.lastInput > CONFIG.idleWaitMs) go(st.cur + 1);
  }
  requestAnimationFrame(frame);
}

function boot() {
  ghost.init(); fit(); buildDeco(); buildWipe(); bindInput();
  st.calm = matchMedia('(prefers-reduced-motion: reduce)').matches; document.body.classList.toggle('calm', st.calm);
  $('[data-act=calm]').textContent = 'Calm: ' + (st.calm ? 'on' : 'off');
  statusUpdate(); activity();
  const h = parseInt((location.hash || '').slice(1), 10);
  transition(clamp((isNaN(h) ? 1 : h) - 1, 0, N - 1), true);
  requestAnimationFrame(frame);
}
window.__deck = { go, st, advance, setClick, DWELL, PAGES, setSpeed: v => { st.speed = v; document.documentElement.style.setProperty('--k', String(1 / v)); live.forEach(a => { a.playbackRate = v; }); }, setPaused, setAuto, setCalm, get tl() { return TL; }, owned };
boot();

</script>
</body>
