<style>
/* ===== Wilmington University tokens. Change --wu-green and the whole page follows. ===== */
:root{
  --wu-green:#00693C; --wu-deep:#00331F; --wu-ink:#001E12; --wu-tint:#7BD9A5; --wu-soft:#e4f1ea;
  --paper:#fffdf5; --paper-edge:#f1ecd9; --rule:#cfe3d7; --text:#14201a; --muted:#445249;
  --mk:#ffe66d; --hand:"Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS","Marker Felt",cursive;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --good:#17623a; --good-soft:#dff3e6; --err:#a31d1d; --err-soft:#fbe3e3; --chk:#744400; --chk-soft:#fff0c9;
  --accent:#9c4511; --focus:#0b57d0; --u:1;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 90% at 50% 0%,#0a5a37 0%,var(--wu-deep) 60%,var(--wu-ink) 100%);color:var(--text);font-family:var(--sans);overflow:hidden}
h1,h2,h3,p{margin:0}
p+p{margin-top:.5em}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:8px;top:-80px;background:#fff;color:var(--wu-green);padding:.7rem 1rem;border-radius:8px;z-index:90;font-weight:700}
.skip:focus{top:8px}
svg.i{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em}
button,a.lnk{font:inherit;min-height:44px;min-width:44px;cursor:pointer}

/* ===== the desk and the book ===== */
.desk{position:fixed;inset:0 0 56px 0;padding:clamp(6px,1.6vh,16px) clamp(6px,1.6vw,22px) 0;display:flex}
.book{position:relative;flex:1;min-width:0;background:var(--paper);border-radius:6px 14px 14px 6px;box-shadow:0 18px 50px rgba(0,0,0,.55),inset -10px 0 18px -12px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.book::before{content:"";position:absolute;inset:0 auto 0 0;width:calc(2.6em * var(--u));background:linear-gradient(90deg,#d9d3bd,var(--paper-edge));z-index:1}
.rings{position:absolute;left:.35em;top:0;bottom:0;width:1.7em;z-index:3;background:radial-gradient(circle at 50% 50%,#0b1a13 0 .38em,#6a7a70 .4em .52em,transparent .56em) 0 0/100% 2.1em repeat-y;pointer-events:none}
.bar{position:relative;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:.6em;padding:.45em 1.1em .45em calc(3.6em * var(--u));border-bottom:3px solid var(--wu-green);background:var(--paper)}
.wm{font:700 1.15em/1.1 var(--serif);color:var(--wu-green);white-space:nowrap}
.wm b{font-weight:700;color:var(--wu-deep)}
.wm img{height:1.8em;vertical-align:middle}
.chap{font-weight:700;color:var(--muted);font-size:.8em;text-align:right}
.page{position:relative;flex:1;overflow:auto;padding:.8em 1.4em 3em calc(8.2em * var(--u));
  background-color:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.1em - 1px),var(--rule) calc(2.1em - 1px),var(--rule) 2.1em);
  background-attachment:local;font-size:calc(var(--u) * clamp(18px,min(1.4vw,2.55vh),30px));line-height:1.45}
.page::before{content:"";position:absolute;left:calc(6.2em * var(--u));top:0;bottom:0;width:5px;border-left:2px solid var(--wu-green);border-right:1px solid var(--wu-green);opacity:.75;pointer-events:none}
.pg{position:absolute;right:1.1em;bottom:.5em;z-index:5;font-family:var(--hand);color:var(--muted);font-size:.85em;background:var(--paper);padding:0 .5em;border-radius:6px}
.slide.in{animation:turn .55s ease-out both;transform-origin:left center}
@keyframes turn{from{opacity:0;transform:perspective(1200px) rotateY(-9deg) translateX(18px)}to{opacity:1;transform:none}}

h2.t{font:700 1.85em/1.15 var(--serif);color:var(--wu-green);margin-bottom:.35em;outline:none}
h3.s{font:700 1.1em/1.2 var(--serif);color:var(--wu-deep);margin:.2em 0 .25em}
.big{font:700 1.5em/1.3 var(--serif)}
.lead{font-size:1.1em}
.muted{color:var(--muted)}
.hand{font-family:var(--hand);color:var(--wu-green)}
.stack>*+*{margin-top:.8em}
.row{display:flex;flex-wrap:wrap;gap:.6em;align-items:center}
.cols{display:grid;gap:1em}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}
@media(max-width:820px){.c2,.c3{grid-template-columns:1fr}.page{padding-left:calc(5.4em * var(--u))}.page::before{left:calc(3.8em * var(--u))}.rings{width:1.2em}}

/* ===== steps (the presenter reveals one idea at a time) ===== */
.stp{opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .45s,transform .45s,visibility 0s .45s}
.stp.on{opacity:1;visibility:visible;transform:none;transition:opacity .45s,transform .45s}
.rm .stp,.rm .stp.on{transition:none;transform:none}
.rm *,.rm *::before,.rm *::after{animation:none!important;transition:none!important}
.rm .slide.in{animation:none}

/* ===== components ===== */
.badge{display:inline-flex;align-items:center;gap:.35em;background:#fdeadb;border:1.5px dashed var(--accent);border-radius:999px;font:700 .62em/1.5 var(--sans);padding:0 .7em;white-space:nowrap;color:var(--text)}
.plain{background:var(--wu-soft);border-left:6px solid var(--wu-green);border-radius:4px 12px 12px 4px;padding:.45em .9em;font-size:.82em}
.plain-h{font:800 .75em/1.2 var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--wu-green);margin-bottom:.2em}
.plain p+p{margin-top:.3em}
.sticky{background:#fff7a8;color:#2b2a14;padding:.6em .9em;box-shadow:2px 4px 10px rgba(0,0,0,.25);transform:rotate(-1.4deg);font-family:var(--hand);font-size:.82em;border-radius:2px}
.chat{border:2px solid #b9c9bf;border-radius:16px;background:#f3f7f4;overflow:hidden}
.chat-head{display:flex;gap:.5em;align-items:center;padding:.3em .8em;font:700 .72em var(--sans);color:var(--muted);border-bottom:2px solid #b9c9bf}
.chat-body{padding:.6em .8em}
.bubble{background:#fff;border:2px solid #cdd8d1;border-radius:4px 14px 14px 14px;padding:.55em .8em;min-height:2.4em}
.doc{margin:0;background:#fff;border:2px solid #cfd8d2;border-top:7px solid var(--wu-green);border-radius:6px;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.doc figcaption{display:flex;gap:.5em;align-items:center;padding:.3em .8em;font:800 .72em var(--sans);color:var(--wu-green);border-bottom:1px solid #dfe6e1}
.doc-body{padding:.5em .85em}
.verdict{border-radius:10px;padding:.4em .8em;border:2px solid;font-size:.88em}
.v-h{display:flex;gap:.4em;align-items:center;font-weight:800}
.v-good{background:var(--good-soft);border-color:var(--good)}.v-good .v-h{color:var(--good)}
.v-err{background:var(--err-soft);border-color:var(--err)}.v-err .v-h{color:var(--err)}
.v-chk{background:var(--chk-soft);border-color:var(--chk)}.v-chk .v-h{color:var(--chk)}
.verdict p+p{margin-top:.2em}
.mk{background:linear-gradient(transparent 12%,var(--mkc,var(--mk)) 12%) no-repeat 0 0/0% 100%;transition:background-size .7s ease-out;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.mk.on{background-size:100% 100%}
.rm .mk{transition:none}
.mk-good{--mkc:#bfe8cf}.mk-err{--mkc:#f7c3c3}.mk-chk{--mkc:#ffdf94}
.tag{display:inline-flex;gap:.3em;align-items:center;font:800 .65em var(--sans);border-radius:999px;padding:0 .6em;border:1.5px solid currentColor;background:#fff}
.tg-good{color:var(--good)}.tg-chk{color:var(--chk)}.tg-err{color:var(--err)}.tg-pl{color:var(--wu-green)}
.card{background:#fff;border:2px solid #d3ddd6;border-radius:12px;padding:.5em .85em;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.card.g{border-color:var(--good)}.card.c{border-color:var(--chk)}
.colhead{display:flex;gap:.45em;align-items:center;font:800 1em var(--serif);margin-bottom:.4em}
.prompt{background:#f1f5f2;border:2px dashed var(--wu-green);border-radius:10px;padding:.5em .8em;font:.72em/1.45 ui-monospace,Consolas,Menlo,monospace;overflow-wrap:anywhere;white-space:pre-wrap}
.btn{background:var(--wu-green);color:#fff;border:2px solid var(--wu-green);border-radius:999px;padding:.2em 1.1em;font-weight:700;font-size:.78em;display:inline-flex;gap:.4em;align-items:center}
.btn.alt{background:#fff;color:var(--wu-green)}
.num{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--wu-green);color:#fff;font:800 .8em var(--sans);flex:none}
.node{background:var(--wu-soft);border:2px solid var(--wu-green);border-radius:12px;padding:.35em .7em;font-weight:700;display:flex;gap:.4em;align-items:center}
.path{display:flex;flex-wrap:wrap;gap:.4em;align-items:center}
.arrow{color:var(--wu-green);font-weight:800}
.word5{font:700 1.5em/1.5 var(--serif);color:var(--wu-green);display:flex;gap:.6em;align-items:center}
.word5.last{color:var(--accent)}
.slidemini{aspect-ratio:16/9;background:linear-gradient(135deg,#00693C,#0a8a52);color:#fff;border-radius:8px;padding:.5em .7em;font-size:.72em;display:flex;flex-direction:column;justify-content:center}
.slidemini b{font:700 1.3em var(--serif)}
.slide.coverslide{position:absolute;inset:0}
.cover{position:absolute;inset:0;background:linear-gradient(160deg,#00693C,#00331F);display:grid;place-items:center;padding:1.2em 1.2em 1.2em 5em;color:#fff;z-index:2}
.label{background:var(--paper);color:var(--text);border:3px solid var(--wu-deep);border-radius:14px;padding:1em 1.4em;max-width:46em;width:100%;box-shadow:0 8px 24px rgba(0,0,0,.4);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.7em - 1px),var(--rule) calc(1.7em - 1px),var(--rule) 1.7em)}
.label .k{font:800 .7em var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--wu-green)}
.label h1{font:700 1.9em/1.15 var(--serif);color:var(--wu-green);margin:.15em 0 .3em}
ol.toc{list-style:none;margin:0;padding:0;display:grid;gap:.15em}
ol.toc button{width:100%;text-align:left;background:transparent;border:0;border-bottom:2px dotted #9db8a8;display:flex;justify-content:space-between;gap:1em;padding:.25em .1em;color:var(--text);font:inherit;font-weight:600}
ol.toc button:hover{background:var(--wu-soft)}
ol.toc .pn{font-family:var(--hand);color:var(--wu-green)}

/* ===== control bar ===== */
.ctl{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:0 clamp(8px,1.6vw,22px);color:#fff;z-index:20}
.ctl .grp{display:flex;gap:.35rem;flex-wrap:nowrap;align-items:center}
.cb{background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.55);border-radius:10px;padding:0 .7rem;font-size:.9rem;font-weight:700;white-space:nowrap}
.cb:hover:not(:disabled){background:rgba(255,255,255,.25)}
.cb:disabled{opacity:.45;cursor:default}
.cb[aria-pressed="true"]{background:#fff;color:var(--wu-deep)}
.cnt{font-weight:700;font-size:.9rem;min-width:6.5rem;text-align:center}
@media(max-width:700px){.hide-s{display:none}.cb{padding:0 .5rem}}
.progress{position:fixed;left:0;right:0;bottom:56px;height:5px;background:rgba(255,255,255,.18);z-index:19}
.progress i{display:block;height:100%;width:100%;background:var(--wu-tint);transform-origin:left;transform:scaleX(0);transition:transform .4s}
.rm .progress i{transition:none}
#notes{position:fixed;left:clamp(8px,3vw,40px);right:clamp(8px,3vw,40px);bottom:68px;max-height:34vh;overflow:auto;background:#fff7a8;color:#2b2a14;border-radius:8px;padding:.7rem 1rem;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:30;font-size:1rem;line-height:1.5}
#notes[hidden]{display:none}
#notes h2{font:800 .8rem var(--sans);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.3rem}
</style>
</head>

<script>
"use strict";
/* =====================================================================
   HOW TO EDIT THE WORDS
   All the words are in the data objects below, in the first block:
     DECK     the title, the optional logo, and the chapter names
     T        the words on each slide (T.grounding, T.hcd, T.udl ...)
     SORT     the learner-first and tool-first examples
     UDL_ROWS the "label" and "real option" examples
     KEEP     the cards for "what to keep human"
     IDEAS    the five big ideas
     WEEK     the "week at a glance" list (change order and times here)
   Each slide's "Presenter notes" text is the 'notes' part of its addSlide(...) line near the end of the data.
   Logo: set DECK.logoSrc to a file path to show the official logo. Empty shows the green wordmark.
   The code (logic) begins at the line that says "ENGINE".
   ===================================================================== */
const DECK = {
  title: "Week 3: Designing Lessons with AI That Work for Every Learner",
  course: "AI Literacy for Educators",
  logoSrc: "",   /* optional, e.g. "assets/wilmu-logo.png". Empty = text wordmark */
  storageKey: "ail-week3-concepts-v1",
  chapters: ["Welcome", "Grounding", "Human-centered design", "UDL", "Checking and testing", "Keep it human", "Privacy", "Wrap-up"]
};

const T = {
  contentsWords: [
    ["AI", "short for artificial intelligence. Here it means tools like ChatGPT and Claude that generate text and files when you type a request."],
    ["Grounding", "giving the AI your own trusted material to work from."],
    ["UDL", "short for Universal Design for Learning. A way to plan lessons with options built in."]
  ],
  outcomes: [
    "Explain grounding, and show how attaching your own material changes what AI invents.",
    "Tell a real UDL option from a label, and ask the AI to review a lesson for UDL, then verify the answer.",
    "Check and test what you generate before you trust it, including files such as slide decks and web pages.",
    "Decide which parts of a lesson to keep human, and give a reason about learners or the learning goal."
  ],
  grounding: {
    hookHead: "AI can sound very sure and still be wrong.",
    hookOutput: "Grade 4 Science: The Water Cycle. Standard ES.4.7. Evaporation happens only when water reaches the boiling point of 100 degrees Celsius. According to a 2022 report by the National Water Learning Council, students learn the water cycle best by copying the diagram three times.",
    hookWords: [
      ["Output", "what an AI tool produces after you type a request. We also call it a draft."],
      ["Standard", "a learning goal that your state sets for a grade and subject. It has a code, like a label."],
      ["Hallucination", "when AI writes something that sounds right but is made up. The word is used in the field. In this lesson we mostly say “made-up content.”"]
    ],
    howText: "AI tools like ChatGPT and Claude generate text by choosing words that are likely to come next, based on patterns in the writing they learned from. They do not look facts up the way a search does.",
    autoStart: "The cat sat on the ...",
    autoChoices: ["mat", "couch", "roof"],
    autoCaption: "Bigger and smarter, but the same idea: it generates likely words, so it can generate wrong words that sound right.",
    lines: [
      { text: "Evaporation happens only when water reaches the boiling point of 100 degrees Celsius.", kind: "err", note: "Water evaporates at many temperatures, well below boiling. Boiling is a faster change at a higher temperature." },
      { text: "Most of Earth's water is in the oceans.", kind: "good", note: "This is accurate and quick to confirm with a trusted source." },
      { text: "According to a 2022 report by the National Water Learning Council, students learn the water cycle best by copying the diagram three times.", kind: "chk", note: "The council and the report are invented for this lesson. If AI names a source, search for it before you use it." },
      { text: "Standard ES.4.7", kind: "chk", note: "This code is invented for this lesson. Compare any code AI supplies with your state's standards list." }
    ],
    findSummary: "Three kinds of problems teachers will meet: wrong facts, made-up sources, and wrong standard codes.",
    groundWords: [
      ["Grounding", "giving the AI your own trusted material and telling it to use only that material."],
      ["Prompt", "the message you type to tell an AI tool what to do."]
    ],
    notesTitle: "Your unit notes",
    notes: "Evaporation is when liquid water changes into water vapor. It can happen at many temperatures and happens faster when the water is warmer.",
    groundedOutput: "Evaporation is when liquid water changes into water vapor. It can happen at many temperatures, and it happens faster when the water is warmer. I could not find a standard code in your notes, so I am not sure which one applies. Please tell me.",
    groundPrompt: "Use only the attached material. Mark anything you are not sure of, and ask me instead of guessing.",
    quiz: [
      "1. What is evaporation? Answer: liquid water changing into water vapor.",
      "2. Does water evaporate faster when it is warmer? Answer: yes.",
      "3. In which layer of the atmosphere do most clouds form? Answer: the troposphere."
    ],
    quizFlag: "This question uses a fact that is not in the attached lesson. It may sound fine, but your notes never said it, so you would have to check it.",
    limitMessage: "Grounding lowers the chance of made-up content. It does not remove it. Ground it, then check it.",
    bridge: "In this week's lab you will run the same lesson prompt twice, once with no source and once with your own material, and compare."
  },
  hcd: {
    plain: [["Human-centered design", "starting with your learners (their needs, cultures, and relationships) and not with what the tool can do."]],
    close: "AI can draft materials. It cannot build relationships or know your students. That part is yours."
  },
  udl: {
    plain: [["Universal Design for Learning (UDL)", "a way of planning lessons with options built in from the start, so more learners can succeed without special fixes later."]],
    lessonLine: "The lesson: read a four-page passage alone, then answer the questions in writing.",
    disclaim: "These three learners are made up. They show different needs in one lesson. They are not labels or learning styles.",
    learners: [
      { name: "Learner 1", trait: "Reads slowly and tires with long passages.", wall: "Four pages take so long that the energy is gone before the questions start.", options: ["Listen to the passage read aloud.", "Read it in short parts with a stop after each part."] },
      { name: "Learner 2", trait: "Loses focus on long single tasks.", wall: "One long task with no stopping point makes it hard to keep going.", options: ["Break the work into short steps with a check-in after each.", "Pick which step to start with."] },
      { name: "Learner 3", trait: "Does well when talking things through.", wall: "Writing answers alone gives no chance to say ideas out loud first.", options: ["Talk it through with a partner first.", "Record a one-minute explanation instead of writing."] }
    ],
    principles: [
      { name: "Engagement", q: "The WHY", plain: "What gets learners interested and keeps them going.", ex: "Students pick one of three local water questions to investigate (a puddle, a pond, or a rain barrel), then use the same lab steps." },
      { name: "Representation", q: "The WHAT", plain: "How information is shown.", ex: "Students can read the text, listen to it read aloud, or study a labeled diagram." },
      { name: "Action and expression", q: "The HOW", plain: "How learners show what they know.", ex: "Students choose a poster, a one-minute recorded explanation, or a written paragraph. All three are scored with the same four-point checklist." }
    ],
    cast: "CAST released its Guidelines 3.0 in 2024.",
    realWords: [
      ["Real option", "keeps the same learning goal and the same criteria, but offers different ways to meet them."],
      ["Label", "a name with no option behind it. AI often writes things like “multiple means of expression” without any real option behind them."],
      ["Graphic organizer", "a page with boxes or shapes that helps students sort their ideas."]
    ],
    realTest: "The test is one question: What does a student actually do differently?",
    realHelper: "Not sure? Ask: could two students do this differently and still meet the same goal?",
    fixStart: "Students choose how to show their learning. Everyone completes the same worksheet.",
    fixes: [
      { t: "(a) Rename it “differentiated.”", kind: "chk", why: "Renaming changes the label, not what a student can choose." },
      { t: "(b) Offer a choice of three tasks that are all scored with the same checklist.", kind: "good", why: "Students now choose different tasks, and the goal and criteria stay the same. That is a real option." },
      { t: "(c) Add more pages to the worksheet.", kind: "chk", why: "More pages change the amount of work, not what a student can choose." }
    ],
    reviewIntro: "Teachers can ask an AI tool to review a lesson for UDL. Here is a prompt you can copy.",
    excerptTitle: "Lesson excerpt",
    excerpt: "Slides have captions that can be turned on or off. Every student completes the same worksheet. Students work in pairs for the lab.",
    udlPrompt: "Review the lesson plan. For each of engagement, representation, and action and expression, list the specific choices a student has. If a choice is only a label, say so, and propose a real option that keeps the same learning goal and the same criteria.",

});
addSlide(3, "Ask this every time", "Read the question slowly. Ask the room for one more idea to add. Then say the privacy line out loud: describe needs in general terms.", s => {

});

/* Checking */
addSlide(4, "Polished is not proof", "Flip through the slides. Then ask: what is the problem? Reveal the two cards and the highlight. Say it simply: if it looks nice, slow down and check.", s => {
  const k = T.check;

  s.append(h("div", { class: "cols c3", style: "margin-top:.5em" }, k.slides.map(x => step(h("div", { class: "slidemini" }, h("span", {}, "Slide " + x.n), h("b", {}, x.h), x.b.map(t => h("span", {}, t)))))));
  const a = h("span", { class: "mk mk-err" }, k.cmpA), b = h("span", { class: "mk mk-err" }, k.cmpB);
  s.append(h("div", { class: "cols c2", style: "margin-top:.6em" }, step(h("div", { class: "card" }, a), () => requestAnimationFrame(() => a.classList.add("on"))), step(h("div", { class: "card" }, b), () => requestAnimationFrame(() => b.classList.add("on")))));
  s.append(h("div", { style: "margin-top:.6em" }, step(verdict("err", k.polishRight))), step(h("p", { class: "big", style: "margin-top:.5em;color:var(--wu-green)" }, k.polishSay)));
});
addSlide(4, "The fact-check habit", "Three steps: Ask, Check, Fix. Stress that the AI's list is a set of leads, and that asking it whether it made an error is not a reliable check.", s => {
  const k = T.check;

  s.append(h("h3", { class: "s", style: "margin-top:.7em" }, "A prompt to copy"), step(copyBlock(k.factPrompt, "Fact-check prompt")));
  s.append(h("div", { class: "stack", style: "margin-top:.7em" }, step(h("p", { class: "lead", style: "font-weight:700" }, k.factTeach)), step(verdict("chk", k.factWarn))));
});
addSlide(4, "A file is code", "Walk the path from request to file. Then the test list. The only files to open are the ones made in your own AI chat.", s => {
  const k = T.check, nodes = [];
  k.path.forEach((p, i) => { nodes.push(step(h("div", { class: "node" }, h("span", { class: "num" }, String(i + 1)), p))); if (i < k.path.length - 1) nodes.push(step(h("span", { class: "arrow", "aria-hidden": "true" }, "→"))); });
  s.append(plain(k.codeWords), h("p", { style: "margin:.5em 0" }, k.codeText), h("div", { class: "path", role: "list", "aria-label": "From request to file" }, nodes));
  s.append(h("h3", { class: "s", style: "margin-top:.7em" }, "Your test list"), h("ul", { style: "list-style:none;margin:0;padding:0" }, k.tests.map(t => step(h("li", { class: "row", style: "margin-bottom:.2em" }, h("span", { class: "num" }, icon("check")), t)))));
});
addSlide(4, "The habit", "Say each word as it appears. Under Make it yours, add the line about your voice and what only you know about your students.", s => {
  const k = T.check;
  s.append(h("div", { class: "stack" }, k.habitWords.map((w, i) => step(h("div", { class: "word5" + (i === 4 ? " last" : "") }, h("span", { class: "num" }, String(i + 1)), w)))));
  s.append(h("p", { class: "lead", style: "margin-top:.7em" }, step(h("span", {}, k.makeYours))));
});

/* Keep human */
addSlide(5, "What to keep human", "Read each card, then reveal where it goes. Ask: what is the reason? The reason is about the learner or the learning goal.", s => {
  const cols = T.keep.cols.map(([k, name]) => { const c = h("div", { class: "stack" }, h("div", { class: "colhead" }, tag(k === "human" ? "good" : "chk"), name)); KEEP.filter(x => x.a === k).forEach(x => c.append(step(h("div", { class: "card " + (k === "human" ? "g" : "c") }, h("p", {}, "“" + x.t + "”"), h("p", { style: "font-size:.85em;font-weight:700" }, x.why))))); return c; });
  s.append(badge(), h("div", { class: "cols c3", style: "margin-top:.4em" }, cols));
});
addSlide(5, "Good reasons and weak reasons", "Show the weak reason first. Then the two strong ones. The test: is the reason about your learners or your learning goal, or only about the tool? Mention the discussion post.", s => {
  const k = T.keep;
  s.append(badge(), h("div", { class: "cols c2", style: "margin-top:.4em" },
    step(h("div", { class: "verdict v-chk" }, h("p", { class: "v-h" }, icon("mag"), "Check this: a weak reason"), h("p", {}, "“" + k.weak + "”"))),
    h("div", { class: "stack" }, h("p", { class: "v-h", style: "color:var(--good)" }, icon("check"), "Good: strong reasons"), k.strong.map(t => step(h("div", { class: "verdict v-good" }, h("p", {}, "“" + t + "”")))))));
  s.append(step(h("p", { class: "big", style: "margin-top:.7em;color:var(--wu-green)" }, k.reasonTeach)), step(h("p", { style: "margin-top:.5em" }, k.discuss)));
});

/* Privacy */
addSlide(6, "Privacy", "Read the card aloud. This one matters. Then the line for people who are not yet teaching.", s => {
  const p = T.privacy;
  s.append(step(h("div", { class: "verdict v-chk", style: "border-width:3px;padding:.8em 1em" }, h("p", { class: "v-h" }, icon("mag"), "Check this"), h("p", { class: "lead" }, p.card))), h("p", { style: "margin-top:.8em;font-weight:700" }, step(h("span", {}, p.extra))));

/* Wrap-up */
addSlide(7, "Big ideas", "One idea per click. Let each one sit for a breath before you move on.", s => {
  s.append(h("ol", { style: "list-style:none;margin:0;padding:0" }, IDEAS.map((t, i) => step(h("li", { class: "card row", style: "margin-bottom:.5em;border-color:var(--wu-green)" }, h("span", { class: "num" }, String(i + 1)), h("strong", {}, t))))));
});
addSlide(7, "Your week at a glance", "Times are approximate. Point to this lecture, then walk down the list. Share the CAST link if students want to read more.", s => {
  const max = Math.max(...WEEK.map(w => w.hi));

    const t = w.lo === w.hi ? "about " + w.lo : w.lo + " to " + w.hi;
    const bar = h("i", { style: "display:block;height:100%;border-radius:6px;background:" + (w.here ? "var(--accent)" : "var(--wu-green)") + ";width:" + Math.round(w.hi / max * 100) + "%" });
    return step(h("li", { class: "card", style: "margin-bottom:.4em;" + (w.here ? "border-color:var(--accent)" : "") }, h("div", { class: "row", style: "justify-content:space-between" }, h("strong", {}, (i + 1) + ". " + w.name), h("span", {}, t + " minutes (approximate)")), h("div", { style: "height:.5em;background:#e8efe9;border-radius:6px;margin-top:.3em", "aria-hidden": "true" }, bar)));
  })));
  s.append(step(h("p", { style: "font-weight:700" }, T.endNote)), h("p", { style: "margin-top:.5em" }, h("a", { class: "lnk", href: "https://udlguidelines.cast.org", target: "_blank", rel: "noopener noreferrer", style: "color:var(--wu-green);font-weight:700" }, "Learn more: CAST UDL Guidelines (opens in a new tab)")), h("p", { class: "muted", style: "font-size:.8em" }, T.udl.cast));
});

/* ----- cover is slide 0; build it separately and insert first ----- */
SLIDES.unshift({ ch: 0, title: "Cover", notes: "Welcome the group. Say that this page is the concepts lecture and that the check for understanding is a separate page.", build: s => {
  s.append(h("div", { class: "cover" }, h("div", { class: "label stack" },
    h("p", { class: "k" }, DECK.course + " · Week 3"), h("h1", { id: "coverTitle" }, DECK.title),
    h("p", { class: "lead" }, "Concepts lecture: the big ideas, explained one step at a time."),
    h("p", { class: "hand", style: "font-size:1.1em" }, "Press the Right Arrow or Next to turn the page."),
    h("p", { class: "muted", style: "font-size:.8em" }, "Wilmington University · Nothing here is graded. This page sends nothing anywhere."))));
} });

/* ---------- state and navigation ---------- */
const S = { i: 0, step: 0, size: 2, rm: false };
const SIZES = [0.8, 0.9, 1, 1.15, 1.3, 1.5];
function load() {
  let st = null; try { st = JSON.parse(localStorage.getItem(DECK.storageKey) || "null"); } catch (e) { st = null; }
  if (st) { S.i = st.i | 0; S.size = typeof st.size === "number" ? st.size : 2; S.rm = !!st.rm; }
  else S.rm = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  const m = /^#(\d+)$/.exec(location.hash); if (m) S.i = +m[1] - 1;
  if (!(S.i >= 0 && S.i < SLIDES.length)) S.i = 0;
  if (!(S.size >= 0 && S.size < SIZES.length)) S.size = 2;
}
function save() { try { localStorage.setItem(DECK.storageKey, JSON.stringify({ i: S.i, size: S.size, rm: S.rm })); } catch (e) { /* storage blocked: page still works */ } }
function prefs() {
  root.style.setProperty("--u", SIZES[S.size]); root.classList.toggle("rm", S.rm);
  $("#bRM").setAttribute("aria-pressed", String(S.rm)); $("#bSmall").disabled = S.size === 0; $("#bBig").disabled = S.size === SIZES.length - 1;
}
let dir = 1;
function render(startStep) {
  TOK++; timers.forEach(clearTimeout); timers = []; STEPS = [];
  const sl = SLIDES[S.i], pg = h("section", { class: "slide" + (RM() ? "" : " in"), "aria-labelledby": "ttl" });
  if (sl.title === "Cover") { page.style.overflow = "hidden"; pg.classList.add("coverslide"); } else page.style.overflow = "";
  if (sl.title !== "Cover") pg.append(h("h2", { class: "t", id: "ttl", tabindex: "-1" }, sl.title)); else pg.append(h("span", { class: "sr", id: "ttl" }, DECK.title));
  const body = h("div", {}); pg.append(body); sl.build(body);
  page.replaceChildren(pg); page.scrollTop = 0;
  S.step = Math.min(startStep || 0, STEPS.length);
  STEPS.forEach((st, k) => { if (k < S.step) reveal(st, true); });
  const t = $("#ttl"); if (t && t.tagName === "H2") t.focus({ preventScroll: true });
  $("#chap").textContent = S.i === 0 ? "" : "Chapter " + sl.ch + ": " + DECK.chapters[sl.ch];
  $("#pg").textContent = "Page " + (S.i + 1) + " of " + SLIDES.length;
  $("#cnt").textContent = (S.i + 1) + " of " + SLIDES.length;
  $("#pfill").style.transform = "scaleX(" + (S.i + 1) / SLIDES.length + ")"; $("#pbar").setAttribute("aria-valuenow", String(Math.round((S.i + 1) / SLIDES.length * 100)));
  $("#bBack").disabled = S.i === 0; $("#bNext").disabled = S.i === SLIDES.length - 1 && S.step >= STEPS.length;
  $("#notesText").textContent = sl.notes; document.title = sl.title + " | Week 3 concepts | Wilmington University";
  try { history.replaceState(null, "", "#" + (S.i + 1)); } catch (e) { /* file or blocked: ignore */ }
  save();
}
function go(i) { if (i < 0 || i >= SLIDES.length) return; dir = i >= S.i ? 1 : -1; S.i = i; render(0); }
function next() {
  if (S.step < STEPS.length) { reveal(STEPS[S.step], false); S.step++; $("#bNext").disabled = S.i === SLIDES.length - 1 && S.step >= STEPS.length; const el = STEPS[S.step - 1].el; if (el.scrollIntoView) el.scrollIntoView({ block: "nearest", behavior: RM() ? "auto" : "smooth" }); return; }
  if (S.i < SLIDES.length - 1) go(S.i + 1);
}
function back() {
  if (S.step > 0) { S.step--; hideStep(STEPS[S.step]); $("#bNext").disabled = false; return; }
  if (S.i > 0) { dir = -1; S.i--; render(9999); }
}
function showAll() { while (S.step < STEPS.length) { reveal(STEPS[S.step], false); S.step++; } $("#bNext").disabled = S.i === SLIDES.length - 1; announce("Everything on this page is showing."); }

$("#bNext").addEventListener("click", next); $("#bBack").addEventListener("click", back);
$("#bAll").addEventListener("click", showAll); $("#bToc").addEventListener("click", () => go(1));
$("#bNotes").addEventListener("click", () => { const n = $("#notes"); n.hidden = !n.hidden; $("#bNotes").setAttribute("aria-pressed", String(!n.hidden)); });
$("#bSmall").addEventListener("click", () => { S.size = Math.max(0, S.size - 1); prefs(); save(); announce("Text size smaller."); });
$("#bBig").addEventListener("click", () => { S.size = Math.min(SIZES.length - 1, S.size + 1); prefs(); save(); announce("Text size bigger."); });
$("#bRM").addEventListener("click", () => { S.rm = !S.rm; prefs(); save(); announce("Reduce motion is " + (S.rm ? "on." : "off.")); });
$("#bFull").addEventListener("click", () => { try { if (document.fullscreenElement) document.exitFullscreen(); else root.requestFullscreen(); } catch (e) { announce("Full screen is not available here."); } });
document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const t = e.target, tn = t && t.tagName;
  if (tn === "INPUT" || tn === "TEXTAREA" || tn === "SELECT") return;
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || k === "ArrowDown" && tn !== "BUTTON") { e.preventDefault(); next(); }
  else if (k === " " && tn !== "BUTTON" && tn !== "A") { e.preventDefault(); next(); }
  else if (k === "ArrowLeft" || k === "PageUp" || k === "ArrowUp" && tn !== "BUTTON") { e.preventDefault(); back(); }
  else if (k === "Home") go(0); else if (k === "End") go(SLIDES.length - 1);
  else if (!e.shiftKey && (k === "n" || k === "N")) $("#bNotes").click();
  else if (!e.shiftKey && (k === "a" || k === "A")) showAll();
  else if (!e.shiftKey && (k === "c" || k === "C")) go(1);
  else if (!e.shiftKey && (k === "f" || k === "F")) $("#bFull").click();
});
window.addEventListener("hashchange", () => { const m = /^#(\d+)$/.exec(location.hash); if (m && +m[1] - 1 !== S.i) go(+m[1] - 1); });

/* optional official logo: only requested when DECK.logoSrc is set; the text wordmark stays if it fails */
if (DECK.logoSrc) { const im = new Image(); im.alt = "Wilmington University"; im.onload = () => { $("#wm").replaceChildren(im); }; im.src = DECK.logoSrc; }
load(); prefs(); render(0);
</script>
