<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Made Simple</title>
<meta name="description" content="An interactive, cinematic 2.5D campus lecture for Wilmington University's AI Literacy for Educators. Works offline in a single file.">
<meta name="theme-color" content="#00693C">
<!--
  AI Literacy for Educators: AI Made Simple (Lite edition)
  Wilmington University. One portable file: inline CSS, JS and SVG. No server, API key, login or build step needed to RUN it.
  This file is generated by build.py from src/. To edit lecture content, change src/content*.js and run:  python3 build.py
  (or edit the CONTENT section of this file directly: the data blocks are plain JavaScript objects).
-->
<style>
:root{--wu:#00693C;--wu2:#0a9a5a;--gold:#f2b705;--ink:#eef3ff;--ink2:#b9c8ea;--bg:#0b1530;--panel:rgba(9,16,40,.9);--panel2:rgba(22,34,70,.9);--line:rgba(160,190,255,.25);--cy:#38e1ff;--mg:#ff5ec4;--pu:#9a7bff;--ok:#38d996;--bad:#ff6b6b;--warn:#ffb84d;--fs:22px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050914;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
body.contrast{--ink:#fff;--ink2:#fff;--panel:#000;--panel2:#000;--line:#fff;--cy:#7ff;--ok:#6f6;--bad:#f66;--warn:#fd5}
body.contrast .panel,body.contrast .modal{border:3px solid #fff}
#viewport{position:fixed;inset:0}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:#0b1530;font-size:var(--fs);line-height:1.42}
.layer{position:absolute;inset:0}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--gold);outline-offset:2px;border-radius:6px}
svg text{font-family:inherit}
/* motion controls */
body.paused *,body.paused *::before,body.paused *::after{animation-play-state:paused!important}
body.reduce *,body.reduce *::before,body.reduce *::after{animation:none!important;transition-duration:.01s!important}
/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;height:76px;display:flex;align-items:center;gap:10px;padding:0 18px;background:linear-gradient(#050b1ee6,#050b1e99);border-bottom:1px solid var(--line);z-index:30}
#hud .title{min-width:0;flex:1}
#hud .title{overflow:hidden}
#hud .t1{overflow:hidden;text-overflow:ellipsis;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
#hud .t2{font-size:25px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:Georgia,"Times New Roman",serif}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 13px;font-size:17px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;min-height:40px}
.btn:hover{border-color:var(--cy);background:rgba(40,70,140,.85)}
.btn.pri{background:var(--wu);border-color:#2fd08a;font-weight:700}
.btn.pri:hover{background:var(--wu2)}
.btn.gold{background:var(--gold);color:#201600;border-color:#ffe08a;font-weight:700}
.btn.sm{padding:4px 10px;font-size:15px;min-height:32px}
.btn.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn kbd,.kbd{font:600 13px ui-monospace,Consolas,monospace;background:#0004;border:1px solid var(--line);border-radius:5px;padding:0 5px}
#dots{display:flex;gap:6px;align-items:center}
#dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink2);background:transparent;display:block;cursor:pointer;padding:0}
#dots i.v{background:var(--ink2)}#dots i.cur{background:var(--gold);border-color:var(--gold);transform:scale(1.35)}
#dots i.opt{border-style:dashed}
#chbar{position:absolute;left:0;top:76px;height:5px;width:100%;background:#fff1;z-index:30}
#chbar b{display:block;height:100%;background:linear-gradient(90deg,var(--wu2),var(--gold));width:0;transition:width .5s}
#pace{font-size:16px;padding:5px 10px;border-radius:10px;border:1px solid var(--line);background:#0006;min-width:210px;line-height:1.2}
#pace b{display:block;font-size:18px}
#pace.ahead b{color:var(--cy)}#pace.on b{color:var(--ok)}#pace.behind b{color:var(--warn)}
body.student #pace,body.student .instr{display:none}
body.instructor .stu{display:none}
/* ---------- panel ---------- */
.panel{position:absolute;left:70px;right:70px;top:100px;height:790px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px 34px;overflow:auto;z-index:10;box-shadow:0 20px 70px #000a;animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.panel h1{font:700 44px/1.1 Georgia,"Times New Roman",serif;margin:0 0 6px}
.panel h2{font:700 30px/1.15 Georgia,serif;margin:0 0 8px}
.panel h3{font-size:1em;margin:0 0 4px;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
.kicker{color:var(--cy);font-size:.78em;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.sub{color:var(--ink2)}
.cols{display:grid;grid-template-columns:1.12fr .88fr;gap:30px;height:calc(100% - 4px)}
.col{min-width:0;display:flex;flex-direction:column;gap:12px;min-height:0}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 15px;font-size:.8em}
.tab.on{background:var(--wu);border-color:#2fd08a;font-weight:700}
.tab.seen:not(.on){border-color:var(--ink2)}
.tabbody{flex:1;overflow:auto;background:var(--panel2);border-radius:16px;padding:18px 22px;font-size:1.04em;line-height:1.5;min-height:0}
.tabbody p{margin:0 0 .6em}
.tabbody ul{margin:.2em 0 .6em;padding-left:1.2em}
.tabbody li{margin:.2em 0}
.tabbody .lead{font-size:1.1em;font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fig{flex:1;min-height:0;background:radial-gradient(circle at 50% 30%,#1a2c62,#0a1230);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;overflow:hidden}
.fig .figbody{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.fig svg{width:100%;height:100%}
.cap{font-size:.74em;color:var(--ink2);margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.badge{display:inline-block;border-radius:999px;font-size:.66em;font-weight:700;padding:3px 11px;letter-spacing:.04em;vertical-align:middle;border:1px solid}
.badge.real{background:#0b3d2a;color:#7dffc0;border-color:#2fd08a}
.badge.sim{background:#3d3208;color:#ffe08a;border-color:var(--gold)}
.badge.script{background:#3a1646;color:#f4b6ff;border-color:var(--mg)}
.badge.optl{background:#10325a;color:#9fd2ff;border-color:#4a9bff}
.callout{border-left:5px solid var(--gold);background:#f2b70f1f;padding:8px 14px;border-radius:0 12px 12px 0;font-size:.9em}
.callout.warn{border-color:var(--warn);background:#ffb84d22}
.callout.good{border-color:var(--ok);background:#38d99622}
.callout.bad{border-color:var(--bad);background:#ff6b6b22}
.math{font-family:"Cambria Math",Cambria,Georgia,serif;font-style:italic;background:#0006;border:1px solid var(--line);border-radius:10px;padding:8px 14px;display:block;margin:.5em 0;font-size:1.05em;overflow-x:auto}
/* ---------- labs ---------- */
.labhead{display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.labhead h2{margin:0}
.labhead .sp{flex:1}
.labgrid{display:grid;grid-template-columns:1fr 420px;gap:22px;height:calc(100% - 64px);min-height:0}
.labmain{min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px}
.labside{background:var(--panel2);border-radius:16px;padding:14px 18px;overflow:auto;font-size:.88em;display:flex;flex-direction:column;gap:10px}
.labside ol{margin:.2em 0;padding-left:1.2em}
.labside li{margin:.25em 0}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ctl{display:flex;align-items:center;gap:12px;font-size:.88em}
.ctl label{min-width:150px;color:var(--ink2)}
.ctl output{min-width:62px;text-align:right;font:700 1em ui-monospace,Consolas,monospace;color:var(--gold)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:8px;border-radius:6px;background:linear-gradient(90deg,var(--wu2),var(--cy));outline-offset:6px;min-width:140px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--gold);cursor:grab}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--gold)}
input[type=text],input[type=number],textarea,select{font:inherit;font-size:.9em;color:var(--ink);background:#050b1e;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
textarea{width:100%;resize:vertical}
table{border-collapse:collapse;width:100%;font-size:.84em}
th,td{padding:5px 9px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--gold);font-weight:700}
tr.hit td{background:#38d99633}
tr.bad td{background:#ff6b6b2a}
.bar{display:grid;grid-template-columns:150px 1fr 74px;gap:10px;align-items:center;margin:5px 0;font-size:.88em}
.bar .tr{height:26px;background:#ffffff14;border-radius:7px;overflow:hidden;position:relative}
.bar .fl{height:100%;background:linear-gradient(90deg,var(--pu),var(--cy));width:0;border-radius:7px}
.bar.pick{cursor:pointer}.bar.pick:hover .tr{outline:2px solid var(--gold)}
.bar.sel .fl{background:linear-gradient(90deg,var(--wu2),var(--gold))}
.bar .v{text-align:right;font-family:ui-monospace,Consolas,monospace}
.chip{display:inline-block;padding:1px 9px;margin:2px;border-radius:7px;font-family:ui-monospace,Consolas,monospace;font-size:.92em;border:1px solid #0004;color:#0b1020;font-weight:600}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:10px 16px;margin:7px 0;font-size:.95em}
.opt:hover{border-color:var(--cy)}
.opt.sel{border-color:var(--gold);background:#f2b7051f}
.opt.right{border-color:var(--ok);background:#38d99626}
.opt.wrong{border-color:var(--bad);background:#ff6b6b22}
.fb{margin-top:10px;padding:12px 16px;border-radius:12px;background:#0006;border:1px solid var(--line);font-size:.92em}
.lvl{font-size:.7em;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.pill{display:inline-block;background:#fff1;border-radius:999px;padding:0 10px;font-size:.8em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
canvas.sim{background:#07102a;border:1px solid var(--line);border-radius:14px;max-width:100%;touch-action:none}
.node{cursor:pointer}
/* ---------- floating nav ---------- */
.fnav{position:absolute;bottom:20px;z-index:25;display:flex;gap:10px;align-items:center}
#navL{left:22px}#navR{right:22px}
.fnav .btn{font-size:21px;padding:10px 18px;border-radius:14px;background:#050b1ee0}
#cap{position:absolute;left:50%;transform:translateX(-50%);bottom:36px;max-width:1000px;background:#050b1ed8;border:1px solid var(--line);border-radius:14px;padding:10px 22px;font-size:22px;text-align:center;z-index:24;pointer-events:none}
#skip{position:absolute;right:26px;bottom:26px;z-index:60;display:none}
body.cinema #skip{display:block}
body.cinema .panel,body.cinema #navL,body.cinema #navR{display:none}
#fade{position:absolute;inset:0;background:#02050f;opacity:0;pointer-events:none;z-index:50;transition:opacity .45s}
#fade.on{opacity:1;pointer-events:auto}
#flash{position:absolute;inset:0;background:radial-gradient(circle,#fff,#7fe7ff 40%,transparent 70%);opacity:0;pointer-events:none;z-index:49}
/* ---------- avatar ---------- */
#avatar{position:absolute;width:120px;height:240px;margin-left:-60px;z-index:12;pointer-events:none;transform-origin:50% 100%;transform:scale(var(--sc,1))}
#avatar svg{width:100%;height:100%;overflow:visible}
#avatar.flip svg{transform:scaleX(-1)}
#avatar .legL,#avatar .legR,#avatar .armF,#avatar .armB{transform-box:fill-box}
#avatar .legL{transform-origin:50% 5%}#avatar .legR{transform-origin:50% 5%}
#avatar .armF,#avatar .armB{transform-origin:50% 8%}
#avatar.walking .legL{animation:stepA .62s ease-in-out infinite}
#avatar.walking .legR{animation:stepB .62s ease-in-out infinite}
#avatar.walking .armF{animation:stepB .62s ease-in-out infinite}
#avatar.walking .armB{animation:stepA .62s ease-in-out infinite}
#avatar.walking .bob{animation:bob .31s ease-in-out infinite}
#avatar .bob{transform-box:fill-box}
#avatar .idle{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 100%}
#avatar.react{animation:hop .6s ease}
#avatar.wave .armF{animation:wave .5s ease-in-out 4;transform:rotate(-150deg)}
#avatar .eye{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes stepA{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(26deg)}}
@keyframes stepB{0%,100%{transform:rotate(26deg)}50%{transform:rotate(-26deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(var(--sc,1))}35%{transform:translateY(-34px) scale(var(--sc,1))}}
@keyframes wave{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-120deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
/* ---------- campus ---------- */
#campus .plx{position:absolute;top:0;left:0;height:1080px;will-change:transform}
#campus .plx>svg{display:block;height:1080px}
.door .dl,.door .dr{transition:transform .8s ease;transform-box:fill-box}
.door .dl{transform-origin:0 50%}.door .dr{transform-origin:100% 50%}
.door.open .dl,.door.open .dr{transform:scaleX(.12)}
.sign{cursor:pointer}
.sign:hover .plq,.sign:focus .plq{fill:#fff3b0}
.sign.next .glow{opacity:1}
.glow{opacity:0;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.cloud{animation:drift 140s linear infinite}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(2300px)}}
.tw{animation:twk 3s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:.25}50%{opacity:1}}
#hubcard{position:absolute;left:50%;transform:translateX(-50%);top:98px;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 26px;text-align:center;max-width:1500px}
/* ---------- env ---------- */
#env svg{width:100%;height:100%;display:block}
.float{animation:flt 6s ease-in-out infinite}
.float2{animation:flt 8s ease-in-out -3s infinite}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.spin{animation:spin 12s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.flow{stroke-dasharray:14 12;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-26}}
.flick{animation:twk 2.2s ease-in-out infinite}
/* ---------- overlays ---------- */
#overlay{position:absolute;inset:0;z-index:70;display:none;background:#030813cc;align-items:center;justify-content:center}
#overlay.on{display:flex}
.modal{width:1500px;max-width:94%;max-height:900px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px 34px;box-shadow:0 30px 90px #000}
.modal h2{font:700 36px Georgia,serif;margin:0 0 10px}
.modal .x{float:right}
#notes{position:absolute;right:0;top:82px;bottom:0;width:620px;z-index:40;background:#fff8e1;color:#1a1200;border-left:8px solid #d33;padding:0;transform:translateX(100%);transition:transform .35s;overflow:auto;font-size:19px}
#notes.on{transform:none}
#notes .warnbar{background:#d33;color:#fff;padding:8px 16px;font-weight:700;font-size:16px;position:sticky;top:0}
#notes .nb{padding:12px 20px 40px}
#notes h3{color:#7a4b00;margin:14px 0 2px;font-size:16px;text-transform:uppercase;letter-spacing:.08em}
#notes p,#notes li{margin:.3em 0}
#notes .btn{color:#1a1200;background:#fff;border-color:#c9a85a}
.mapwrap{position:relative;height:620px;background:linear-gradient(#162a5a,#0b1d44);border-radius:16px;border:1px solid var(--line);overflow:hidden}
.mapnode{position:absolute;transform:translate(-50%,-50%);width:200px;text-align:center}
.mapnode button{width:100%;border-radius:16px;padding:12px;background:var(--panel2);border:2px solid var(--line)}
.mapnode button.cur{border-color:var(--gold)}
.mapnode button.lock{opacity:.45}
.mapnode .n{display:block;font:700 34px Georgia}
.mapnode .d{display:block;font-size:15px;color:var(--ink2)}
.mapnode .st{font-size:14px;color:var(--ok)}
#toast{position:absolute;left:50%;top:92px;transform:translateX(-50%);z-index:80;background:var(--gold);color:#201600;font-weight:700;padding:8px 20px;border-radius:12px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
.settings label{display:flex;gap:12px;align-items:center;margin:10px 0}
.settings input[type=checkbox]{width:22px;height:22px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 16px}
.seg button.on{background:var(--wu);font-weight:700}
.big{font:700 40px/1.25 Georgia,serif}
.quote{font:italic 600 42px/1.3 Georgia,serif;text-align:center;max-width:1400px;margin:0 auto}
.fin{display:flex;flex-direction:column;justify-content:center;height:100%;gap:22px;text-align:center}
.srOnly{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.tokflow{font-family:ui-monospace,Consolas,monospace}
.sortitem{padding:8px 14px;border:2px solid var(--line);border-radius:10px;background:var(--panel2);cursor:grab;font-size:.85em;margin:5px 0;text-align:left;width:100%}
.sortitem.sel{border-color:var(--gold);background:#f2b7051f}
.sortitem.ok{border-color:var(--ok)}.sortitem.no{border-color:var(--warn)}
.bucket{min-height:430px;border:2px dashed var(--line);border-radius:14px;padding:8px 12px}
.bucket:hover,.bucket.over{border-color:var(--cy);background:#38e1ff12}
.bucket h4{margin:0 0 6px;font-size:.92em}
.principle{border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--panel2);text-align:left;font-size:.85em}
.principle.on{border-color:var(--gold);background:#f2b7051f}
.principle b{display:block;font-size:1.1em}
.mono{font-family:ui-monospace,Consolas,monospace}
.dim{opacity:.35;text-decoration:line-through}
.msg{padding:6px 12px;border-radius:12px;margin:5px 0;background:#ffffff14;font-size:.85em}
.msg.out{opacity:.28;filter:grayscale(1)}
.msg.key{border:2px solid var(--gold)}
@media (max-width:900px){#hud .btn span.lbl{display:none}}
#title{position:absolute;left:0;right:0;top:300px;text-align:center;z-index:22;pointer-events:none;opacity:0;transition:opacity 1.2s;text-shadow:0 4px 30px #000}
#title .tt{font:700 88px/1.05 Georgia,"Times New Roman",serif;margin:14px 60px;color:#fff}
#title .ts{font-size:34px;color:var(--gold);letter-spacing:.1em;text-transform:uppercase}
.panel.short{height:600px}
body.immersive .panel,body.immersive #hubcard{opacity:0;pointer-events:none}
body.low .cloud,body.low .tw,body.low .float,body.low .float2,body.low .flick{animation:none}
body.low .panel{animation:none}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.synth{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;text-align:left;font-size:.72em}
.synth .card{display:flex;flex-direction:column;gap:6px}
.stuline{font-size:15px;color:var(--ink2);padding:0 8px}
.hubchip{min-width:170px;text-align:center}
.hubchip.lock{opacity:.5}
.tabbody .q{font:700 1.15em Georgia,serif}
.pacebtn{cursor:pointer}

#title::before{content:"";position:absolute;left:8%;right:8%;top:-70px;bottom:-60px;background:radial-gradient(ellipse at center,rgba(4,10,36,.78),rgba(4,10,36,0) 70%);z-index:-1}
#title .kicker{color:var(--gold)}
.fnav .btn.gold{background:var(--gold);color:#201600}
.fnav .btn.pri{background:var(--wu)}
#campus,#env{z-index:0}

</style>
</head>
<body class="instructor">
<noscript><p style="color:#fff;padding:2em">This lecture application needs JavaScript. Please enable it in your browser.</p></noscript>
<div id="viewport"><div id="stage" aria-label="Interactive lecture stage">
  <div id="campus" class="layer" style="z-index:0"></div>
  <div id="env" class="layer hidden" style="z-index:0" aria-hidden="true"></div>
  <canvas id="fx" class="layer" style="width:100%;height:100%;z-index:2;pointer-events:none" aria-hidden="true"></canvas>
  <div id="avatarHost" class="layer" style="z-index:5;pointer-events:none"></div>

'use strict';
/* =====================================================================
   CORE ENGINE: utilities, central state, animation loop, cinematic runner,

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const SVGTAGS=new Set('svg g path circle rect line text defs linearGradient radialGradient stop polygon ellipse polyline use clipPath tspan marker filter feGaussianBlur'.split(' '));
function h(tag,attrs,...kids){
  const el=SVGTAGS.has(tag)?document.createElementNS('http://www.w3.org/2000/svg',tag):document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false)continue;
    if(k==='style'&&typeof v==='object')Object.assign(el.style,v);
    else if(k==='html')el.innerHTML=v;
    else if(k.startsWith('on')&&typeof v==='function')el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(c));}
  return el;
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeInOut=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const lin=t=>t;
const fmt=(v,d=2)=>Number(v).toFixed(d);
const pct=(v,d=0)=>(v*100).toFixed(d)+'%';
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function shuffle(a,r=Math.random){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

/* ---------------- central application state ---------------- */
const STORE_KEY=EDITION.key;
const S={
  mode:'instructor',ch:0,sc:0,target:EDITION.def,
  visited:{},      // "ch:sc" -> true
  quiz:{},         // questionId -> {pick, ok}
  checks:{},       // concept check results
  reflect:{},      // free text reflections (local only, no identifiers requested)
  principles:[],   // chosen responsible-AI principles
  prefs:{reduced:false,low:false,contrast:false,scale:1,captions:true},
  timer:{running:false,elapsed:0,last:0}   // session-only, not persisted
};
const PERSIST=['mode','ch','sc','target','visited','quiz','checks','reflect','principles','prefs'];
function loadState(){
  try{
    const j=JSON.parse(localStorage.getItem(STORE_KEY)||'null');
    if(j)for(const k of PERSIST)if(j[k]!==undefined)S[k]=(typeof S[k]==='object'&&!Array.isArray(S[k]))?Object.assign(S[k],j[k]):j[k];
  }catch(e){}
  try{if(!localStorage.getItem(STORE_KEY)&&matchMedia('(prefers-reduced-motion: reduce)').matches)S.prefs.reduced=true;}catch(e){}
}
let saveT=0;
function saveState(){clearTimeout(saveT);saveT=setTimeout(()=>{try{const o={};for(const k of PERSIST)o[k]=S[k];localStorage.setItem(STORE_KEY,JSON.stringify(o));}catch(e){}},120);}

/* ---------------- animation engine ---------------- */
const CANCEL={cancelled:true};
const Anim={
  paused:false,tickers:new Map(),last:0,raf:0,uid:0,
  add(fn,id){id=id||('t'+(++this.uid));this.tickers.set(id,fn);this.kick();return id;},
  remove(id){this.tickers.delete(id);},
  kick(){if(!this.raf){this.last=performance.now();this.raf=requestAnimationFrame(this.frame);}},
  frame(ts){
    const A=Anim;A.raf=0;if(!A.tickers.size)return;
    let raw=ts-A.last;
    if(S.prefs.low&&raw<30){A.raf=requestAnimationFrame(A.frame);return;}
    A.last=ts;raw=Math.min(raw,100);
    const eff=A.paused?0:raw;
    for(const [id,fn] of [...A.tickers]){
      try{if(fn(eff,ts,raw)===false)A.tickers.delete(id);}catch(e){console.error(e);A.tickers.delete(id);}
    }
    A.raf=requestAnimationFrame(A.frame);
  },
  /* UI tween: ignores pause (so controls never freeze); instant under reduced motion */
  tween(dur,fn,ease=easeOut){
    return new Promise(res=>{
      if(S.prefs.reduced||dur<=0){fn(1);res();return;}
      let el=0;fn(0);
      this.add((d,t,raw)=>{el+=raw;const p=Math.min(1,el/dur);fn(ease(p));if(p>=1){res();return false;}});
    });
  }
};
class Cin{
  constructor(){this.skipping=false;this.dead=false;}
  _tick(test){
    return new Promise((res,rej)=>{
      Anim.add((dt)=>{
        if(this.dead){rej(CANCEL);return false;}
        if(this.skipping||S.prefs.reduced){res();return false;}
        if(test(dt)){res();return false;}
      });
    });
  }
  wait(ms){let el=0;return this._tick(dt=>(el+=dt)>=ms);}
  async tween(dur,fn,ease=easeInOut){let el=0;fn(0);await this._tick(dt=>{el+=dt;if(el<dur){fn(ease(el/dur));return false;}return true;});fn(1);}
  skip(){this.skipping=true;}
}
const Cine={
  cur:null,
  run(fn){
    this.cancel();const c=new Cin();this.cur=c;document.body.classList.add('cinema');
    return(async()=>{
      try{await fn(c);}catch(e){if(e!==CANCEL)console.error(e);}
      finally{if(this.cur===c){this.cur=null;document.body.classList.remove('cinema');}}
      return !c.dead;
    })();
  },
  cancel(){if(this.cur){this.cur.dead=true;this.cur=null;}document.body.classList.remove('cinema');},
  skip(){if(this.cur)this.cur.skip();if(Avatar.cin)Avatar.cin.skip();},
  get active(){return !!this.cur;}
};

/* ---------------- the student avatar ---------------- */
const Avatar={
  el:null,x:0,dir:1,cin:null,
  build(){
    const el=h('div',{id:'avatar','aria-hidden':'true'});
    el.innerHTML=`<svg viewBox="0 0 120 240"><ellipse cx="60" cy="234" rx="34" ry="6" fill="#0006"/>
    <g class="idle"><g class="bob">
      <g class="legL"><rect x="46" y="142" width="17" height="76" rx="8" fill="#26334d"/><path d="M41 214h28a5 5 0 0 1 5 6v6H41z" fill="#f2f2f2"/></g>
      <g class="legR"><rect x="62" y="142" width="17" height="76" rx="8" fill="#2f3f60"/><path d="M57 214h28a5 5 0 0 1 5 6v6H57z" fill="#ffffff"/></g>
      <g class="armB"><rect x="30" y="80" width="15" height="66" rx="7" fill="#04522f"/><circle cx="37" cy="148" r="8" fill="#d99b70"/></g>
      <rect x="28" y="84" width="22" height="62" rx="9" fill="#14532d" opacity=".95"/>
      <rect x="38" y="72" width="46" height="78" rx="14" fill="#00693C"/>
      <path d="M52 72l8 20 8-20z" fill="#fff"/><path d="M60 92l-4 56h8z" fill="#f2b705" opacity=".9"/>
      <rect x="47" y="108" width="26" height="20" rx="3" fill="#f2b705" opacity=".0"/>
      <g class="armF"><rect x="76" y="80" width="15" height="66" rx="7" fill="#00693C"/><circle cx="84" cy="148" r="8" fill="#e0ac82"/><rect x="82" y="140" width="22" height="30" rx="3" fill="#1d3a8a" transform="rotate(8 90 150)"/></g>
      <rect x="54" y="62" width="12" height="12" fill="#e0ac82"/>
      <circle cx="60" cy="42" r="24" fill="#e0ac82"/>
      <path d="M35 40c-2-22 14-30 27-28 16 1 26 12 22 30-4-9-9-14-20-15-10 3-21 4-29 13z" fill="#3a2418"/>
      <g class="eye"><circle cx="69" cy="42" r="3" fill="#1a1020"/></g><g class="eye"><circle cx="53" cy="42" r="3" fill="#1a1020"/></g>
      <path d="M54 54q7 6 14 0" stroke="#7a3f2a" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g></g></svg>`;
    this.el=el;return el;
  },
  mount(parent,x,bottomPx,scale=1){
    if(!this.el)this.build();
    parent.appendChild(this.el);
    this.el.style.bottom=bottomPx+'px';this.el.style.setProperty('--sc',scale);this.scale=scale;
    this.setX(x);
  },
  setX(x){this.x=x;this.el.style.left=x+'px';},
  face(d){this.dir=d;this.el.classList.toggle('flip',d<0);},
  async walkTo(x,opts={}){
    const speed=opts.speed||0.42; // px per ms
    const from=this.x,dist=Math.abs(x-from);
    if(this.cin)this.cin.dead=true;
    const c=opts.cin||(this.cin=new Cin());
    if(S.prefs.reduced||dist<2){this.setX(x);return;}
    this.face(x>=from?1:-1);
    this.el.classList.add('walking');
    try{
      await c.tween(dist/speed,p=>{this.setX(from+(x-from)*p);if(opts.onStep)opts.onStep(this.x);},lin);
    }catch(e){if(e!==CANCEL)throw e;return;}
    finally{if(!c.dead||c===this.cin)this.el.classList.remove('walking');}
  },
  react(kind){
    const e=this.el;if(!e)return;e.classList.remove('react','wave');void e.offsetWidth;
    e.classList.add(kind==='wave'?'wave':'react');
    setTimeout(()=>e.classList.remove('react','wave'),kind==='wave'?2200:700);
  }
};

/* ---------------- particle layer (one canvas, themed) ---------------- */
const FX={
  cv:null,cx:null,theme:null,parts:[],id:null,W:960,H:540,
  themes:{
    campus:{n:26,col:['#d6f5a0','#fff3a0','#ffffff'],vx:[-.03,-.01],vy:[.01,.03],r:[2,4],kind:'dot'},
    dusk:{n:34,col:['#fff5a0','#ffd37a'],vx:[-.01,.01],vy:[-.01,.01],r:[2,4],kind:'glow'},
    museum:{n:38,col:['#38e1ff','#9a7bff','#ffffff'],vx:[-.01,.01],vy:[-.03,-.008],r:[1.5,3.5],kind:'glow'},
    lab:{n:30,col:['#38d996','#7fe7ff'],vx:[-.005,.005],vy:[.02,.05],r:[9,13],kind:'bit'},
    digital:{n:30,col:['#38e1ff','#ff5ec4','#9a7bff','#ffe08a'],vx:[.05,.12],vy:[-.01,.01],r:[12,16],kind:'token'},
    library:{n:40,col:['#ffe08a','#ffd27a','#fff'],vx:[-.01,.01],vy:[-.02,-.005],r:[1.5,3.5],kind:'glow'},
    obs:{n:32,col:['#7fe7ff','#6fa8ff','#fff'],vx:[-.02,.02],vy:[-.02,.02],r:[3,6],kind:'sq'},
    collab:{n:34,col:['#ffb84d','#38e1ff','#38d996','#ff5ec4'],vx:[-.03,.03],vy:[-.03,.03],r:[3,6],kind:'glow'}
  },
  words:['the','teach','##er','learn','5021','▮','AI','token','0.82','of','class','data','→','P(x)','Δ','query'],
  init(){
    this.cv=$('#fx');this.cx=this.cv.getContext('2d');this.resize();
  },
  resize(){
    const s=S.prefs.low?.5:1;this.W=Math.round(960*s);this.H=Math.round(540*s);
    this.cv.width=this.W;this.cv.height=this.H;this.k=this.W/960;
  },
  set(name){
    this.themeName=name;this.theme=this.themes[name]||null;this.parts=[];
    if(this.id){Anim.remove(this.id);this.id=null;}
    this.cx.clearRect(0,0,this.W,this.H);
    if(!this.theme||S.prefs.reduced)return;
    const r=Math.random;const n=Math.round(this.theme.n*(S.prefs.low?.5:1));
    for(let i=0;i<n;i++)this.parts.push(this.spawn(true));
    this.id=Anim.add((dt)=>{if(dt>0)this.draw(dt);});
  },
  spawn(init){
    const t=this.theme,r=Math.random,rg=(a)=>lerp(a[0],a[1],r());
    return{x:r()*960,y:init?r()*540:(t.vy[0]>0?-10:550),vx:rg(t.vx),vy:rg(t.vy),r:rg(t.r),c:t.col[Math.floor(r()*t.col.length)],ph:r()*6.28,w:this.words[Math.floor(r()*this.words.length)]};
  },
  draw(dt){
    const cx=this.cx,t=this.theme,k=this.k;cx.clearRect(0,0,this.W,this.H);
    for(let i=0;i<this.parts.length;i++){
      const p=this.parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.ph+=dt*.002;
      if(p.x<-60||p.x>1020||p.y<-30||p.y>570){Object.assign(p,this.spawn(false));if(t.vx[0]>.03)p.x=-40;}
      const x=p.x*k,y=p.y*k,r=p.r*k;
      cx.globalAlpha=.55+.4*Math.sin(p.ph);cx.fillStyle=p.c;
      if(t.kind==='dot'){cx.beginPath();cx.arc(x,y,r,0,6.3);cx.fill();}
      else if(t.kind==='glow'){cx.globalAlpha*=.8;cx.beginPath();cx.arc(x,y,r,0,6.3);cx.fill();cx.globalAlpha*=.25;cx.beginPath();cx.arc(x,y,r*3,0,6.3);cx.fill();}
      else if(t.kind==='sq'){cx.fillRect(x,y,r,r);}
      else if(t.kind==='bit'){cx.font=`${r*1.2}px monospace`;cx.fillText(p.ph>3?'1':'0',x,y);}
      else if(t.kind==='token'){
        cx.font=`${r*k*1.0}px monospace`;const w=cx.measureText(p.w).width+10*k;
        cx.globalAlpha=.28;cx.fillRect(x,y-r,w,r*1.5);cx.globalAlpha=.9;cx.strokeStyle=p.c;cx.strokeRect(x,y-r,w,r*1.5);cx.fillStyle='#fff';cx.fillText(p.w,x+5*k,y+r*.2);
      }
    }
    cx.globalAlpha=1;
  }
};

Sims.knn={kind:'real',title:'Exhibit B · The Machine-Learning Laboratory',
mount(el){
  const CW=700,CH=430,cls=[['On track','#38d996'],['Needs support','#ff9a6b']];

    data=[];

    ctx.save();ctx.translate(X(test.x),Y(test.y));ctx.rotate(Math.PI/4);ctx.fillStyle='#fff';ctx.fillRect(-9,-9,18,18);ctx.strokeStyle=data.length?cls[r.pred][1]:'#999';ctx.lineWidth=4;ctx.strokeRect(-9,-9,18,18);ctx.restore();
    let ok=0;data.forEach((p,i)=>{if(data.length>1&&knn(p,i).pred===p.c)ok++;});

      <div>Neighbors voting: <b>${r.votes[0]}</b> on track · <b>${r.votes[1]}</b> needs support → vote share ${pct(r.conf)}</div>

/* ---------------- Ch2 · Lab C: Temperature (softmax on illustrative logits) ---------------- */
Sims.temperature={kind:'sim',title:'Laboratory C · The Temperature Simulator',
mount(el){
  const toks=['curiosity','feedback','practice','sleep','patience','pizza'],logits=[3.0,2.6,2.4,1.5,1.1,-.5];
  let T=1,counts=toks.map(()=>0),total=0,last=[];
  const b1=h('div'),b2=h('div'),stat=h('div',{class:'card'}),list=h('div',{class:'card mono',style:{minHeight:'54px',maxHeight:'130px',overflow:'auto'}});
  const bars1=Bars(b1,toks,{fmt:v=>pct(v,1)}),bars2=Bars(b2,toks,{fmt:v=>pct(v,0)});
  function draw(){
    const p=softmax(logits,T),H=-p.reduce((a,v)=>a+(v>0?v*Math.log2(v):0),0);
    bars1.set(p,p.indexOf(Math.max(...p)));bars2.set(counts.map(c=>total?c/total:0));
    stat.innerHTML=`T = <b>${T===0?'0 (greedy)':T.toFixed(2)}</b> · top token share <b>${pct(Math.max(...p),1)}</b> · entropy <b>${H.toFixed(2)} bits</b> (max for 6 options = 2.58)`;
    list.innerHTML=last.length?last.map(i=>`<span class="chip" style="background:hsl(${i*55} 75% 72%)">${toks[i]}</span>`).join(''):'<span class="sub">Generated completions appear here.</span>';
  }
  function gen(n){const p=softmax(logits,T);last=[];for(let i=0;i<n;i++){const k=sampleIdx(p);counts[k]++;total++;last.push(k);}draw();}
  const sl=UI.slider(EDITION.lite?'Creativity dial':'Temperature T',0,2,.05,T,v=>{T=v;counts=toks.map(()=>0);total=0;last=[];draw();},v=>v===0?'greedy':v.toFixed(2));
  el.append(h('div',{class:'mono card',html:'Prompt: <b>"The most important thing for a learner is ___"</b> <span class="sub">(logits are illustrative)</span>'}),sl.el,
    h('div',{class:'grid2'},h('div',{},h('h3',{},'Probability after softmax(z / T)'),b1),h('div',{},h('h3',{},'Observed choices (sampled)'),b2)),stat,
    h('div',{class:'row'},UI.btn('Generate 1',()=>gen(1),'pri'),UI.btn('Generate 10',()=>gen(10),'pri'),UI.btn('Generate 200',()=>gen(200)),UI.btn('Reset tally',()=>{counts=toks.map(()=>0);total=0;last=[];draw();})),list,
    UI.note('Low T sharpens the distribution toward the top token (T→0 is greedy decoding: always the same answer). High T flattens it, so unlikely tokens like <i>pizza</i> appear more often. Temperature changes <b>how we sample</b>, not what the model "knows".','good'));
  if(EDITION.lite)stat.style.display='none';
  draw();
  return{replay(){counts=toks.map(()=>0);total=0;gen(10);}};
}};

/* ---------------- Ch2 · Lab D: Context window (scripted) ---------------- */
Sims.context={kind:'script',title:'Laboratory D · The Context Window Experiment',
mount(el){
  const base=[
    {t:'Teacher: Reminder for next week: the unit quiz is on FRIDAY, not Thursday.',key:true},
    {t:'Teacher: Please return the field-trip permission slips by Monday.'},
    {t:'Student: Can we use calculators on the quiz?'},
    {t:'Teacher: Yes, basic calculators are fine. Bring your own.'},
    {t:'Teacher: The robotics club moves to room 214 this week.'},
    {t:'Student: Is the library open during lunch?'},
    {t:'Teacher: Yes, it is open from 11:30 to 12:15 daily.'},
    {t:'Teacher: Our class photo will be taken after lunch on Tuesday.'},
    {t:'Student: Which day is the unit quiz?',q:true}];
  let msgs=base.map(m=>({...m})),limit=240,reminded=false;
  const tok=m=>Math.ceil(m.t.split(/\s+/).length*1.3);
  const box=h('div',{class:'card',style:{maxHeight:'420px',overflow:'auto'}}),reply=h('div',{class:'card'}),meter=h('div',{class:'sub'});
  function draw(){
    let used=0;const vis=new Array(msgs.length).fill(false);
    for(let i=msgs.length-1;i>=0;i--){const c=tok(msgs[i]);if(used+c<=limit){used+=c;vis[i]=true;}else break;}
    box.innerHTML='';msgs.forEach((m,i)=>box.appendChild(h('div',{class:'msg'+(vis[i]?'':' out')+(m.key?' key':'')},m.t,h('span',{class:'sub',style:{float:'right'}},tok(m)+' tok'))));
    const keyVisible=msgs.some((m,i)=>m.key&&vis[i]);
    meter.innerHTML=`Window: the most recent <b>${limit}</b> tokens fit (${used} used). Greyed messages are outside the window and cannot influence the reply.`;
    reply.innerHTML=`<div class="sub">Scripted reply to "Which day is the unit quiz?"</div><div class="big" style="font-size:28px;color:${keyVisible?'#38d996':'#ffb84d'}">${keyVisible?'“The unit quiz is on Friday.”':'“The unit quiz is usually held on Thursday, based on typical schedules.”'}</div><div class="sub">${keyVisible?'The key fact is inside the window, so the reply can use it.':'The key fact fell out of the window. A real model may then produce a fluent, plausible guess instead of saying it lacks the information.'}</div>`;
  }
  const sl=UI.slider('Context window size (tokens)',20,260,10,limit,v=>{limit=v;draw();});
  el.append(UI.note('<b>Scripted demonstration:</b> no model is running. Token counts are approximated (≈1.3 per word) and the reply is scripted to show the principle that a model can only condition on text inside its context window.','warn'),sl.el,meter,box,reply,
    h('div',{class:'row'},UI.btn('Repeat key fact near the end',()=>{if(!reminded){msgs.splice(msgs.length-1,0,{t:'Teacher: (repeat) The unit quiz is on FRIDAY.',key:true});reminded=true;draw();}},'pri'),UI.btn('Reset conversation',()=>{msgs=base.map(m=>({...m}));reminded=false;draw();})));
  draw();
  return{replay(){let l=260;Anim.tween(2600,p=>{limit=Math.round((260-240*p)/10)*10;sl.set(limit);draw();});}};
}};

mount(el){
  const Q=[
    {c:'The Great Wall of China is easily visible to the naked eye from the Moon.',a:false,ev:'False. This is a long-standing myth; from the Moon no human-made structure is discernible by eye, and even from low Earth orbit the wall is hard to pick out.'},

    {c:'Canberra is the capital city of Australia.',a:true,ev:'True. Sydney and Melbourne are larger, which is why the error is common.'},
    {c:'The 2001 revision of Bloom\'s taxonomy, edited by Anderson and Krathwohl, restated the cognitive categories as verbs.',a:true,ev:'True. The revision (A Taxonomy for Learning, Teaching, and Assessing) uses Remember, Understand, Apply, Analyze, Evaluate, Create.'},
    {c:'Humans use only about 10 percent of their brains.',a:false,ev:'False. Imaging and lesion studies show activity throughout the brain over a day; there is no dormant 90 percent.'},
    {c:'Water boils at a lower temperature at higher altitude.',a:true,ev:'True. Lower air pressure lowers the boiling point.'}];

      const card=h('div',{class:'card',style:{margin:'7px 0'}},h('div',{class:'row'},h('div',{class:'grow'},h('span',{class:'pill'},'AI-style claim '+(i+1)+' · tone: 100% certain'),h('div',{style:{fontSize:'1.02em',marginTop:'4px'}},'“'+q.c+'”')),
        h('button',{class:'btn sm'+(pick[i]===true?' on':''),type:'button',onclick:()=>{pick[i]=true;draw();}},'I predict TRUE'),h('button',{class:'btn sm'+(pick[i]===false?' on':''),type:'button',onclick:()=>{pick[i]=false;draw();}},'I predict FALSE')));

/* ---------------------------- CHAPTER 1 · WHAT IS AI? KINDS · HISTORY ---------------------------- */
CHAPTERS.push({
  id:1,key:'discovery',title:'The AI Discovery Center',short:'What Is AI?',env:'museum',fx:'museum',door:1,topic:'What AI is, its kinds and its history',
  essential:'What counts as AI, and where did it come from?',
  objectives:['Say what AI is in everyday words, and name AI you already use.','Tell apart the main kinds of AI.','Describe, in a few milestones, how AI got here.'],
  summary:['AI: computer systems that do tasks we usually think need human intelligence.','Main kinds: rule-based, machine learning, deep learning, generative. They overlap and nest.','All AI today is "narrow": good at particular tasks.','The idea is about 70 years old; chatbots went mainstream in 2022.'],
  refs:['mccarthy1955','turing1950','shannon1948','lecun2015'],
  guide:{facilitation:'Let people try the rule machine before you explain it. Ask "what do you think will happen?" first. Keep the history light: three or four dates are enough.',transitions:'Bridge: "Three of those kinds learn from examples. How does a machine learn? Next building."',qual:['There is no single official definition of AI.','The kinds of AI are a teaching simplification; real products often combine them.','Dates and milestones are simplified; many people contributed and histories choose different milestones.']},
  scenes:[
    {id:'c1-what',type:'concept',title:'What Is AI?',minutes:2,station:420,
     concept:{term:'Artificial intelligence',labels:L_LABELS,
       def:'Artificial intelligence (AI) is the name for computer systems that do tasks we usually think need human intelligence, such as recognizing speech, spotting patterns, making recommendations, or writing text. There is no single official definition.',
       explain:'All AI today is "narrow": it can be very good at particular tasks and still fail at things a child finds easy. A "general" AI that matches people across everything does not exist today.',
       analogy:'A power tool. A drill is far better than your hand at making holes, but it cannot decide what to build or whether the wall is safe to drill.',
       classroom:'You already use AI: spelling and grammar suggestions, video and music recommendations, voice assistants, photo apps that group faces, and chatbots.',
       misconception:'"AI thinks like a person." AI systems find patterns or follow rules. Whether any of them "understands" is debated, but they do not think the way people do.',
       steps:[['Something goes in','A question, a photo, a sound, or a table of numbers.'],['The computer applies rules or learned patterns','Either a person wrote the rules, or the computer found the patterns in examples.'],['Something comes out','An answer, a label, a suggestion, or brand-new text or images.'],['People decide what to do with it','Is it useful? Is it right? That part is still ours.']],
       check:{q:'Which statement about AI today is most accurate?',opts:['It thinks exactly like a person','It is good at specific tasks and can fail at things that seem easy','It knows everything','It does not exist yet'],ans:1,why:'Today’s AI is "narrow": strong at particular tasks, but it can fail unexpectedly, and it does not think like a person.'},
       visual:'steps'},
     notes:{say:'"AI is a broad label for computer tools that do tasks we associate with intelligence. Let’s see how those tools work."',demo:'Click through the four steps on the right.',facilitate:'Ask them to name AI they used this morning.',misc:'That AI is one thing; that it thinks like a person.',caveat:'No single definition exists.',transition:'"There are different kinds."'}},
    {id:'c1-kinds',type:'concept',title:'Kinds of AI',minutes:3,station:820,
     concept:{term:'Four kinds of AI',labels:L_LABELS,
       def:'Rule-based AI follows rules a person wrote. Machine learning finds patterns in examples. Deep learning is machine learning with many layers of connections. Generative AI creates new text, images or sound. They overlap: deep learning is a kind of machine learning, and most generative AI today uses deep learning.',
       analogy:'A recipe card (follow the steps), an apprentice who tastes hundreds of dishes and learns what works (learn from examples), the same apprentice with a huge team of specialists (deep), and a chef who invents a new dish in that style (generative).',
       mechanism:'Rules: IF this THEN that. Machine learning: examples in, patterns out. Deep learning: the same, but stacked layers can pick up more complicated patterns. Generative: the patterns are used to build something new.',
       classroom:'Rule: "Email a reminder when homework is 3 days late." Machine learning: software that studies past data to spot who may need help. Deep learning: speech-to-text for captions. Generative: a chatbot drafting a rubric.',
       misconception:'"AI, machine learning and ChatGPT are the same thing." They nest: ChatGPT-style chatbots are generative AI, built with deep learning, which is a kind of machine learning, which is a kind of AI. Rule-based systems are AI that is not machine learning.',
       check:{q:'Which statement is most accurate?',opts:['The four kinds never overlap','Deep learning is a kind of machine learning, and most generative AI today uses deep learning','Generative AI is rule-based','Machine learning is a kind of deep learning'],ans:1,why:'The kinds nest and overlap. Deep learning is a subset of machine learning, and today’s generative systems are usually deep-learning models.'},
       visual:'venn',demo:'c1-rules'},
     notes:{say:'"Four kinds that nest inside each other. Rules sit outside machine learning; the other three nest."',demo:'Click each region of the diagram for a definition.',facilitate:'Ask people to place a tool they use on the diagram.',misc:'That the kinds are separate boxes.',caveat:'Teaching simplification.',transition:'"Let’s try the first kind, rules."'}},
    {id:'c1-rules',type:'lab',title:'Try It: A Rule Machine',minutes:2,station:1220,sim:'rules',
     lab:{purpose:'See a system that only does what its rules say.',steps:['Move the student sliders and watch which rule fires.','Change a rule number a little (for example 80 to 79). See how students are treated differently.','Look for students that no rule covers.'],prompt:'Who is responsible when two nearly identical students get different results?',classroom:'Gradebook alerts, filters and reminders are often rule-based.'},
     notes:{say:'"Every decision here can be traced to a rule you can read. That is a strength. The weakness: it only knows what someone thought of."',demo:'A real rule engine on made-up students. The first matching rule wins.',facilitate:'Invite someone to try to break the rules.',caveat:'Made-up student data.',transition:'"Now, where did all of this come from?"'}},
    {id:'c1-history',type:'concept',title:'Where AI Came From',minutes:3,station:1620,
     concept:{term:'A short history of AI',labels:L_LABELS,
       def:'AI is not new. People have worked on it for about 70 years, in waves of excitement and disappointment. What changed recently is three things arriving together: much more data, much faster computers, and a better design for handling text.',
       analogy:'Like flight: the idea was old, early attempts failed, and it only became everyday when engines, materials and know-how all came together.',
       mechanism:'Ideas (like the transformer design), data (huge amounts of text online) and computing power (special chips in data centers) all had to be ready. Chatbots became possible only when all three were.',
       classroom:'History is a defense against hype. Every wave had big promises. Asking "what can it really do today?" is the question teachers always ask about new tools.',
       misconception:'"ChatGPT invented AI." AI is about 70 years old. Chatbots became popular in 2022, but they stand on decades of earlier work.',
       timeline:[
        ['1948','Computers copy word patterns','Claude Shannon showed that picking each next letter or word from real English patterns makes English-looking text. It is an early version of "guess what comes next".'],
        ['1950','"Can machines think?"','Alan Turing proposed a test where a person chats with a hidden machine or person and tries to tell which is which.'],
        ['1956','The name "AI" is born','At a summer workshop at Dartmouth, researchers launched the field and called it artificial intelligence.'],
        ['1960s','The first chatbots','ELIZA (1966) pretended to be a therapist by matching patterns in what you typed. It understood nothing, yet many people found it convincing.'],
        ['1970s-90s','Big promises, then "AI winters"','Early hopes were bigger than what computers could do, and funding dried up more than once. In the 1980s large rule collections ("expert systems") had a short boom.'],
        ['1990s-2000s','Learning from examples wins','With more data and faster computers, learning from examples began to beat hand-written rules for many tasks.'],
        ['2012','Deep learning breaks through','A many-layered network won a big image-recognition contest by a wide margin, and this kind of AI took off.'],
        ['2017','A new design for text','Researchers introduced the "transformer", a design that handles text far better. Today’s chatbots are built on it.'],
        ['2018-2020','Language models get very large','Models trained on huge amounts of text became much more capable as they grew. These are called large language models, or LLMs.'],
        ['2022','Chatbots reach everyone','ChatGPT launched to the public in November 2022. Millions tried an LLM for the first time and AI arrived in classrooms.']],
       check:{q:'What made modern chatbots possible?',opts:['One sudden invention in 2022','Better designs, much more data and much faster computers coming together','Computers suddenly became conscious','Teachers asking for them'],ans:1,why:'Several ingredients matured and combined: new designs such as the transformer, huge amounts of text, and powerful hardware. The 2022 launch made the result public.'},
       visual:'timeline'},
     notes:{say:'"AI is about seventy years old. Chatbots arrived in 2022, but they stand on a long history of ideas, setbacks and progress."',demo:'Click any date, or use Earlier and Later.',facilitate:'Ask: which date surprised you?',misc:'That AI is brand new or that one company invented it.',caveat:'Simplified milestones; many people contributed.',transition:'"Three of those kinds learn from examples. How does a machine learn?"'}},
    {id:'c1-quiz',type:'quiz',title:'Quick Check',minutes:2,station:900,
     questions:[
      {id:'l1a',level:'Warm-up',kind:'Multiple choice',q:'What is the main difference between a rule-following system and a learning system?',opts:['Learning systems are always more accurate','A person writes the rules in one; the other finds patterns in examples','Rule systems use the internet','There is no difference'],ans:1,why:'In rule systems people write the logic. In learning systems the pattern comes from examples, so the examples matter a great deal.'},
      {id:'l1b',level:'Think it through',kind:'Multiple choice',q:'Which of these is generative AI?',opts:['A calculator','A spam filter that labels email','A chatbot that drafts a lesson plan','A fixed attendance alert'],ans:2,why:'Generative AI creates new content such as text or images. A filter picks a label and an alert follows a rule.'},
      {id:'l1c',level:'Reflect',kind:'Reflection',reflect:true,q:'Knowing AI is about 70 years old, what do you think is genuinely new right now, and what is hype?',points:['New: much larger models, huge data, fast chips, and chatbots anyone can use.','Not new: the ideas of learning from examples and of predicting text.','Hype often claims a tool does more than it demonstrably does today.']}],
     notes:{say:'Give people a moment to think, then reveal and discuss.',facilitate:'Press A to reveal an answer.'}}
  ]
});

/* ---------------------------- CHAPTER 2 · MACHINE LEARNING ---------------------------- */
CHAPTERS.push({
  id:2,key:'mllab',title:'The Machine Learning Lab',short:'Machine Learning',env:'lab',fx:'lab',door:2,topic:'Machine learning and deep learning',
  essential:'How can a machine learn something nobody wrote down as a rule?',
  objectives:['Describe the steps of machine learning in everyday words.','See that the examples shape what is learned.','Explain what "deep" means in deep learning.','Contrast picking a label with creating new content.'],
  summary:['Machine learning: collect examples, let the computer find patterns, test on new cases, improve.','Good tools need good, representative examples.','Deep learning stacks many layers of simple steps.','Generative AI builds new content from the patterns it learned.'],
  refs:['mitchell1997','lecun2015','kasneci2023'],
  guide:{facilitation:'Ask for a prediction before every preset. The central idea is "same method, different examples, different behavior".',transitions:'Bridge: "A chatbot is a kind of learning system for language. How does it write? Next building."',qual:['The demos are tiny. Real systems use far more data and are far more complex, but depend on their examples in the same way.']},
  scenes:[
    {id:'c2-ml',type:'concept',title:'Machine Learning: Learning From Examples',minutes:2,station:420,
     concept:{term:'Machine learning',labels:L_LABELS,
       def:'Machine learning is when a computer finds patterns in examples instead of being given rules. You show it many examples, and it learns what tends to go with what, so it can handle new cases.',
       explain:'Three common ways machines learn: from examples that come with the right answers (like photos labeled "cat"), from examples without answers (finding groups on its own), and by trial and error with rewards (like learning a game).',
       analogy:'Teaching a child to recognize dogs. You do not list rules about ears and tails. You point at lots of dogs, and the child works out the pattern.',
       classroom:'An early-warning tool studies past student records to spot patterns. A reading app learns which practice sets help. Both are only as good as the records they learned from.',
       misconception:'"The computer figured it out, so it must be objective." It learned from examples people chose, so gaps and mistakes in the examples can become gaps and mistakes in the tool.',
       steps:[['1. Collect examples','Many past cases: photos, records, sentences.'],['2. Add the right answers','Each example gets a label, such as "on track" or "needs support".'],['3. Find patterns','The computer looks for what the labeled examples have in common.'],['4. Test on new cases','It is tried on examples it has not seen, to see if the pattern holds.'],['5. Fix and repeat','Better examples and adjustments make it better.']],
       check:{q:'A learning tool was built from examples that mostly came from one kind of school. What is the main concern?',opts:['None: more data is always better','It may work poorly for students unlike those in the examples','It will refuse to run','It must be rule-based'],ans:1,why:'A learning system reflects its examples. If they are one-sided, the tool may be less reliable for other students.'},
       visual:'steps',demo:'c2-knn'},
     notes:{say:'"Nobody types the rule. We show examples and the computer finds the pattern."',demo:'Walk through the five steps on the right.',facilitate:'Ask: what could go wrong in step 1 or step 2?',misc:'That the result is automatically objective.',caveat:'Simplified.',transition:'"Let’s watch a computer learn."'}},
    {id:'c2-knn',type:'lab',title:'Try It: Learning From Examples',minutes:3,station:820,sim:'knn',
     lab:{purpose:'Watch a computer find a pattern from examples, and see how it changes when the examples change.',steps:['Notice the green and orange areas: the computer drew them from the examples.','Click "Move test point", then click somewhere: see how the computer decides.','Try "Mislabeled examples" and "Unrepresentative sample". See how the result changes.','Add your own examples.'],prompt:'The computer’s method never changed, only the examples. What does that say about who is responsible for a learning tool?',classroom:'A tool trained on past students inherits any gaps or mistakes in past records.'},
     notes:{say:'"Nobody typed the rule. The computer worked it out from examples. Now let’s see how easily it can be misled."',demo:'A real (very simple) learning method: a new point is labelled by the three most similar examples.',facilitate:'Ask for a prediction before each preset: "Which way will the boundary move?"',misc:'"More data always fixes it." Not if the data is wrong or one-sided.',caveat:'Real systems are far larger.',transition:'"Now: what does deep learning add?"'}},
    {id:'c2-deep',type:'concept',title:'Deep Learning: Many Layers',minutes:2,station:1220,
     concept:{term:'Deep learning',labels:L_LABELS,
       def:'Deep learning is machine learning that uses a "neural network" with many layers. Each layer does a simple step and passes its result to the next, so together they can pick up complicated patterns.',
       analogy:'An assembly line of inspectors. The first spots simple things (edges in a photo), the next combines them (shapes), the next combines those (a face).',
       classroom:'Deep learning powers speech-to-text for captions, face grouping in photo apps, translation, and the chatbots we meet next.',
       misconception:'"A neural network is a digital brain." The name was inspired by brain cells, but a neural network is mostly multiplication and addition, repeated many times.',
       steps:[['Numbers go in','A photo or a sentence is turned into numbers.'],['Layer 1 finds simple patterns','Each connection has a strength. Numbers are multiplied by strengths and added up.'],['Later layers combine them','Simple patterns become bigger patterns.'],['The last layer gives an answer','A label, a score, or the next piece of text.'],['Learning adjusts the strengths','Training nudges millions or billions of strengths so answers get better.']],
       check:{q:'In deep learning, what does "deep" refer to?',opts:['How smart the system is','The number of layers in the network','How much data is stored','How long it was trained'],ans:1,why:'"Deep" means many layers stacked one after another.'},
       visual:'steps',demo:'c2-nn'},
     notes:{say:'"A neural network is multiply, add, repeat, through many layers. Learning means adjusting the strengths of the connections."',demo:'Walk through the steps, then try the network.',misc:'That it works like a brain.',caveat:'Simplified.',transition:'"Want to see one? Here is a tiny one."'}},
    {id:'c2-nn',type:'lab',title:'Try It: A Tiny Neural Network',minutes:2,station:1620,sim:'nn',
     lab:{purpose:'See how many simple steps stacked together can produce an answer.',steps:['Move the three sliders and watch the numbers flow left to right.','Click a circle to see how its number was worked out.','Change one connection strength and see what happens to the answer.'],prompt:'We can see every number here. Why is that hard for a system with billions of connections?',classroom:'Real networks work the same way, only far larger.'},
     notes:{say:'"A neural network is multiply, add, repeat. Notice we can read every number. Imagine billions."',demo:'A real working network. The connection strengths were set by hand, not learned.',caveat:'Not trained; made for teaching.',transition:'"Learning can also create. Next demo."'}},
    {id:'c2-gen',type:'lab',title:'Try It: Picking vs. Creating',minutes:2,station:420,sim:'gen',
     lab:{purpose:'Compare choosing from a fixed menu with building something new.',steps:['On the left, change the sentence and see the single label it gets.','On the right, press Generate several times.','Notice: which side can say something it has never seen before?'],prompt:'Why is it harder to check a created answer than a menu choice?',classroom:'Drafting a rubric or email has many acceptable answers, so checking takes judgment.'},
     notes:{say:'"The left side picks from a menu. The right side builds a sentence one word at a time."',demo:'A tiny word-by-word generator built from 11 teacher comments. It really runs.',facilitate:'Ask: "Is the generated sentence true?" That leads into later chapters.',caveat:'Much simpler than real chatbots.',transition:'"Quick check, then we visit the Word Library."'}},
    {id:'c2-quiz',type:'quiz',title:'Quick Check',minutes:2,station:900,
     questions:[
      {id:'l2a',level:'Warm-up',kind:'Multiple choice',q:'In machine learning, where does the pattern come from?',opts:['A programmer writes it as a rule','The computer finds it in examples','The internet','A teacher'],ans:1,why:'In machine learning, the computer finds the pattern in examples, which is why the examples matter so much.'},
      {id:'l2b',level:'Think it through',kind:'Scenario',q:'Same learning method, new examples with more mislabeled data. What happens?',opts:['Nothing changes','The learned pattern gets worse or changes','It becomes rule-based','It fixes the labels itself'],ans:1,why:'The method learns whatever the examples show, including mistakes. Better examples mean better learning.'},
      {id:'l2c',level:'Reflect',kind:'Reflection',reflect:true,q:'What changes when a computer learns from examples instead of following instructions?',points:['Behavior comes from the examples, not from written rules.','Mistakes or gaps in the examples can become mistakes in the tool.','Someone needs to check how it works for different students.']}],
     notes:{say:'Pair discussion for the reflection.',facilitate:'Press A to reveal.'}}
  ]
});

/* ---------------------------- CHAPTER 3 · LLMs AND TOKENS ---------------------------- */
CHAPTERS.push({
  id:3,key:'language',title:'The Word Library',short:'LLMs & Tokens',env:'digital',fx:'digital',door:3,topic:'Large language models and tokens',
  essential:'If a chatbot builds its answer one small piece at a time, what does that explain about how it behaves?',
  objectives:['Say what a large language model (LLM) is.','Explain what a token is.','Describe the steps a chatbot takes to produce a reply.','Explain why the same question can get different answers.','Explain why a chatbot can lose track of earlier text.'],
  summary:['An LLM is a very large program trained to predict the next piece of text.','Text is split into tokens, turned into numbers, scored, and one token is chosen at a time.','The "creativity dial" changes how adventurous the choice is, not how much it knows.','A chatbot can only use text that fits in its window.'],
  refs:['vaswani2017','jurafsky','holtzman2020'],
  guide:{facilitation:'Keep to the five steps. Add detail only if someone asks. The aim is a clear mental picture, not vocabulary.',transitions:'Bridge: "Where does this program run, and how did it learn all this? Next building."',qual:['No lab here is a real chatbot. The splitting is approximate, and all probabilities are made-up numbers for teaching.','"One piece at a time" describes how text is produced. It does not by itself settle what these systems can or cannot do; experts still debate that.']},
  scenes:[
    {id:'c3-portal',type:'cinema',cine:'portal',title:'Into the Words',minutes:1,
     cap:['The Word Library. A monitor glows in the corner.','The camera moves toward the screen…','…and passes through it.','Inside: pieces of text, guesses and streams of data.'],
     notes:{say:'"Let’s step inside the machine. This picture is a metaphor, not a literal view."',demo:'Animated metaphor. Press S to skip.',transition:'Press →.'}},
    {id:'c3-llm',type:'concept',title:'What Is a Large Language Model?',minutes:2,station:420,
     concept:{term:'Large language model (LLM)',labels:L_LABELS,
       def:'A large language model, or LLM, is a very large program trained on huge amounts of text to predict what piece of text comes next. Chatbots such as ChatGPT, Claude and Gemini are built on LLMs. "Large" means billions of adjustable numbers inside it.',
       explain:'Because it learned from so much text, predicting the next piece lets it write essays, answer questions, translate and summarize. It is a deep-learning model: the "many layers" idea from the last building, built for language.',
       analogy:'Your phone’s "suggested next word", but vastly more powerful. It picks a word, adds it, then suggests again, hundreds of times.',
       classroom:'This is why a chatbot can write a smooth paragraph about almost anything, and also why it can be smoothly wrong.',
       misconception:'"It searches a database of facts." Usually it does not: it generates text from learned patterns. (Some products add a web search or document lookup as an extra step.)',
       steps:[['1. Split','Your text is cut into small pieces called tokens.'],['2. Turn into numbers','Each piece becomes a number, because computers work with numbers.'],['3. Score what comes next','The model gives every possible next piece a score for how likely it is.'],['4. Pick one','One piece is chosen, usually a likely one, with some chance involved.'],['5. Add it and repeat','The new piece joins the text and the loop runs again until the reply is done.']],
       check:{q:'What is the best description of how a chatbot produces a reply?',opts:['It looks up the answer in a library','It builds text one piece at a time, choosing likely next pieces','It thinks about the question like a person','It copies a stored answer'],ans:1,why:'Standard chatbots generate text step by step from learned patterns. They are not looking up a stored answer unless extra tools are added.'},
       visual:'steps',demo:'c3-tokenizer'},
     notes:{say:'"Five steps, over and over. Everything else about chatbots grows out of this loop."',demo:'Click Next step or Play all on the right.',facilitate:'Ask: "Where could a wrong fact sneak in?" (Steps 3 and 4: likely is not the same as true.)',misc:'That it looks facts up; that it thinks like a person.',caveat:'Simplified. Products add steps such as safety filters, instructions and search.',transition:'"Step 1 first: what is a token?"'}},
    {id:'c3-tokens',type:'concept',title:'Tokens: The Pieces of Text',minutes:1,station:820,
     concept:{term:'Tokens',labels:L_LABELS,
       def:'A token is a small piece of text a model works with: a whole word, part of a word, or a punctuation mark. Each token gets a number (an ID), and the model only ever sees those numbers.',
       analogy:'LEGO bricks. Common words are one big brick. A rare word is built from several small bricks.',
       classroom:'Limits and costs for AI tools are counted in tokens, not words. That is why a tool can "cut off" a long essay. Tools trained mostly on English may need more tokens for other languages.',
       misconception:'"The model reads words like I do." It works on token numbers. That is one reason it can stumble on spelling or counting letters.',
       check:{q:'Why can a chatbot struggle with "How many r’s are in strawberry?"',opts:['It cannot count','It works with tokens, not individual letters, so letters are hidden inside the pieces','It refuses','The word is too long'],ans:1,why:'Words are split into tokens that can hide individual letters. Newer models do better, but the token view explains the stumble.'},
       visual:'tokenstream',demo:'c3-tokenizer'},
     notes:{say:'"Before it does anything, your words are chopped into pieces and turned into numbers."',demo:'Figure: text to tokens to IDs to vectors (illustrative numbers).',facilitate:'Ask for a guess how many tokens their name uses, then test it in the next lab.',caveat:'Exact splits depend on the specific model.',transition:'"Try it."'}},
    {id:'c3-tokenizer',type:'lab',title:'Try It: Splitting Text Into Pieces',minutes:2,station:1220,sim:'tokenizer',
     lab:{purpose:'See how text is cut into pieces (step 1).',steps:['Click "Rare word" and notice how an unusual word breaks into several pieces.','Try "Non-English" and compare how many pieces it needs.','Switch to "Show token IDs": this number list is all the model receives.'],prompt:'Why might a chatbot struggle with spelling or counting letters if it never sees letters?',classroom:'A limit like "the tool cut off my essay" is measured in pieces, not words.'},

'use strict';
/* =====================================================================
   APP (part 1): stage, views, captions, modals, notes, cinematics
   ===================================================================== */
const stage=$('#stage');
function fit(){const vw=innerWidth,vh=innerHeight,s=Math.min(vw/1920,vh/1080);stage.style.transform=`translate(${(vw-1920*s)/2}px,${(vh-1080*s)/2}px) scale(${s})`;stage.dataset.scale=s;}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2400);}
function announce(s){$('#live').textContent='';setTimeout(()=>{$('#live').textContent=s;},30);}
const Cap={set(t){const e=$('#cap');if(!t){e.classList.add('hidden');return;}e.textContent=t;e.classList.toggle('hidden',!S.prefs.captions);announce(t);}};
function fade(on,ms=450){const f=$('#fade');ms=S.prefs.reduced?0:ms;f.style.transitionDuration=ms+'ms';f.classList.toggle('on',on);return sleep(ms+20);}
async function fadeC(c,on,ms){
  fade(on,c&&c.skipping?0:ms);const total=S.prefs.reduced?0:ms;
  for(let t=0;t<total;t+=40){if(!c||c.skipping||c.dead)break;await sleep(40);}
  if(c&&(c.skipping||c.dead))$('#fade').style.transitionDuration='0ms';
}
function showTitle(html){const t=$('#title');if(!html){t.style.opacity=0;return;}t.innerHTML=html;t.style.opacity=1;}

/* ---------- views: campus world or interior environment ---------- */

    this.mode='campus';$('#campus').classList.remove('hidden');$('#env').classList.add('hidden');$('#env').style.transform='';

    Env.set(name);FX.set(fx);
  },
  avatarCampus(x,opts={}){Avatar.mount(Campus.near,x,opts.bottom??135,opts.scale??.9);Avatar.el.style.opacity=1;},

/* ---------- modal system ---------- */
const Modal={
  prevFocus:null,onClose:null,
  open(title,content,o={}){
    const ov=$('#overlay');this.prevFocus=document.activeElement;this.onClose=o.onClose||null;
    ov.innerHTML='';
    const m=h('div',{class:'modal',role:'dialog','aria-modal':'true','aria-labelledby':'mtitle',style:o.width?{width:o.width}:{}},
      h('button',{class:'btn x',type:'button',onclick:()=>Modal.close(),'aria-label':'Close dialog'},'Close ✕'),
      h('h2',{id:'mtitle'},title),content);
    ov.append(m);ov.classList.add('on');ov.onclick=e=>{if(e.target===ov)Modal.close();};
    setTimeout(()=>{const f=$('button, [href], input, select, textarea',m);if(f)f.focus();},30);
  },
  close(){
    const ov=$('#overlay');if(!ov.classList.contains('on'))return;
    ov.classList.remove('on');ov.innerHTML='';
    if(this.onClose){const f=this.onClose;this.onClose=null;f();}
    if(this.prevFocus&&this.prevFocus.focus)try{this.prevFocus.focus();}catch(e){}
  },
  get isOpen(){return $('#overlay').classList.contains('on');}
};
