CHAPTERS.push({
  id:2,key:'language',title:'Inside the Language Machine',short:'Token by Token',env:'digital',fx:'digital',door:2,labEnv:'lab',labFx:'lab',
  topic:'Token by Token',
  essential:'If an AI system produces its responses token by token, what does that explain about its behavior, and what questions about understanding remain unresolved?',
  objectives:['Describe how text becomes tokens, token IDs and embeddings.','Explain, conceptually, what attention and the transformer architecture do.','Distinguish training from inference.','Interpret a next-token probability distribution and explain sampling, greedy decoding and temperature.','Explain how a limited context window changes what a model can use.','Explain why fluent output is not evidence of factual accuracy, and why next-token prediction alone is not a complete account of capability.'],
  summary:['Text → tokens → IDs → embeddings → transformer layers → probabilities for the next token.','Training adjusts weights; inference uses fixed weights to sample one token at a time.','Temperature and sampling change variety, not knowledge.','A model only conditions on what fits in its context window.','Fluency ≠ accuracy; "just predicting the next token" explains the mechanism but not everything about capability, and questions of understanding remain debated.'],
  refs:['vaswani2017','sennrich2016','mikolov2013','holtzman2020','liu2024','bender2020','mitchell2023','petrov2023','jurafsky'],
  guide:{facilitation:'This is the longest chapter. Pace by laboratory: after each one, ask a prediction question. Use Dive Deeper selectively; the main thread does not require the mathematics.',transitions:'Close by naming the open questions (understanding, reasoning). Bridge: "If the system is producing plausible text, what happens when plausible and true come apart? The Digital Library."',qual:['No lab in this chapter runs a real LLM. The tokenizer is approximate; all probabilities and logits are illustrative.','"Predicting the next token" describes the training objective and the generation loop. It does not by itself settle how the model represents or computes what it does. That remains an active research and philosophical debate.','Many deployed assistants add steps beyond a raw language model (instruction tuning, reinforcement learning from human feedback, tool use, retrieval, safety filters).']},
  scenes:[
    {id:'c2-portal',type:'cinema',cine:'portal',title:'Through the Screen',minutes:1,
     cap:['The Language Machine Lab. A monitor glows in the dark.','The camera moves toward the screen…','…and passes through it.','Inside: tokens, probabilities and streams of data.'],
     notes:{say:'"Let’s go inside the machine. Imagine we could shrink ourselves and enter the text a model is processing. This is what that world might look like, a metaphor, not a literal picture."',demo:'Scripted animation. Press S to skip. It ends with the digital landscape, our setting for the rest of the chapter.',caveat:'The landscape is an artistic metaphor, not a depiction of how any particular system is implemented.',transition:'Press → for the first concept: tokens.'}},
    {id:'c2-tokens',type:'concept',title:'Tokens and Token IDs',minutes:2,station:420,
     concept:{term:'Large language model · token · token ID',
       def:'A large language model (LLM) is a neural network trained on very large amounts of text to predict what comes next. It does not read letters or words directly: text is first split into tokens (words, word pieces, punctuation), and each token is replaced by an integer ID.',
       explain:'Splitting text into tokens keeps the vocabulary manageable (tens of thousands of pieces) while still allowing any text to be represented. Common words are often one token; rare or long words break into several pieces. The model’s “length” limits, speed and cost are all measured in tokens, not words.',
       analogy:'Tokens are like LEGO bricks. You can build any sentence, but the bricks are standard pieces, not whole objects. A common word is a single big brick; a rare word is assembled from smaller bricks.',
       mechanism:'A tokenizer (often byte-pair encoding, which repeatedly merges frequent pairs of symbols) maps text to a list of IDs, for example “Teachers love learning” → [12874, 364, 1842, 3218, 278] (illustrative). The model only ever sees these numbers.',
       classroom:'Token limits affect how much of a long reading you can paste. Tokenizers trained mostly on English tend to need more tokens for some other languages (Petrov et al., 2023), which can mean higher cost and less room in the context window for multilingual users.',
       misconception:'"The model reads words the way I do." It operates on token IDs. This is one reason letter-counting and fine spelling tasks can be surprisingly hard for LLMs.',
       discuss:'Which student groups or languages might be disadvantaged if a tool’s tokenizer fragments their language into many tokens?',
       check:{q:'Why can an LLM find "How many r’s in strawberry?" harder than it looks?',opts:['It cannot do arithmetic','It processes tokens, not individual letters, so letter-level structure is not directly visible','It is not allowed to answer','Strawberry is not in its vocabulary at all'],ans:1,why:'Words are split into tokens that may hide individual letters. Models are getting better at such tasks, but the token-level view explains why they can stumble.'},
       visual:'tokenstream',demo:'c2-tokenizer'},
     deeper:{title:'Byte-pair encoding in one paragraph',html:`<p>Start with a vocabulary of single characters (or bytes). Count adjacent symbol pairs across a training corpus, merge the most frequent pair into a new symbol, and repeat until the vocabulary reaches a target size (Sennrich et al., 2016). Frequent words end up as single symbols; rare words decompose into learned pieces.</p><p>Each token is then mapped to an integer ID, and later to an <b>embedding vector</b>. IDs carry no meaning by themselves: ID 12874 is not “bigger” than ID 364.</p>`},
     notes:{say:'"Before an LLM does anything, your words are chopped into pieces and turned into numbers. That choice has consequences for cost, length and fairness."',demo:'The figure shows the pipeline: text → tokens → IDs → vectors. IDs and bars are illustrative.',facilitate:'Ask someone to guess how many tokens their name will use, then test it in the lab.',misc:'Tokens = words; the model understands letters; IDs mean something numerically.',follow:'What are the equity implications of token-based pricing and limits?',caveat:'Exact tokenization depends on the specific model.',transition:'"Let’s try a tokenizer."'}},
    {id:'c2-tokenizer',type:'lab',title:'Laboratory A: Tokenizer',minutes:3,station:820,sim:'tokenizer',
     lab:{purpose:'Type text and see it divided into token-like pieces, with illustrative IDs.',steps:['Try the preset "Rare word": observe how an uncommon word splits.','Try "Non-English" and compare characters per token with an English sentence.','Toggle to token IDs: this is all the model receives.','Predict the token count before typing.'],prompt:'What does the token view tell you about why models might struggle with spelling, counting letters, or rare names?',classroom:'Useful for helping students understand “why did the tool cut off my essay?”: limits are in tokens.'},
     notes:{say:'"Type anything. Notice that some words are one piece and some shatter."',demo:'APPROXIMATE: greedy longest-match against a small built-in vocabulary. It is not any production tokenizer, and the IDs are hashes. It reproduces the qualitative behavior: common = whole; rare = pieces.',facilitate:'Try the instructor’s own name and a technical term from your discipline.',misc:'Participants may assume the splits shown are exactly what GPT-style models do. State clearly they are not.',follow:'How would you explain “token” to a parent in one sentence?',caveat:'Real tokenizers (BPE variants, SentencePiece) learn their vocabularies from data; vocabularies range from ~30k to 250k+ pieces.',transition:'"Tokens become vectors, and vectors interact. That is the transformer."'}},
    {id:'c2-transformer',type:'concept',title:'Embeddings, Attention and Transformers',minutes:3,station:1220,
     concept:{term:'Embedding · attention · transformer',
       def:'An embedding is a learned list of numbers (a vector) that represents a token. Attention is a mechanism that lets each token weigh and combine information from other tokens in the context. A transformer is a neural network architecture that stacks many attention and feed-forward layers.',
       explain:'Embeddings place tokens in a space where similar usage tends to mean nearby vectors. Attention then lets “it” in “the trophy didn’t fit in the suitcase because it was too big” draw on “trophy.” Stacking many layers lets the model build up from local patterns to more abstract ones. The final layer produces a score for every token in the vocabulary.',
       analogy:'Imagine a seminar where every word is a participant. Attention is each participant deciding whom to listen to for the next sentence, and listening more closely to the most relevant voices. Layers are rounds of discussion.',
       mechanism:'Token IDs → embeddings (plus position information) → repeat [self-attention → feed-forward] N times → scores (logits) for every vocabulary token → softmax → probabilities. All parameters (embeddings, attention weights, feed-forward weights) are learned during training (Vaswani et al., 2017).',
       classroom:'When a chatbot “forgets” something you said earlier or misreads a pronoun, the attention and context mechanisms are in play. When you refer to a document the model has not been given, there is nothing to attend to.',
       misconception:'"Attention means the model is paying attention like a person." It is a name for a specific weighted-averaging computation, not a claim about consciousness or focus.',
       discuss:'The model’s knowledge lives in billions of numbers, not in sentences. What are the implications for checking where a claim came from?',
       check:{q:'What does "attention" do inside a transformer?',opts:['It lets the model feel interest in a topic','It computes weights that determine how much each token draws on other tokens when building its representation','It deletes irrelevant tokens permanently','It checks whether the output is true'],ans:1,why:'Attention is a learned, weighted mixing of information across tokens. It is a computation, not awareness, and it does not check truth.'},
       visual:'transformer',demo:'c2-embed'},
     deeper:{title:'Scaled dot-product attention',html:`<p>For each token the model computes a <b>query</b> q, a <b>key</b> k and a <b>value</b> v by multiplying its embedding by learned matrices. For a whole sequence (stacked as matrices Q, K, V):</p><span class="math">Attention(Q,K,V) = softmax( Q Kᵀ / √dₖ ) V</span><p>In plain language: score how well each query matches each key (dot product), divide by √dₖ to keep numbers stable, turn scores into weights that sum to 1 (softmax), and take the weighted average of the values. Transformers run many such “heads” in parallel in each layer.</p><p><b>Why embeddings are learned vectors:</b> no one hand-assigns coordinates. They start random and are adjusted by training so that vectors help predict text; regularities such as clusters of related words emerge (cf. Mikolov et al., 2013 for earlier word-embedding methods).</p>`},
     notes:{say:'"Three ideas: words become vectors; vectors talk to one another through attention; and we stack that many times."',demo:'Click the blocks in the diagram. Optional labs on the next two scenes let you manipulate an embedding map and attention weights.',facilitate:'Use the seminar analogy; ask how a participant decides whom to listen to.',misc:'Attention = understanding; embeddings are dictionaries; transformers are databases of facts.',follow:'Why might a longer document make it harder for the model to find the relevant sentence?',caveat:'Conceptual level only. Many variants exist (encoder, decoder, mixture-of-experts); this is a decoder-style sketch.',transition:'"If the optional labs interest you, open them. Otherwise: how do these systems get trained, and what happens when you chat?"'}},
    {id:'c2-embed',type:'lab',title:'Optional: Embedding Map',minutes:2,optional:true,station:420,sim:'embed',
     lab:{purpose:'Explore how nearby points represent similar usage, and how vector offsets can capture relationships (in a toy).',steps:['Click two words to see their distance.','Press "king − man + woman" and then "paris − france + italy".','Notice which clusters form.'],prompt:'If meaning is geometry, what are the risks when training text contains stereotypes?',classroom:'Embeddings power search and recommendation in education software, and encode biases present in text.'},
     notes:{say:'Optional. Use to make embeddings tangible.',caveat:'Hand-placed 2D coordinates. Real embeddings: hundreds to thousands of learned dimensions; analogies are only approximate.'}},
    {id:'c2-attn',type:'lab',title:'Optional: Attention Explorer',minutes:2,optional:true,station:820,sim:'attention',
     lab:{purpose:'See attention as weights over other tokens.',steps:['Select "it" as the query word and observe where the weight goes.','Change the sharpness slider.','Select "big".'],prompt:'How would you know whether a real model resolved the pronoun for the right reason?',classroom:'Helps explain why ambiguous prompts produce ambiguous responses.'},
     notes:{say:'Optional.',caveat:'Hand-set vectors illustrate the scaled dot-product formula; trained models learn them and use multiple heads and layers.'}},
    {id:'c2-train',type:'concept',title:'Training, Inference and Next-Token Prediction',minutes:2,station:1220,
     concept:{term:'Training · inference · conditional probability',
       def:'Training is the process that adjusts a model’s weights so it predicts text better. Inference is using the finished model: at each step it computes a probability for every possible next token given the tokens so far, then one token is chosen and appended.',
       explain:'During training, the model reads huge amounts of text and is repeatedly asked to predict the next token; errors nudge the weights. During inference the weights are frozen. A chat reply is produced by running the model, picking a token, appending it, and running it again, hundreds of times.',
       analogy:'Training is years of studying; inference is sitting the exam, one word at a time, with no ability to change what you studied. (Your chat does not rewrite the weights.)',
       mechanism:'The model outputs P(next token | previous tokens). Selecting the highest-probability token every time is greedy decoding; sampling picks randomly in proportion to probability, so the same prompt can yield different replies. Chaining these probabilities gives the probability of a whole passage.',
       classroom:'Ask students why asking the same question twice may give different answers (sampling), and why the model does not remember last week’s chat unless the product stores and re-supplies it.',
       misconception:'"The AI learns from our conversation as we talk." In standard use the model’s weights are not updated by your chat; products may store history and re-send it as context, and developers may later use data to train future versions depending on their terms.',
       discuss:'If the model’s knowledge is frozen at training time, what kinds of classroom questions should we not expect it to answer reliably?',
       check:{q:'Which statement best distinguishes training from inference?',opts:['Training happens every time you press Enter','Training adjusts the weights; inference uses fixed weights to generate output token by token','Inference is when the model learns new facts from you','There is no difference'],ans:1,why:'Training changes the model; inference runs it. The product around the model may keep history, but that is not weight updating.'},
       visual:'pipeline',demo:'c2-next'},
     deeper:{title:'Conditional probability and the training objective',html:`<p>A language model defines a distribution over sequences by the chain rule:</p><span class="math">P(w₁,…,wₙ) = ∏ₜ P( wₜ | w₁,…,wₜ₋₁ )</span><p>Training minimizes the average <b>cross-entropy</b> (negative log-likelihood) of the true next token:</p><span class="math">L = − (1/n) Σₜ log P( wₜ | w₁,…,wₜ₋₁ )</span><p>Lower L means the model puts more probability on what actually came next. Note what the objective does <i>not</i> directly measure: truth, helpfulness or safety. Later training stages (instruction tuning, human feedback) add other signals.</p>`},
     notes:{say:'"Two phases: build the model, then use it. Everything the model ‘knows’ was baked in during phase one."',demo:'The figure shows the training loop and the inference loop. The inference loop is the one that runs when you chat.',facilitate:'Ask participants to explain, in their own words, why the same prompt can yield different answers.',misc:'Continuous learning from chats; the model is a search engine; it has a database of facts.',follow:'What does the loss function reward, and what does it not reward?',caveat:'Modern assistants undergo additional training stages and may use retrieval or tools at inference.',transition:'"Let’s watch the probabilities."'}},
    {id:'c2-next',type:'lab',title:'Laboratory B: Next-Token Predictor',minutes:2,station:420,sim:'nexttoken',
     lab:{purpose:'Build a sentence by choosing tokens and watch the distribution change.',steps:['Predict which bar is tallest, then click a bar to choose that token.','Choose a low-probability token such as "banana" and watch how the rest of the sentence changes.','Use Greedy and Sample, and compare the product of probabilities.'],prompt:'Why might the most probable sentence not be the best sentence?',classroom:'Shows students that the same prompt has many plausible continuations, and that "plausible" is the model’s standard.'},
     deeper:{title:'The chain rule in action',html:`<p>Each time you pick a token, the lab multiplies its probability into a running product, exactly the chain rule above. Because each factor is below 1, longer sequences have smaller probabilities even when every step is sensible.</p><p>In real models the support is the entire vocabulary (e.g., ~100,000 tokens), and many tiny probabilities add up. Decoding methods such as top-k and nucleus (top-p) sampling truncate the long tail (Holtzman et al., 2020).</p>`},
     notes:{say:'"At every step the model holds a probability distribution. Our job as users is to remember that what comes out is one draw."',demo:'ILLUSTRATIVE probabilities, hand-written for a handful of contexts. They are not from any real model. The running product shows the chain rule.',facilitate:'Have the class vote on each choice. Try the 5% token and note how it redirects the sentence.',misc:'That the displayed numbers come from a real model; that low-probability tokens are errors (they may be fine).',follow:'How do creative writing and fact retrieval differ in what a good distribution looks like?',caveat:'Fully illustrative; context table is tiny.',transition:'"What if we could turn a dial on randomness?"'}},
    {id:'c2-temp',type:'lab',title:'Laboratory C: Temperature Simulator',minutes:3,station:820,sim:'temperature',
     lab:{purpose:'See how temperature reshapes the distribution and changes token selection across repeated generations.',steps:['Set T near 0 (greedy) and generate 10: what do you get?','Raise T to 1 and 2, generate 10 each time, compare tallies.','Notice entropy and top-token share as T changes.'],prompt:'For what classroom tasks would you want low temperature? High temperature?',classroom:'Explains why brainstorming tools feel creative at high temperature and why reference-style answers should be low-variance but still need verification.'},
     deeper:{title:'How softmax with temperature works',html:`<p>The network outputs raw scores <b>logits</b> zᵢ. Softmax converts them into a probability distribution:</p><span class="math">pᵢ = exp( zᵢ / T ) / Σⱼ exp( zⱼ / T )</span><p>T = 1 is the model’s raw distribution. As T → 0 the largest logit dominates (greedy decoding). As T grows, the distribution flattens toward uniform. Dividing by T <i>reshapes</i> probabilities; it adds no knowledge.</p><p><b>Entropy</b> H = −Σ pᵢ log₂ pᵢ measures uncertainty: higher means more spread out.</p>`},
     notes:{say:'"Temperature is a dial for how adventurous the sampling is. It does not make the model smarter or more accurate."',demo:'SIMPLIFIED SIMULATION: genuine softmax math on illustrative logits for one prompt. Sampling is random each time, so tallies fluctuate.',facilitate:'Ask for a prediction at T=2: which token will appear that rarely appears at T=0.5?',misc:'High temperature = more creative thinking; low temperature = more truthful.',follow:'If temperature 0 gives identical answers every time, does that make them correct?',caveat:'Many products hide temperature or tune it; other sampling settings (top-p) also matter.',transition:'"One more limit: how much text can the model see at once?"'}},
    {id:'c2-context',type:'lab',title:'Laboratory D: Context Window Experiment',minutes:2,station:1220,sim:'context',
     lab:{purpose:'See how limiting the available context changes what a model can use.',steps:['Slide the window narrower until the quiz-day message falls out.','Read the scripted reply before and after.','Press "Repeat key fact near the end" to see a mitigation.'],prompt:'How should you structure long prompts, and what should you re-state, when working with a limited context window?',classroom:'Explains why pasting an entire textbook may not work, and why summaries in long chats can drop details.'},
     deeper:{title:'Context length, cost and using the middle',html:`<p>A model attends over at most its context-window length of tokens. In standard self-attention the work grows roughly with the <b>square</b> of the sequence length, one reason very long contexts are expensive.</p><p>Even when text fits in the window, models do not always use all of it equally well: studies have found performance can depend on where relevant information sits, with weaker use of material in the middle of long inputs (Liu et al., 2024). Fitting in the window is necessary, not sufficient.</p>`},
     notes:{say:'"The model cannot use what is not in its window, and sometimes struggles even with what is."',demo:'SCRIPTED. No model runs. Token counts are approximated and the reply is pre-written to show the principle.',facilitate:'Ask: "What would a human assistant do if they could not remember the first half of the meeting?" Then: "What does a model do?"',misc:'The model “remembers” everything said in a conversation; bigger window = perfect recall.',follow:'What should you do when a long chat starts giving inconsistent answers?',caveat:'Real behavior varies by model and task; the scripted reply is a simplification.',transition:'"We have been talking about mechanisms. One more big idea: fluency versus truth."'}},
    {id:'c2-fluent',type:'concept',title:'Fluent Is Not the Same as Accurate',minutes:1,station:1620,
     concept:{term:'Fluency, accuracy and the open question of understanding',
       def:'Fluency is how natural and coherent text sounds. Accuracy is whether its claims are true. A language model is trained to produce probable text, so it can be fluent without being accurate, and nothing in fluent phrasing signals which statements are reliable.',
       explain:'Because generation selects likely continuations, the model can produce a confident-sounding sentence even where its training data contained little or conflicting information. On the other hand, “it only predicts the next token” is not a complete explanation of what these systems can do: learning to predict text well appears to require capturing grammar, facts, and patterns of reasoning to some degree.',
       analogy:'A well-read debater can sound authoritative on any topic. How well-argued they sound tells you little about whether they have checked their facts.',
       mechanism:'The training objective rewards matching the statistics of text, not verifying claims. Later training stages can improve factuality and refusals, and tools such as retrieval can supply sources, but the underlying generator remains probabilistic.',
       classroom:'Teach students (and ourselves) to treat AI output as a draft to verify, not a source of record. Fluency is a property of presentation, not evidence.',
       misconception:'Two opposite errors: (1) “It’s just autocomplete, so it can’t do anything real” and (2) “It sounds like it understands, so it does.” Researchers disagree about what “understanding” means for these systems, and the question remains open.',
       discuss:'What would count as evidence that a system understands something? Is producing correct, flexible answers enough, or does understanding require more?',
       check:{q:'Which statement is best supported?',opts:['A confident, fluent answer is probably correct','Fluent text shows the model produced likely-seeming language; accuracy must be checked separately','Because it predicts tokens, a language model can’t do anything useful','Language models understand exactly as humans do'],ans:1,why:'Fluency does not verify content. The other options overstate: the token-prediction account is incomplete rather than dismissive, and human-like understanding is contested, not established.'},
       visual:'halluc'},
     deeper:{title:'Philosophical disagreements about machine understanding',html:`<p>Researchers hold genuinely different views, and this is not settled:</p><ul><li><b>Form-versus-meaning view:</b> a system trained only on text form lacks access to meaning grounded in the world and communicative intent (Bender &amp; Koller, 2020).</li><li><b>Emergent-capability view:</b> predicting text at scale may force models to build internal structures that track aspects of the world and reasoning.</li><li><b>Deflationary middle:</b> the question may depend on what “understanding” is taken to mean; existing tests are contested. Mitchell &amp; Krakauer (2023) survey the debate and argue for developing new ways of studying intelligence that may differ from human cognition.</li></ul><p>For teaching: avoid presenting any one view as established fact. The practical lesson is shared by all positions: <b>verify outputs and match trust to evidence.</b></p>`},
     notes:{say:'"There are two lazy stories about language models: ‘just autocomplete’ and ‘basically a mind.’ Both overreach. The honest position is that we have a powerful text generator whose reliability we must check and whose inner workings are still being studied."',demo:'The figure previews Chapter 3: plausibility can stay high while verification fails.',facilitate:'Invite disagreement. Do not resolve the understanding question; model intellectual humility.',misc:'Both extremes above.',follow:'What evidence would change your mind either way?',caveat:'This is an open research debate. Present positions with attribution.',transition:'"Let’s check what we’ve got."'}},
    {id:'c2-quiz',type:'quiz',title:'Check Your Understanding: Chapter 2',minutes:1,station:900,
     questions:[
      {id:'q2a',level:'Foundational',kind:'Multiple choice',q:'What is a token?',opts:['Always one whole word','A unit of text (a word, word piece or symbol) that the model processes as an ID','A password for the AI service','A single letter'],ans:1,why:'Tokens are the model’s units; they may be whole words, parts of words or punctuation, each mapped to an integer ID.'},
      {id:'q2b',level:'Applied',kind:'Prediction',q:'You raise temperature from 0.2 to 1.5 for the same prompt. What is most likely?',opts:['Answers become more accurate','Replies become more varied and lower-probability tokens are chosen more often','Replies become identical every time','The model learns from the prompt'],ans:1,why:'Higher temperature flattens the distribution, increasing variety. It does not add knowledge or accuracy.'},
      {id:'q2c',level:'Applied',kind:'Application scenario',q:'A teacher pastes a very long document and asks about a detail early in it. The answer is wrong. Which is a plausible contributing factor and the best response?',opts:['The model is lying on purpose; stop using it','The text may exceed or strain the context window; re-ask with the relevant excerpt and verify against the source','The model has refused to read documents','Higher temperature will fix it'],ans:1,why:'Limited context or weak use of long inputs are common issues. Supplying the relevant excerpt and verifying are sound practices. The model is not deliberately deceiving.'},
      {id:'q2d',level:'Challenging',kind:'Misconception identification',q:'Which is the most defensible statement about "understanding"?',opts:['Fluent output proves the model understands like a human','Because it predicts tokens, it definitely has no internal representations of anything','Whether and in what sense such systems understand is debated; fluency alone is not decisive evidence','Understanding is easy to measure with a single test'],ans:2,why:'Experts disagree. Both "obviously understands" and "obviously cannot" overstate what is established.'},
      {id:'q2e',level:'Reflection',kind:'Reflection',reflect:true,q:'If an AI system produces its responses token by token, what does that explain about its behavior, and what questions about understanding remain unresolved?',
       points:['Explains: variability, sensitivity to wording and context, fluent errors, dependence on training data and context.','Does not settle: whether internal representations amount to understanding; how capabilities such as reasoning emerge; how reliable they are in new situations.','Practical stance: treat output as hypotheses to verify, and match trust to evidence and stakes.']}],
     notes:{say:'Take Q2e as a think–pair–share. There is no single correct answer; use the considerations as prompts.',facilitate:'Reveal answers with A. For Q2e the "Reveal considerations" button shows perspectives, not a key.'}}
  ]
});

/* ---------------------------- CHAPTER 3 · THE DIGITAL LIBRARY ---------------------------- */
CHAPTERS.push({
  id:3,key:'library',title:'The Digital Library',short:'Hallucinations',env:'library',fx:'library',door:3,
  topic:'Hallucinations',
  essential:'Why might a highly capable language model generate a persuasive explanation that is factually incorrect?',
  objectives:['Define hallucination and give classroom-relevant examples (fabricated citations, invented quotations, inaccurate summaries).','Explain why plausibility and verification are different.','Use a repeatable routine to verify a citation and a claim against a source.','Describe retrieval-augmented generation and what it does and does not fix.','State educators’ verification responsibilities.'],
  summary:['Hallucination: generated content that is unsupported by, or contradicts, reliable sources or the provided input.','Cause (in part): the generator is optimized for plausible text, with gaps in data and no built-in fact check.','Fluent tone is not a reliability signal.','Verify with independent sources; ask for provenance; check that the source actually supports the claim.','Retrieval grounding helps but does not eliminate errors.'],
  refs:['ji2023','lewis2020','mata2023','pashler2008','kasneci2023','miao2023'],
  guide:{facilitation:'Keep a skeptical but not cynical tone: the aim is calibrated trust. Have participants commit to predictions before reveals.',transitions:'Bridge: "We have been checking AI. What happens when no one checks, because the recommendation comes with authority? The Decision Observatory."',qual:['Definitions of "hallucination" vary; some researchers prefer terms like "confabulation" or "fabrication" to avoid implying perception. This course uses the common term.','The four real citations in the Citation Detective were selected for being well known; confirm any citation before reuse.','The fictional citations and source excerpts are invented for teaching and are labeled as such.']},
  scenes:[
    {id:'c3-halluc',type:'concept',title:'What Is a Hallucination?',minutes:2,station:420,
     concept:{term:'Hallucination (fabrication, confabulation)',
       def:'In AI, a hallucination is generated content that is not supported by reliable sources or by the input the system was given, yet is presented fluently as if it were true. Examples: invented citations, fabricated quotations, wrong summaries of a document, or confident answers about things the model has no information on.',
       explain:'Language models generate text that fits learned patterns. When a fact is rare, missing or ambiguous in the training data, the model can still produce a plausible-sounding completion. A citation has a very regular form (authors, year, title, journal, pages), so a model can easily generate one that looks right without any record of it existing. Errors also arise when summarizing: details can be dropped, merged or invented.',
       analogy:'It’s like a very good improv actor asked to play a librarian. They know exactly how librarians talk and can produce a convincing call number on the spot. Convincing and catalogued are two different things.',
       mechanism:'The decoding loop always produces a next token; unlike a database, there is no built-in “no record found.” Training and later tuning can teach abstention and improve factuality, but they reduce rather than eliminate unsupported output. Causes discussed in the literature include gaps or errors in training data, the training objective, and decoding choices (Ji et al., 2023).',
       classroom:'In 2023, attorneys in Mata v. Avianca submitted a court brief citing cases that a chatbot had invented; the court sanctioned them. Teachers face the same risk with AI-written reading lists, quotations and lesson content.',
       misconception:'"If it gives a citation, it must have looked it up." Standard chat models do not consult a library unless they are connected to retrieval or search tools, and even then they can mis-describe what they found.',
       discuss:'Which tasks in your teaching are most vulnerable to fabricated details? What is your checking routine today?',
       check:{q:'A chatbot provides a perfectly formatted citation with authors, journal, volume and pages. What does that format tell you?',opts:['The source exists','The text matches the typical form of a citation; existence must be checked independently','The journal approved the claim','The chatbot searched the web'],ans:1,why:'Format is easy to imitate. Verify the article in a library database, publisher site or DOI resolver.'},
       visual:'halluc',demo:'c3-citation'},
     deeper:{title:'Uncertainty versus confidence',html:`<p>Two different things are easily conflated:</p><ul><li><b>Epistemic uncertainty</b>: the model (or we) lack knowledge, which more data could in principle reduce.</li><li><b>Stated confidence</b>: how assured the output sounds. This is a property of the generated wording, which is not automatically tied to the model’s internal uncertainty.</li></ul><p>A token probability from the model is not the same as the probability a <i>claim</i> is true: a claim spans many tokens, and a well-calibrated model is one where, among statements it assigns ~80% confidence, about 80% are true. Calibration is measurable and can be poor, particularly after instruction-tuning stages that favor assured, helpful-sounding replies. Practical consequence: <b>do not use tone as a proxy for reliability.</b></p>`},
     notes:{say:'"Here is a book that looks wonderful, with a quote and a page number. Let’s find out whether it exists."',demo:'In the figure, press "Source supports it" and "Source does not exist": the plausibility bar stays high either way while the verification bar changes. Scripted illustration with fictional text.',facilitate:'Ask participants to share a time an AI tool or a person gave them something plausible but wrong.',misc:'"Hallucinations are rare glitches that newer models have eliminated." They are reduced in some settings but remain a known limitation.',follow:'How could a school policy require disclosure and verification of AI-assisted materials?',caveat:'Rates of hallucination vary by model, task and prompt; avoid quoting precise rates without a current source.',transition:'"Let’s investigate some citations."'}},
    {id:'c3-citation',type:'lab',title:'Laboratory A: Citation Detective',minutes:3,station:820,sim:'citation',
     lab:{purpose:'Judge eight citations (four real, four fictional), then reveal the verification evidence.',steps:['Mark each citation: looks real or looks fabricated.','Discuss with a neighbor what cues you used.','Reveal the evidence one by one and compare.'],prompt:'Which cues were reliable? Which were misleading? What is your standard routine to verify a source?',classroom:'A ready-made activity for students: have them verify citations from an AI-generated bibliography.'},
     notes:{say:'"Real and fabricated look equally polished. Your judgment from formatting alone is going to be about as good as a coin flip."',demo:'SCRIPTED. Four entries are fictional teaching examples (e.g., invalid DOI prefix, impossible arXiv month, invalid ISBN, real journal with nonexistent article). Four are real, well-known works whose identifiers you can resolve live.',facilitate:'Reveal the evidence for a real one and demonstrate the lookup live (doi.org, arXiv, library database).',misc:'That fictional-looking names are the tell; they are not.',follow:'What if the DOI resolves but the article is about something else?',caveat:'Confirm the real citations yourself before reuse; this tool does not replace a library database.',transition:'"Next: does confidence track correctness?"'}},
    {id:'c3-confidence',type:'lab',title:'Laboratory B: Confidence Versus Accuracy',minutes:2,station:1220,sim:'confidence',
     lab:{purpose:'Predict which equally confident claims are accurate.',steps:['Choose TRUE or FALSE for each claim.','Reveal the evidence.','Compare the confidence of the wording with the actual accuracy.'],prompt:'If tone does not signal reliability, what does?',classroom:'Students can write their own claim sets and swap them.'},
     notes:{say:'"Every claim is phrased with total certainty. Let’s see how many deserve it."',demo:'SCRIPTED. Claims are human-written in a confident AI-like tone. Evidence is summarized; the learning-styles item cites Pashler et al. (2008).',facilitate:'Ask for a show of hands per claim before revealing.',misc:'Participants may feel misled; remind them that the tone is designed to be uniform.',follow:'What kinds of claim are most likely to be wrong yet widely repeated?',caveat:'These are well-known examples; a real model may or may not get these particular ones right.',transition:'"Next: practice checking whether a source really supports a claim."'}},
    {id:'c3-verify',type:'lab',title:'Laboratory C: Research Verification Challenge',minutes:2,station:1620,sim:'verify',
     lab:{purpose:'Check whether a source supports an AI-style summary of it.',steps:['Read the claim, then the source excerpt.','Select the problems you can support from the excerpt only.','Check your judgments and compare the rewritten claim.'],prompt:'How would you adapt this routine for students in your grade level or subject?',classroom:'The same four steps (locate, read, compare, rewrite) work for students checking any source.'},
     notes:{say:'"A real citation can still be misrepresented. The test is whether the passage says what the summary says."',demo:'SCRIPTED fictional excerpt. Two distractor options are not supported by the excerpt: unsupported criticism is also a verification error.',facilitate:'Have participants justify each selected issue with a quoted phrase from the excerpt.',misc:'Over-correcting: asserting problems the source does not establish.',follow:'How would you teach students to report limitations of a study accurately?',caveat:'Fictional source; statistical details are simplified.',transition:'"So how are builders trying to reduce this problem?"'}},
    {id:'c3-rag',type:'concept',title:'Grounding: Retrieval and Provenance',minutes:1,station:420,
     concept:{term:'Retrieval-augmented generation (RAG) · provenance',
       def:'Retrieval-augmented generation first retrieves relevant documents from a trusted collection, then asks the model to answer using them. Provenance is the traceable origin of information: where a statement came from and whether you can check it.',
       explain:'RAG gives the model text to work from, so answers can cite passages you can open. It does not make the model infallible: retrieval can miss the right document, and the model can still misquote, over-generalize or ignore what it retrieved.',
       analogy:'Closed-book exam versus open-book exam with a librarian. The open-book student can point to page numbers, but can still misread the page.',
       mechanism:'Query → search an index (often by embedding similarity) → top documents added to the prompt → the model generates an answer that should draw on them (Lewis et al., 2020).',
       classroom:'A district assistant that answers from its own policy documents and shows citations is more checkable than a general chatbot. Educators still verify the cited passage and the date of the policy.',
       misconception:'"If an AI shows sources, it is correct." Sources show where to check; they do not prove the answer matches them.',
       discuss:'What should a vendor be able to show you about where its answers come from?',
       check:{q:'A district adds retrieval of its policy documents to a chatbot. Which risk remains?',opts:['None, since the answers are now guaranteed correct','The model may misstate or over-generalize the retrieved text, or retrieval may miss the relevant document','Retrieval makes the model forget how to write','Policies cannot be searched'],ans:1,why:'Grounding reduces unsupported answers but does not guarantee fidelity. Check the cited passage.'},
       visual:'rag'},
     deeper:{title:'The retrieval-augmented formulation',html:`<p>RAG marginalizes over retrieved documents <i>z</i>:</p><span class="math">p(y | x) ≈ Σᵣ p(z | x) · p(y | x, z)</span><p>The retriever supplies <i>p(z | x)</i> (which documents matter for question <i>x</i>) and the generator supplies <i>p(y | x, z)</i> (the answer given those documents). In practice systems often use the top few documents. Errors can arise from either factor: wrong documents, or an unfaithful use of right ones. Faithfulness to the retrieved text is itself something to measure, not assume.</p>`},
     notes:{say:'"One of the best defenses is to give the model something to cite, and to hold it to that."',demo:'Toggle Retrieval ON/OFF and select which documents are retrieved. The answer changes accordingly. SCRIPTED: no search or model runs.',facilitate:'Ask which document would worry them most if retrieved (vendor marketing).',misc:'RAG removes hallucination.',follow:'How would you evaluate whether answers match their citations?',caveat:'Quality depends on the document collection, retrieval method and prompt.',transition:'"Let’s check understanding."'}},
    {id:'c3-quiz',type:'quiz',title:'Check Your Understanding: Chapter 3',minutes:2,station:900,
     questions:[
      {id:'q3a',level:'Foundational',kind:'Multiple choice',q:'Which best defines an AI hallucination?',opts:['A visual glitch on screen','Generated content that is unsupported by reliable sources or the provided input but presented as true','Any answer the user dislikes','A deliberate lie from the model'],ans:1,why:'Hallucination refers to unsupported or fabricated content. It is not intentional deception, and disagreement alone does not make an answer one.'},
      {id:'q3b',level:'Applied',kind:'Evidence evaluation',q:'A chatbot gives a full citation. What is the best verification step?',opts:['Ask the same chatbot "Is this real?"','Look it up in a library database or resolve the DOI, then read the relevant passage','Check that the formatting looks right','Trust it if the journal name sounds familiar'],ans:1,why:'Independent sources are needed. Asking the same system for confirmation is weak evidence, since it can generate a confident confirmation too.'},
      {id:'q3c',level:'Challenging',kind:'Application scenario',q:'Your assistant retrieves a source and cites it, but the cited passage says "no significant effect" while the answer says "improves scores." What happened?',opts:['The source is wrong','The answer misrepresents the source: a fidelity error that grounding does not prevent','This cannot happen with retrieval','The retrieval engine fabricated the source'],ans:1,why:'Retrieval makes checking possible, but generated summaries can still diverge from the source. That is why you compare claim and passage.'},
      {id:'q3d',level:'Reflection',kind:'Reflection',reflect:true,q:'Why might a highly capable language model generate a persuasive explanation that is factually incorrect?',
       points:['The training objective rewards plausible text, and decoding always yields some continuation.','Gaps, errors or conflicts in training data; rare facts; ambiguous or out-of-window context.','Fluent tone and polished structure are independent of truth, and humans tend to read fluency as competence.','Mitigations: ask for sources, retrieve from trusted documents, verify independently, and match checking effort to stakes.']}],
     notes:{say:'Use Q3d as a closing think–pair–share.',facilitate:'Press A to reveal answers.'}}
  ]
});

/* ---------------------------- CHAPTER 4 · DECISION OBSERVATORY ---------------------------- */
CHAPTERS.push({
  id:4,key:'observatory',title:'The Educational Decision Observatory',short:'Automation Bias',env:'obs',fx:'obs',door:4,
  topic:'Automation Bias',
  essential:'When does AI support professional judgment, and when does reliance on AI begin to replace it?',
  objectives:['Define automation bias and distinguish errors of commission from errors of omission.','Distinguish automation bias from algorithmic bias.','Identify conditions that increase over-reliance (workload, perceived authority, opaque systems).','Describe practices that support meaningful human oversight.','Preserve human accountability for consequential educational decisions.'],
  summary:['Automation bias: tendency to over-rely on automated suggestions, neglecting contradicting information or skipping verification.','Errors of commission: acting on a wrong recommendation. Errors of omission: missing a problem because the system did not flag it.','Algorithmic bias (in the system) and automation bias (in the human–system interaction) are different and can compound.','Oversight must be designed in: time, information, authority and accountability to override.'],
  refs:['parasuraman2010','skitka1999','mosier1998','goddard2012','dietvorst2015','logg2019','obermeyer2019','buolamwini2018'],
  guide:{facilitation:'Be careful not to shame participants for trusting the AI in the demos: the aim is to show how natural that is. Normalize the lesson as a property of human cognition under load.',transitions:'Bridge: "If we should neither blindly accept nor reflexively reject, what is the productive partnership? The Collaboration Center."',qual:['Automation bias is well documented in aviation, medicine and other fields; evidence in K-12 education settings is more limited. The student scenario here is fictional and illustrative.','The Trust Experiment is a classroom demonstration. It cannot establish how people in general respond to AI versus human attributions; research on algorithm aversion and appreciation is mixed.']},
  scenes:[
    {id:'c4-bias',type:'concept',title:'Automation Bias',minutes:2,station:420,
     concept:{term:'Automation bias · errors of commission and omission',
       def:'Automation bias is the tendency to over-rely on automated recommendations or decision aids, so that people accept them without adequate checking or fail to notice contradicting information. An error of commission is following an incorrect recommendation; an error of omission is failing to act because the system did not alert you (Mosier et al., 1998; Parasuraman & Manzey, 2010).',
       explain:'Automation often performs well, which builds trust, and people under time pressure conserve effort by deferring to it. A confident presentation, a numeric score or an official interface can create perceived authority. The result is that human checking declines exactly when it is needed, on the rare occasion when the system is wrong.',
       analogy:'GPS: it is usually right, so we stop watching the road. Then one day it routes a car onto a closed bridge.',
       mechanism:'Research on human use of automation links over-reliance to complacency (reduced monitoring) and to treating the automated output as a heuristic substitute for careful search (Skitka et al., 1999; Parasuraman & Manzey, 2010). Workload, trust, system opacity and training all matter, and systematic reviews have examined mitigators (Goddard et al., 2012).',
       classroom:'Examples: accepting an early-warning flag without reviewing the student’s context; approving an AI-generated test key without solving the items; assuming no flag means no concern (omission).',
       misconception:'"If a teacher is in the loop, there is oversight." A person who rubber-stamps recommendations is nominally in the loop but not exercising judgment.',
       discuss:'In your setting, who actually reviews AI-assisted recommendations, how much time do they have, and what information do they see?',
       check:{q:'An alert system fails to flag a struggling student and no one follows up because "the system would have told us." This is best described as:',opts:['Error of commission','Error of omission linked to automation bias','Algorithmic bias only','Hallucination'],ans:1,why:'Failing to act because the system did not flag is an omission error, a classic manifestation of over-reliance on automated monitoring.'},
       visual:'autobias',demo:'c4-support'},
     deeper:{title:'Human factors behind over-reliance',html:`<p>Parasuraman &amp; Manzey (2010) integrate evidence that complacency and automation bias share an attentional basis: when attention is limited, automated cues guide what gets sampled and checked. Key moderating factors include:</p><ul><li><b>Workload and multitasking</b>: higher load increases deference.</li><li><b>Experience and reliability history</b>: consistent success breeds trust that persists past the system’s limits.</li><li><b>Accountability and training</b>: making people accountable for outcomes, and training them on system failure modes, can reduce bias.</li><li><b>Interface design</b>: showing evidence and uncertainty, rather than only a verdict, supports checking.</li></ul><p>Not all reliance is a mistake: <b>appropriate reliance</b> means trusting in proportion to demonstrated reliability for this task. The goal is calibration, not distrust.</p>`},
     notes:{say:'"The danger is not that the AI is sometimes wrong. People are sometimes wrong too. The danger is that we stop checking."',demo:'In the figure, drag AI accuracy and the share of recommendations accepted without checking; errors reaching students rise with reliance. SIMPLIFIED SIMULATION with made-up parameters, not empirical rates.',facilitate:'Ask: "What is the minimum evidence you would want to see before acting on a referral recommendation?"',misc:'That automation bias only affects novices (research shows experts too).',follow:'How could an interface make checking easier rather than harder?',caveat:'Evidence is strongest outside education; extrapolate with care.',transition:'"Let’s put you in the decision seat."'}},
    {id:'c4-support',type:'lab',title:'Laboratory A: Student Support Recommendation',minutes:2,station:820,sim:'supportrec',
     lab:{purpose:'Decide whether to accept an AI-generated intervention recommendation, with the option to investigate first.',steps:['Commit to Accept, Reject or Investigate before revealing anything.','Reveal context items one at a time.','Decide again and read the feedback.'],prompt:'What would you need to see in an interface to make a good decision quickly?',classroom:'Real early-warning tools should expose the evidence, uncertainty and alternatives, not only a score.'},
     notes:{say:'"A system hands you a score and a recommendation. You have 90 seconds. What do you do?"',demo:'SCRIPTED scenario with a fictional student. Feedback depends on whether the participant investigated before deciding.',facilitate:'Run it as a class vote. Compare early deciders vs. investigators and ask what changed.',misc:'That the right answer is to reject the AI. The right move is informed human judgment.',follow:'Who is accountable if the referral is wrong, and how would you document your reasoning?',caveat:'The risk score is invented; real models vary in calibration.',transition:'"Now a different failure: a quiz written by AI."'}},
    {id:'c4-assess',type:'lab',title:'Laboratory B: AI Assessment Error',minutes:2,station:1220,sim:'assesserror',
     lab:{purpose:'Identify which AI-generated test questions contain subtle errors.',steps:['Mark each item as fine or flawed before revealing.','Reveal and read the explanation.','Notice how formatting and an answer key signal authority.'],prompt:'How much checking is proportionate for a low-stakes quiz vs. a final exam?',classroom:'Solve every generated item yourself before using it. Errors affect every student who takes the test.'},
     notes:{say:'"Four items, all neatly formatted with answer keys. How many would you have caught if you were in a hurry?"',demo:'SCRIPTED items. Two contain errors (an inverted fraction division key; the axial-tilt misconception) and two are correct, to show that checking should be proportional, not paranoid.',facilitate:'Have participants solve item 1 by hand before revealing.',misc:'Assuming errors are always obvious or always present.',follow:'What process could make item review fast and reliable at your school?',caveat:'Not a statistical claim about how often AI generates incorrect items.',transition:'"Does where the advice comes from change how much we trust it?"'}},
    {id:'c4-trust',type:'lab',title:'Laboratory C: Trust Experiment',minutes:1,station:1620,sim:'trust',
     lab:{purpose:'Rate identical recommendations attributed first to AI or a coach, then with the labels swapped.',steps:['Rate Round 1.','Swap labels and rate again.','Compare the differences and discuss.'],prompt:'Did the label change your rating? What does that suggest about how we evaluate advice?',classroom:'A starting point for discussing source credibility with students.'},
     notes:{say:'"Same text, different label. Notice what happens to your own ratings."',demo:'SCRIPTED classroom demonstration, not a validated experiment. Labels are swapped in round 2 while the text stays identical.',facilitate:'Do a quick show of hands for the ratings; do not interpret class results as research findings.',misc:'That any difference proves AI is trusted more or less in general; the literature shows mixed results depending on context (Dietvorst et al., 2015; Logg et al., 2019).',follow:'What would a proper study of this question require?',caveat:'One person’s ratings cannot show general patterns.',transition:'"A last distinction before we leave the observatory."'}},
    {id:'c4-oversight',type:'concept',title:'Two Biases, One Safeguard: Oversight',minutes:1,station:420,
     concept:{term:'Algorithmic bias versus automation bias; meaningful oversight',
       def:'Algorithmic bias is systematic unfairness in an automated system’s outputs, arising from data, design or deployment. Automation bias is a human tendency to over-rely on such outputs. Meaningful oversight is review by a person with the time, information and authority to question and override.',
       explain:'A scoring tool trained on unrepresentative data may disadvantage some students (system-side). A busy administrator who accepts every flag (human-side) lets that disadvantage pass unchallenged. Fixing the data does not remove the need for human checking, and human checking does not repair a biased system.',
       analogy:'A biased scale and a person who never rechecks the reading: replacing either alone does not solve the problem.',
       mechanism:'Documented examples of algorithmic bias include a health-care risk algorithm that used cost as a proxy for need and under-identified Black patients (Obermeyer et al., 2019) and accuracy disparities in commercial gender classification (Buolamwini & Gebru, 2018). Oversight helps only if reviewers can see evidence, are not rushed, and have a real option to override.',
       classroom:'Ask vendors: What data was it trained on? How is performance checked across student groups? What does the interface show reviewers? How are overrides recorded?',
       misconception:'"If the algorithm is unbiased, we can trust its recommendations." Even a well-performing system is sometimes wrong; accountable people still need to check consequential decisions.',
       discuss:'Which is harder to fix in your school: a biased tool or an over-reliant workflow? What does each require?',
       check:{q:'Which practice most supports meaningful oversight of an AI referral tool?',opts:['Requiring reviewers to approve all flags within 5 seconds','Showing the evidence behind a flag, allowing time, requiring a note of independent evidence and making overrides easy and tracked','Hiding the model’s score to prevent bias','Removing humans from the loop to avoid inconsistency'],ans:1,why:'Oversight needs information, time and authority. Speed pressure and rubber-stamping defeat it; hiding evidence or removing people removes accountability.'},
       visual:'biases'},
     notes:{say:'"Two different problems with two different fixes. We need both."',demo:'Click each card in the figure for the definition.',facilitate:'Ask for one concrete oversight design change they could make this term.',misc:'Treating "bias" as a single thing.',follow:'Who has authority to override in your building, and is that used?',caveat:'Examples are from health care and face analysis, not education; they illustrate mechanisms that are relevant when educational tools use similar methods.',transition:'"Let’s check understanding."'}},
    {id:'c4-quiz',type:'quiz',title:'Check Your Understanding: Chapter 4',minutes:2,station:900,
     questions:[
      {id:'q4a',level:'Foundational',kind:'Multiple choice',q:'Automation bias is best described as:',opts:['A programmer’s prejudice','Over-reliance on automated recommendations, accepting them without adequate checking','A model trained on biased data','Distrust of every automated tool'],ans:1,why:'Automation bias concerns the human–system interaction: deferring to automation. Biased training data is algorithmic bias; blanket distrust is a different problem.'},
      {id:'q4b',level:'Applied',kind:'Misconception identification',q:'"Algorithmic bias and automation bias are the same thing." Evaluate.',opts:['True: they are synonyms','False: one is unfairness in the system’s outputs, the other is human over-reliance; they can compound','False: automation bias only affects computers','True, but only in education'],ans:1,why:'They are distinct: one lives in the system, the other in the user’s decision process. A biased output plus a deferential reviewer is the worst combination.'},
      {id:'q4c',level:'Challenging',kind:'Application scenario',q:'An AI tool recommends removing a student from an advanced class. The teacher notices the student’s data has not updated since a move. Best next step?',opts:['Follow the recommendation: the model has more data','Ignore all AI tools from now on','Investigate the data and context, consult the student/family as appropriate, document the reasoning, and decide as the accountable professional','Ask the AI to double-check itself and accept the answer'],ans:2,why:'The professional’s role is to weigh evidence, including known data limitations, and remain accountable. Asking the same system to verify itself is weak.'},
      {id:'q4d',level:'Reflection',kind:'Reflection',reflect:true,q:'When does AI support professional judgment, and when does reliance on AI begin to replace it?',
       points:['Support: AI surfaces information or options and the person weighs evidence, can explain the decision and can override.','Replacement: recommendations are accepted by default, checking declines, accountability is unclear, or the person cannot explain why.','Stakes matter: more consequential and less reversible decisions warrant stronger oversight.','Design matters: time, evidence display, training, and a culture where overriding is normal.']}],
     notes:{say:'Use Q4d for pair discussion.',facilitate:'Press A to reveal.'}}
  ]
});

/* ---------------------------- CHAPTER 5 · COLLABORATION CENTER ---------------------------- */
CHAPTERS.push({
  id:5,key:'collab',title:'The Human–Machine Collaboration Center',short:'Human and Machine',env:'collab',fx:'collab',door:5,
  topic:'Human and Machine',
  essential:'What should educators and students continue to learn and demonstrate independently when AI can already produce increasingly sophisticated answers?',
  objectives:['Distinguish performance (producing a good output) from understanding (what a learner can do and explain unaided).','Sort educational tasks by how much human judgment they require, justifying the reasoning.','Compare human-only, uncritical AI use and human-directed AI collaboration with verification.','Draft a short set of responsible-AI principles for a classroom or school.','Identify privacy, fairness, accessibility and agency considerations in AI use.'],
  summary:['Complementary strengths: speed, breadth and pattern-finding vs. context, care, values and accountability.','Performance with AI ≠ understanding; design tasks so key thinking still happens.','Keep consequential, relational and value-laden decisions with accountable humans.','Principles must be chosen, balanced and operationalized, not just listed.','The goal of AI literacy is informed, responsible judgment, not tool fluency alone.'],
  refs:['miao2023','kasneci2023','bjork2011','long2020','ng2021'],

const Modal={

    const ov=$('#overlay');this.prevFocus=document.activeElement;this.onClose=o.onClose||null;

      h('button',{class:'btn x',type:'button',onclick:()=>Modal.close(),'aria-label':'Close dialog'},'Close ✕'),

/* ---------- reusable multiple-choice component ---------- */
function MCQ(q,key,store,instant){
  const el=h('div');let pick=null,shown=false;
  const prev=store[key];if(prev&&instant){pick=prev.pick;shown=true;}
  function draw(){
    el.innerHTML='';
    q.opts.forEach((o,i)=>{
      let cls='opt';if(shown){if(i===q.ans)cls+=' right';else if(i===pick)cls+=' wrong';}else if(i===pick)cls+=' sel';
      el.appendChild(h('button',{class:cls,type:'button','aria-pressed':String(i===pick),onclick:()=>{if(shown&&instant)return;pick=i;if(instant)reveal();else draw();}},String.fromCharCode(65+i)+'.  '+o));
    });
    if(shown)el.appendChild(h('div',{class:'fb',role:'status'},h('b',{},pick==null?'Answer shown. ':pick===q.ans?'Correct. ':'Not quite. '),q.why));
  }
  function reveal(){shown=true;if(pick!=null){store[key]={pick,ok:pick===q.ans};saveState();if(pick===q.ans)Avatar.react();HUD.update();}draw();}
  function hide(){if(instant)return;shown=false;draw();}
  draw();
  return{el,reveal,toggle(){shown?hide():reveal();}};
}

/* ---------- pacing ---------- */
const Pace={
  plan(){const o=[];CHAPTERS.forEach((C,ci)=>C.scenes.forEach((s,si)=>{if(s.minutes>0&&(!s.optional||S.target===90))o.push({ci,si,m:s.minutes});}));return o;},
  factor(){const t=this.plan().reduce((a,b)=>a+b.m,0);return S.target/t;},
  endOf(ci,si){const f=this.factor();let acc=0;for(const e of this.plan()){acc+=e.m*f;if(e.ci===ci&&e.si===si)return acc;if(e.ci>ci||(e.ci===ci&&e.si>si))return acc-e.m*f;}return acc;},
  chapterMinutes(ci){const f=this.factor();return this.plan().filter(e=>e.ci===ci).reduce((a,b)=>a+b.m*f,0);},
  elapsedMin(){return S.timer.elapsed/60000;},
  tick(){
    if(S.timer.running){const n=performance.now();S.timer.elapsed+=n-S.timer.last;S.timer.last=n;}
    this.draw();
  },
  toggle(){if(S.timer.running){this.tick();S.timer.running=false;}else{S.timer.running=true;S.timer.last=performance.now();}this.draw();},
  reset(){S.timer.running=false;S.timer.elapsed=0;this.draw();},
  mmss(m){const s=Math.floor(m*60);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');},
  draw(){

/* ---------- navigation ---------- */
const Nav={
  navId:0,inited:false,beat:0,onAnswer:null,onBeat:null,handle:null,envCh:-1,
  skipOpt(){return S.mode==='instructor'&&S.target<90;},
  seq(){const o=[];CHAPTERS.forEach((C,ci)=>C.scenes.forEach((s,si)=>{if(s.optional&&this.skipOpt())return;o.push([ci,si]);}));return o;},
  find(id){for(let c=0;c<CHAPTERS.length;c++){const i=CHAPTERS[c].scenes.findIndex(s=>s.id===id);if(i>=0)return[c,i];}return null;},
  isDone(ch){return CHAPTERS[ch].scenes.every((s,i)=>s.optional||S.visited[ch+':'+i]);},
  unlocked(ch){return S.mode==='instructor'||ch<=1||this.isDone(ch-1);},
  ord(c,s){return c*1000+s;},
  next(){
    if(Cine.active){Cine.skip();return;}
    const q=this.seq().filter(([c,s])=>this.ord(c,s)>this.ord(S.ch,S.sc))[0];
    if(!q){toast('End of the lecture. Use the map to revisit any chapter.');return;}
    this.go(q[0],q[1]);
  },
  prev(){
    const q=this.seq().filter(([c,s])=>this.ord(c,s)<this.ord(S.ch,S.sc)).pop();
    if(!q){toast('This is the first scene.');return;}
    this.go(q[0],q[1],{cut:q[0]===S.ch});
  },
  travelTo(i){this.go(i,0);},
  goScene(id){const f=this.find(id);if(f)this.go(f[0],f[1]);},
  hub(){this.go(0,CHAPTERS[0].scenes.length-1);},
  async go(ch,sc=0,o={}){
    ch=clamp(ch,0,CHAPTERS.length-1);sc=clamp(sc,0,CHAPTERS[ch].scenes.length-1);
    if(!this.unlocked(ch)){toast('Complete the previous chapter to unlock this building.');return;}
    const id=++this.navId;Cine.cancel();if(Avatar.cin)Avatar.cin.dead=true;
    const from=S.ch,travel=this.inited&&ch!==from&&!o.cut&&!(S.mode==='instructor'&&o.cut);
    if(travel){await this.travel(from,ch);if(id!==this.navId)return;}
    S.ch=ch;S.sc=sc;this.beat=0;
    await this.show(id);
  },
  /* walk out of the current building / across campus / into the next one */
  async travel(from,to){
    const fadeMs=350;
    await Cine.run(async c=>{
      const inEnv=View.mode==='env';
      if(inEnv){
        const door=Campus.centers[Math.max(0,Math.min(4,this.envCh-1))];
        await fadeC(c,true,fadeMs);
        View.showCampus(false);Campus.setDusk(false);
        View.avatarCampus(door,{bottom:195,scale:.62});Avatar.el.style.opacity=0;Avatar.face(-1);
        Campus.setCam(Campus.followTarget(door));Campus.openDoor(this.envCh,false);
        await fadeC(c,false,fadeMs);
        Campus.openDoor(this.envCh,true);await c.wait(450);
        await c.tween(650,p=>{Avatar.el.style.opacity=p;Avatar.el.style.setProperty('--sc',lerp(.62,.9,p));Avatar.el.style.bottom=lerp(195,135,p)+'px';});
        Campus.openDoor(this.envCh,false);this.envCh=-1;
      }else if(Avatar.el.parentNode!==Campus.near){View.avatarCampus(300);}
      if(to>=1&&to<=5){
        const tx=Campus.centers[to-1];Campus.highlight(to);
        await Avatar.walkTo(tx,{cin:c,onStep:x=>Campus.setCam(Campus.followTarget(x))});
        Campus.openDoor(to,true);await c.wait(400);
        await c.tween(550,p=>{Avatar.el.style.opacity=1-p;Avatar.el.style.setProperty('--sc',lerp(.9,.62,p));Avatar.el.style.bottom=lerp(135,195,p)+'px';});
        await fadeC(c,true,fadeMs);Campus.openDoor(to,false);
      }
    });
  },
  async show(id){
    const C=CHAPTERS[S.ch],sc=C.scenes[S.sc];
    S.visited[S.ch+':'+S.sc]=true;saveState();
    this.onAnswer=null;this.onBeat=null;this.handle=null;
    Cap.set('');showTitle('');$('#flash').style.opacity=0;
    const panel=$('#panel');panel.innerHTML='';panel.className='panel hidden';
    if(Avatar.el)Avatar.el.classList.remove('walking','wave','react');
    $('#hubcard').classList.add('hidden');
    document.body.dataset.type=sc.type;
    HUD.update();Notes.render();announce(`${C.title}. ${sc.title}`);
    const campusScene=C.env==='campus';
    if(sc.type==='cinema'){
      if(sc.cine==='opening')await Cinematics.opening(sc);else if(sc.cine==='portal'){await Cinematics.portal(sc);this.envCh=2;}else await Cinematics.ret(sc);
      if(id!==this.navId)return;
      if(sc.cine==='portal')this.envCh=2;
      $('#fade').classList.remove('on');return;
    }
    $('#fade').classList.remove('on');
    if(campusScene){
      const dusk=S.ch===6;
      if(View.mode!=='campus'||Avatar.el.parentNode!==Campus.near)View.showCampus(dusk);else{Campus.setDusk(dusk);FX.set(dusk?'dusk':'campus');}
      Avatar.el.style.setProperty('--sc',.9);Avatar.el.style.bottom='135px';Avatar.el.style.opacity=1;
      let tx=Avatar.x;
      if(sc.type==='hub'){const nxt=this.nextBuilding();tx=Campus.centers[nxt-1]-330;Campus.highlight(nxt);}
      else{Campus.highlight(0);tx=S.ch===6?520:(sc.station||520);if(tx>1500)tx=520;}
      if(Avatar.x>Campus.W)Avatar.setX(300);
      if(sc.type==='hub'){Avatar.setX(clamp(Avatar.x,0,Campus.W));}
      const walk=Avatar.walkTo(tx,{onStep:x=>Campus.setCam(Campus.followTarget(x))});
      if(S.prefs.reduced||Math.abs(tx-Avatar.x)<2)Campus.setCam(Campus.followTarget(tx));
      walk.then(()=>{if(id===this.navId){Campus.setCam(Campus.followTarget(Avatar.x));}});
    }else{
      const entering=this.envCh!==S.ch||View.mode!=='env';
      const envName=sc.env||C.env,fx=C.fx;
      if(View.mode!=='env'||Env.cur!==envName)View.showEnv(envName,fx);else FX.set(fx);
      if(entering||Avatar.el.parentNode!==$('#avatarHost')){View.avatarEnv(80);Avatar.face(1);}
      this.envCh=S.ch;
      Avatar.walkTo(sc.station||900);
    }
    // panel
    panel.className='panel'+(campusScene?' short':'');
    panel.setAttribute('aria-label',sc.title);
    const builders={concept:buildConcept,lab:buildLab,quiz:buildQuiz,discuss:buildDiscuss,finale:buildFinale};
    if(sc.type==='hub'){panel.classList.add('hidden');buildHub(C,sc);}
    else{
      try{panel.append(builders[sc.type](C,sc));}
      catch(e){console.error(e);panel.append(h('div',{class:'callout bad'},'This scene could not be displayed: '+e.message));}
    }
    HUD.update();
  },
  nextBuilding(){
    for(let i=1;i<=5;i++)if(!S.visited[i+':0']&&this.unlocked(i))return i;
    return clamp((S.lastCh||0)+1,1,5);
  },
  deeper(){
    const sc=CHAPTERS[S.ch].scenes[S.sc];
    if(!sc.deeper){toast('No Dive Deeper material for this scene.');return;}
    Modal.open('Dive Deeper: '+sc.deeper.title,h('div',{class:'tabbody',html:sc.deeper.html+'<p class="sub" style="font-size:.8em">Optional advanced material: skip it freely; the main lecture does not depend on it.</p>'}),{width:'1200px'});
  },
  revealNext(){if(this.onBeat)this.onBeat();},
  toggleAnswer(){if(this.onAnswer)this.onAnswer();else toast('Nothing to reveal in this scene.');},
  replay(){
    const sc=CHAPTERS[S.ch].scenes[S.sc];
    if(sc.type==='lab'&&this.handle&&this.handle.replay){this.handle.replay();return;}
    this.beat=0;this.go(S.ch,S.sc,{cut:true});
  }
};

function buildConcept(C,sc){
  const c=sc.concept;
  const ORDER=[['def','Define'],['explain','Explain'],['analogy','Analogy'],['mechanism','How it works'],['classroom','In the classroom'],['misconception','Misconception'],['discuss','Discuss'],['check','Check']].filter(t=>c[t[0]]);

    tabs.innerHTML='';ORDER.forEach(([k,l],i)=>tabs.appendChild(h('button',{class:'tab'+(i===cur?' on':'')+(seen.has(i)?' seen':''),role:'tab','aria-selected':String(i===cur),type:'button',onclick:()=>{cur=i;Nav.beat=i;seen.add(i);paint();}},l)));
