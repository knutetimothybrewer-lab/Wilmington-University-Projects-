<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="An interactive, cinematic 2.5D campus lecture for Wilmington University's AI Literacy for Educators. Works offline in a single file.">
<meta name="theme-color" content="#00693C">
<!--
  AI Literacy for Educators: {{HEADING}}
  Wilmington University. One portable file: inline CSS, JS and SVG. No server, API key, login or build step needed to RUN it.
  This file is generated by build.py from src/. To edit lecture content, change src/content*.js and run:  python3 build.py
  (or edit the CONTENT section of this file directly: the data blocks are plain JavaScript objects).
-->
<style>
/*__CSS__*/
</style>
</head>
<body class="instructor">
<noscript><p style="color:#fff;padding:2em">This lecture application needs JavaScript. Please enable it in your browser.</p></noscript>
<div id="viewport"><div id="stage" aria-label="Interactive lecture stage">
  <div id="campus" class="layer" style="z-index:0"></div>
  <div id="env" class="layer hidden" style="z-index:0" aria-hidden="true"></div>
  <canvas id="fx" class="layer" style="width:100%;height:100%;z-index:2;pointer-events:none" aria-hidden="true"></canvas>
  <div id="avatarHost" class="layer" style="z-index:5;pointer-events:none"></div>
  <div id="title" aria-hidden="true"></div>
  <div id="hubcard" class="hidden"></div>
  <main id="panel" class="panel hidden" tabindex="-1"></main>
  <header id="hud" role="banner">
    <button class="btn sm" id="homeBtn" type="button">Campus <kbd>H</kbd></button>
    <button class="btn sm" id="mapBtn" type="button">Map <kbd>M</kbd></button>
    <div class="title"><div class="t1" id="t1"></div><div class="t2" id="t2"></div></div>
    <div id="dots" role="group" aria-label="Scenes in this chapter"></div>
    <div id="pace" class="instr" role="button" tabindex="0" title="Click to start or pause the lecture timer. Alt+click resets it."></div>
    <div id="prog" class="stuline stu"></div>
    <button class="btn sm" id="modeBtn" type="button" title="Switch between Instructor and Student modes"></button>
    <button class="btn sm" id="pauseBtn" type="button">Pause</button>
    <button class="btn sm" id="replayBtn" type="button" title="Replay the animation or demonstration (R)">&#8635; Replay</button>
    <button class="btn sm" id="viewBtn" type="button" title="Hide or show the lesson panel (V)">Scene view</button>
    <button class="btn sm instr" id="notesBtn" type="button" title="Instructor notes (N)">Notes</button>
    <button class="btn sm" id="guideBtn" type="button" title="Teaching or study guide (G)">Guide</button>
    <button class="btn sm" id="fsBtn" type="button" title="Full screen (F)">Full</button>
    <button class="btn sm" id="setBtn" type="button">Settings</button>
    <button class="btn sm" id="helpBtn" type="button" aria-label="Keyboard help">?</button>
  </header>
  <div id="chbar" aria-hidden="true"><b></b></div>
  <div id="navL" class="fnav"><button class="btn" id="prevBtn" type="button">&#9666; Previous</button></div>
  <div id="navR" class="fnav"><button class="btn gold instr" id="revealBtn" type="button">Reveal &#9662;</button><button class="btn pri" id="nextBtn" type="button"><span class="nextlbl">Next</span> &#9656;</button></div>
  <div id="cap" class="hidden" role="status"></div>
  <button class="btn gold" id="skip" type="button">Skip cinematic &#9197; <kbd>S</kbd></button>
  <aside id="notes" aria-label="Instructor notes" aria-hidden="true">
    <div class="warnbar">INSTRUCTOR NOTES: visible if you share this window <button class="btn sm" id="notesPop" type="button">Pop out</button> <button class="btn sm" id="notesClose" type="button">Close</button></div>
    <div class="nb"></div>
  </aside>
  <div id="overlay"></div>
  <div id="toast" role="status"></div>
  <div id="flash"></div>
  <div id="fade"></div>
</div></div>
<div id="live" class="srOnly" aria-live="polite"></div>
<script>
/*__JS__*/
boot();
</script>
</body>
</html>
